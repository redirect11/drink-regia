  - id: REQ-FLOTTA-095
    title: "Gli orari di servizio del locale e la sospensione per pagamento fuori servizio"
    area: "functions/lib/orari-servizio.js, functions/lib/comunicazioni.js (emailRichiestaOrari, indirizziAdmin, accodaUnaVolta), functions/lib/registrazione.js (documentoRegistrazione), functions/lib/licenza.js (validaFino), functions/lib/taglio.js (licenzaDaScrivere, statoDal), functions/lib/scadenze.js (TIPI), functions/index.js (correggiOrari, chiediCambioOrari, decidiCambioOrari, scriviOrariAdmin, scriviLicenza, verificaLicenza, momentoDelloStato, il compito «sospensione», licenzaSegueIlPiano), src/lib/orari.js, src/lib/db.js, src/lib/rinnovo.js, src/pages/OrariSettimana.jsx, src/pages/OrariServizio.jsx, src/pages/Registrati.jsx, src/pages/Dashboard.jsx, src/pages/Backoffice.jsx (blocco Titolare), src/pages/RinnovoLocale.jsx, e2e/collaudo-registrazione.spec.js, docs/handover.md §7"
    description: >
      Daniele, 13/11/2026, in chat: «quando un cliente si registra deve
      specificare gli orari di servizio dell'esercizio. Decidiamo la
      sospensione per Stripe fuori dall'orario di servizio quindi di sicuro
      non subito. In base all'orario in cui gli viene attivato
      l'abbonamento fa fede quell'orario per decidere se disattivare prima
      o dopo l'orario di servizio che il cliente ha deciso. Orario di
      servizio che non può cambiare se non previa approvazione nostra e che
      deve essere dimostrato in qualche modo che effettivamente l'orario di
      servizio è cambiato. Se invece è semplicemente sbagliato, possiamo
      dare una settimana di tempo per cambiarlo se necessario dopo di che
      rimane quello e si può cambiare solo se approvato da me admin».
      Alle domande dello stesso giorno ha scelto: (a) la sospensione per
      pagamento cade alla STESSA ORA DEL GIORNO in cui è stato attivato
      l'abbonamento (attivato alle 10:00 → sospeso alle 10:00); se
      quell'ora cade dentro un intervallo di servizio si sposta al bordo:
      un'ora prima dell'apertura o alla chiusura (servizio 18:00–02:00,
      attivato alle 21:00 → sospeso alle 02:00); (b) gli orari sono UNO PER
      GIORNO della settimana, con apertura e chiusura (anche oltre la
      mezzanotte) oppure «chiuso»; (c) la prova per cambiarli è un MOTIVO
      SCRITTO del titolare: l'admin verifica come vuole e approva o rifiuta
      dal backoffice, nessun file nella regia. Al momento della
      sospensione: «Si ferma tutto così com'è. Alla riattivazione del
      servizio non si è mosso nulla e così deve essere» (la parte dell'app
      è di tana-drink). Le sospensioni dell'admin restano immediate, come
      oggi (REQ-FLOTTA-090). «L'app che si carica ed è sospesa si sospende
      subito» è lato tana-drink: i terminali ascoltano già la licenza in
      tempo reale. Questa voce scioglie il «punto debole» di REQ-FLOTTA-090
      sulla sospensione per pagamento.
      SUI DUBBI DELLA VOCE, Daniele, 13/11/2026: «per tutti i 10 i punti
      facciamo come dici», cioè: (7) un'ora che cade in servizio va SEMPRE
      alla chiusura, così il servizio non si interrompe mai a metà;
      nell'ora prima dell'apertura a un'ora prima dell'apertura, e se quel
      momento è già passato alla chiusura; (8) fra «non pagato» e la
      sospensione il locale lavora ancora fino a quasi due giorni: è
      accettato, una conseguenza nota (alla revisione del 13/11/2026 si
      diceva «circa un giorno», che era sbagliato; Daniele: «Tenere la
      regola così e accettare fino a quasi due giorni … ok»); (9) i locali aperti 24 ore, o con
      meno di un'ora fra la chiusura e l'apertura dopo, si registrano: se
      gli orari non lasciano un momento fuori servizio adatto, la
      sospensione cade all'ora dell'attivazione anche in servizio, e il
      titolare lo legge in un avviso alla registrazione e nella sua area;
      (10) i locali di prima e quelli creati dall'admin, senza orari,
      restano al taglio della giornata finché il titolare non li scrive.
      Vanno bene anche il motivo di almeno 10 caratteri, l'ora doppia di
      ottobre che vale la seconda, il compito «sospensione» e
      `abbonamento.dal` come ora dell'attivazione.
      CRITERI DI ACCETTAZIONE. (1) ALLA REGISTRAZIONE GLI ORARI SONO
      OBBLIGATORI: un passo «Orari» dopo «Il locale», un giorno per riga
      (lunedì…domenica) con apertura e chiusura o «chiuso»; orari in HH:MM
      (00:00–23:59); la chiusura prima dell'apertura vuol dire il giorno
      dopo; almeno un giorno aperto. Un giorno APERTO 24 ORE si scrive
      00:00–24:00 (Daniele, 13/11/2026: «se è h24 fai 0 - 24»): 24:00 vale
      solo come chiusura di un giorno che apre alle 00:00, e nel modulo c'è
      la casella «24 ore» (un campo orario non sa scrivere 24:00). Apertura
      uguale alla chiusura NON è valida, con un errore che suggerisce
      00:00–24:00 (fino alla revisione del 13/11/2026 voleva dire 24 ore:
      ambiguo con un errore di battitura). L'errore sta sul giorno. Aperti 24 ore o con meno di un'ora fra la chiusura di
      un giorno e l'apertura del giorno dopo si registrano (punto 9), con
      un avviso: «con questi orari la sospensione per mancato pagamento può
      arrivare durante il servizio» (giorniSenzaPausa). Il passo dice che
      per 7 giorni gli orari si correggono da sé e dopo solo con una
      richiesta approvata.
      Vale anche per chi completa la registrazione dopo l'accesso con
      Google. La regia (registraCliente) li ricontrolla e rifiuta senza
      orari validi (`invalid-argument`, campo `orari`). Il cliente nasce
      con `clienti/{uid}.orari_servizio` = `{ giorni, impostati_il,
      richiesta: null, storia: [] }`, IN CIMA AL DOCUMENTO e mai dentro
      `locale`: le regole lasciano al titolare solo locale, fatturazione,
      referente e consensi, quindi gli orari li scrivono solo le Functions
      e le regole non cambiano. Il giorno chiuso è `{ chiuso: true }`,
      quello aperto `{ apre, chiude }`. (2) PER 7 GIORNI da `impostati_il`
      il titolare li corregge da solo dall'area del titolare (una callable:
      ricontrolla gli orari, non fa ripartire i 7 giorni). Dal settimo
      giorno compiuto la correzione diretta si rifiuta
      (`failed-precondition`): il titolare manda una richiesta di cambio
      con gli orari nuovi e un motivo scritto (almeno 10 caratteri),
      diversi da quelli di oggi, una sola alla volta (`already-exists`);
      dentro i 7 giorni la richiesta non serve e si rifiuta. Gli orari non
      cambiano finché l'admin non decide. L'EMAIL ALL'ADMIN (Daniele,
      13/11/2026: «A me arriva solo la richiesta, poi rispondo io a mano al
      momento»): salvata la richiesta, parte UNA email all'admin con il
      locale (nome e slug), l'email del titolare, quando, il motivo e gli
      orari di prima e dopo giorno per giorno, dalla coda `mail` di
      REQ-FLOTTA-027. Una volta sola per richiesta: il documento della coda
      ha l'id della richiesta (uid e chiesta_il) e si crea solo se non c'è.
      I destinatari sono gli account col claim admin, attivi e con
      l'email: nel repository, pubblico, non c'è nessun indirizzo (la
      regia non aveva un indirizzo dell'admin né un'email che lo
      avvisasse: le richieste di contatto stanno solo in «Richieste»).
      Nessuna email al titolare con la decisione. Se l'email non parte la
      richiesta resta, e l'admin la trova nel backoffice. L'admin, dalla scheda del locale
      nel backoffice, vede la richiesta (prima, dopo, motivo, quando) e la
      approva o la rifiuta con una nota; solo l'admin (`permission-denied`
      altrimenti). Ogni cambio lascia la traccia in
      `orari_servizio.storia`: tipo (correzione, approvata, rifiutata), chi
      l'ha chiesto, quando, prima, dopo, motivo e, per le decisioni, chi ha
      deciso, quando era stata chiesta e la nota. Con gli orari ma senza
      una data valida (`impostati_il` mancante o rotto) il sito e la regia
      applicano la stessa regola: gli orari sono correggibili, e il primo
      salvataggio fa partire i 7 giorni (revisione del 13/11/2026, D8).
      GLI ORARI SCRITTI DALL'ADMIN (Daniele, 13/11/2026: «si»): dalla
      scheda del locale nel backoffice (blocco Titolare) l'admin scrive o
      corregge gli orari di qualunque locale in qualunque momento, anche di
      uno che non ne ha («Scrivi gli orari» / «Correggi gli orari»). Passa
      dalla callable scriviOrariAdmin, solo col claim admin
      (`permission-denied` altrimenti, anche al titolare sul suo locale),
      con l'uid del cliente controllato prima di farne un percorso e la
      stessa validazione degli orari (lib/orari-servizio.js, orariDellAdmin
      e scritturaDellAdmin). Lascia la traccia in `orari_servizio.storia`:
      tipo `admin`, chi (l'email dell'admin, o il suo uid), quando, prima,
      dopo, nota facoltativa. Una richiesta in attesa resta: l'admin la
      decide a parte. LA SCELTA SUI 7 GIORNI: se gli orari non avevano una
      data valida, la scrittura dell'admin NON fa partire i 7 giorni del
      titolare: `impostati_il` diventa l'istante della scrittura (la data
      resta vera) e un campo a parte, `orari_servizio.correggibili_fino`,
      vale lo stesso istante; correggibiliFino lo legge prima di
      `impostati_il`, nel sito e nella regia. Da sé il titolare non li
      corregge più, e per cambiarli manda la richiesta. Con una data
      valida, i 7 giorni restano quelli che erano. Dopo la scrittura le
      scadenze si ricalcolano come quando cambiano gli orari
      (licenzaSegueIlPiano, momentoSpostato: la licenza, valida_fino e il
      compito «sospensione»). (3) IL MOMENTO DELLA
      SOSPENSIONE PER PAGAMENTO, con Stripe e col pagamento a mano: l'ora
      del giorno dell'attivazione (criterio 4) sull'orologio di Roma
      (Europe/Rome), la prima che arriva da quando l'abbonamento passa a
      «non pagato» (o «disdetto»: la chiusura per pagamento segue la stessa
      strada); se cade in servizio si sposta SEMPRE alla chiusura di quel
      servizio, anche oltre la mezzanotte (l'1 di notte è ancora il
      servizio della sera prima); se cade nell'ora prima dell'apertura, a
      un'ora prima dell'apertura, e se quel momento è già passato alla
      chiusura. Il momento di arrivo deve essere ADATTO: fuori servizio e
      almeno un'ora prima della prossima apertura; se non lo è (aperto 24
      ore, o meno di un'ora fra chiusura e apertura), la sospensione cade
      all'ora dell'attivazione anche in servizio (punto 9). Un giorno
      chiuso non sposta niente. Col cambio dell'ora:
      l'ora resta quella dell'orologio (attivato alle 10 d'estate, sospeso
      alle 10 d'inverno); un'ora che quel giorno non c'è (marzo, fra le 2 e
      le 3) vale un'ora dopo; un'ora che quel giorno c'è due volte
      (ottobre) vale la seconda, che non cade mai in servizio. La
      sospensione e la chiusura per pagamento arrivano all'app (stato
      `sospesa`/`chiusa` in licenza/attuale e settings/bar.licenza) a quel
      momento, con un compito suo programmato come gli altri: il tipo
      «sospensione» in scadenze.TIPI, che quando arriva ricontrolla che il
      momento sia ancora quello e lo stato ancora fermo per il pagamento
      (compitoSospensioneValido); programmaScadenze lo rimette in coda. Il
      momento parte da quando la regia ha deciso (licenza_dal) o, se ha
      deciso entro un'ora dalla scadenza del pagamento, dalla scadenza:
      così coincide con valida_fino (revisione del 13/11/2026, D1;
      momentoDelloStato, logica pura). Subito prima di scrivere la licenza
      l'istanza si rilegge: se lo stato (licenza_stato, licenza_per,
      licenza_dal) o il momento atteso (sospensione_al.dal) sono cambiati
      (il compito e «riattiva» insieme) si ricalcola, fino a tre giri (D7,
      statoCambiato). Nel backoffice la riga del locale dice «sospensione il
      …» col giorno e l'ora di Roma, e finché la sospensione per pagamento
      aspetta il suo momento la scheda ha «Sospendi subito»: una
      sospensione dell'admin, immediata (D6). Da quel momento è dell'admin:
      il pagamento che arriva non la toglie da solo, si riattiva a mano. Chi paga prima del momento non riceve
      l'email «è di nuovo attivo»: il locale non si è mai fermato. Le
      riduzioni della licenza (moduli, terminali, limiti, il ripiego al
      Free) restano al taglio della giornata (REQ-FLOTTA-024). Chi paga
      prima del momento non viene sospeso: «riattiva» (REQ-FLOTTA-023)
      riscrive la licenza attiva e il compito, arrivato, non fa niente.
      `valida_fino` (il momento in cui l'app si ferma da sola anche senza
      rete) è lo stesso momento calcolato sulla scadenza del pagamento,
      non più il taglio dopo la scadenza. Le sospensioni e le chiusure
      dell'admin e del titolare restano immediate. Finché lo stato aspetta
      il suo momento, il riquadro del rinnovo (REQ-FLOTTA-090) dice «Il
      locale sta per essere sospeso» (o «chiuso», per la disdetta) e quando
      l'app si ferma, mai «è sospeso» o «è chiuso» mentre l'app lavora
      (revisione del 13/11/2026, D2). (4) L'ORA
      DELL'ATTIVAZIONE è `clienti/{uid}.abbonamento.dal`: la scrive il
      webhook di Stripe a `checkout.session.completed` (lib/abbonamento.js,
      l'istante in cui la regia lo lavora), la creazione a mano dall'admin
      (creaCliente) e gli sconti (che la tengono se c'è). Un nuovo
      checkout dopo una disdetta la riscrive. (5) I LOCALI DI PRIMA, senza
      orari: il momento resta il taglio della giornata di oggi
      (`settings/bar.business_day_cutoff_hour`, le 5 se manca), lo stesso
      per orari non validi; con gli orari ma senza `abbonamento.dal` l'ora
      è quella del taglio, passata per gli intervalli di servizio. Il
      titolare di un locale di prima scrive gli orari la prima volta dalla
      sua area, e da lì partono i suoi 7 giorni; l'area glieli chiede con
      un avviso finché mancano. Vale anche per i clienti creati dall'admin
      (punto 10). (6) IL CONTRATTO in docs/handover.md §7
      (la licenza): lo stato «sospesa» o «chiusa» voluto dal pagamento
      arriva fuori dal servizio del locale, al momento del criterio 3, e
      `valida_fino` è quello stesso momento; quelli dell'admin e del
      titolare subito. Gli orari restano nella regia: la licenza non li
      porta (se tana-drink li vuole, un campo nuovo è una decisione a
      parte).
      LE DECISIONI DI DANIELE DEL 13/11/2026 sulla revisione, con le sue
      frasi: (1) l'email della richiesta di cambio, «A me arriva solo la
      richiesta, poi rispondo io a mano al momento» (criterio 2); (2) gli
      orari scritti dall'admin, «si» (criterio 2); (3) il giorno aperto 24
      ore, «se è h24 fai 0 - 24» (criterio 1); (4) il ritardo della
      sospensione, «Tenere la regola così e accettare fino a quasi due
      giorni … ok» (sotto, conseguenza nota).
      FATTO IL 13/11/2026 (ramo feature/orari-di-servizio, #233). La logica
      in functions/lib/orari-servizio.js, con la copia per il sito in
      src/lib/orari.js (un test le confronta). Le callable correggiOrari,
      chiediCambioOrari (il cliente di chi chiama) e decidiCambioOrari
      (solo l'admin) scrivono in transazione (cambiaOrari). scriviLicenza
      calcola il momento dello stato per pagamento da `licenza_dal` (così
      riscrivere la licenza non lo sposta), trattiene lo stato fino ad
      allora anche al taglio (taglio.licenzaDaScrivere, `statoDal`),
      programma il compito «sospensione» e segna
      `istanze/{slug}.sospensione_al` = `{ dal, stato }`; verificaLicenza
      lo sa. La licenza si riscrive anche quando cambiano gli orari o
      `abbonamento.dal` (valida_fino). Nell'area del titolare gli orari
      stanno sotto «Il locale», e la panoramica li chiede finché mancano;
      nel backoffice stanno nel blocco Titolare della scheda (i blocchi
      restano sei, REQ-FLOTTA-089), con un avviso in testa quando c'è una
      richiesta. Il riquadro del rinnovo (REQ-FLOTTA-090) dice quando
      arriva la sospensione (`siFerma`). Le regole Firestore non cambiano:
      un test sull'emulatore prova che il titolare non scrive
      `orari_servizio`.
      CONSEGUENZA NOTA (punto 8): fra «non pagato» e la sospensione il
      locale lavora ancora FINO A QUASI DUE GIORNI (revisione del 13/11/2026,
      D4; Daniele: «Tenere la regola così e accettare fino a quasi due
      giorni … ok»). Due esempi, provati in tests/orari-servizio.test.js:
      servizio 18:00–02:00, attivato alle 21:30, «non pagato» deciso alle
      21:31: le 21:30 del giorno dopo sono in servizio, la chiusura è alle
      2 del giorno dopo ancora, 28,5 ore; servizio dalle 10 alle 08 del
      giorno dopo, attivato alle 10:01, deciso alle 10:02: 24 ore fino
      all'ora dell'attivazione, in servizio, e 22 fino alla chiusura,
      circa 46 ore. Con Stripe la scadenza cade all'ora dell'attivazione
      (D1), quindi di solito resta solo lo spostamento alla chiusura.
      PUNTI DEBOLI. L'ora di
      `abbonamento.dal` con Stripe è quella in cui la regia lavora
      l'evento, non quella del pagamento (di solito pochi secondi).
      «Adatto» guarda solo la chiusura del servizio in cui cade l'ora: un
      locale con la pausa solo in certi giorni può essere sospeso in
      servizio negli altri, e l'avviso lo dice per quei giorni. Il
      «dal» della licenza sospesa resta l'istante in cui la regia l'ha
      decisa, non quello in cui arriva all'app.
