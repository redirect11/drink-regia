      admin del locale, perché in tana-drink ogni admin crea altri admin,
      REQ-FLOTTA-050): «implementa 1 e 2».
      COME SI AGGIUNGE. Il titolare, in /dashboard/collaboratori, scrive
      l'email del collaboratore. La regia crea l'account se non c'è (senza
      password, come per un locale esistente) e lo collega al locale:
