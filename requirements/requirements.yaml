      Supera, per le etichette, quanto scritto in REQ-FLOTTA-015 e in
      DESIGN.md §5.4 («ogni funzione dice a quale modulo appartiene»);
      resta la regola che una funzione senza moduli in vendita non si
      vede.
      RESTA: i filmati definitivi di Incassa, Conta e Riordina; il
      bottone «Prova la demo», che porta a un sito non pubblicato.
