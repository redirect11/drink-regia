  - id: REQ-FLOTTA-064
    title: "Il backoffice non dice «Nessun cliente» quando non riesce a leggere: lo dice, e fa riprovare"
    area: "src/lib/db.js (elencoClienti, elencoIstanze, elencoRichieste), src/pages/Backoffice.jsx, e2e/collaudo-licenza.spec.js"
    description: >
