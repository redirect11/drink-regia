  - id: REQ-FLOTTA-059
    title: "L'admin elimina un cliente senza istanza: via l'account e i suoi dati nella regia"
    area: "functions/lib/eliminazione-cliente.js, functions/index.js (eliminaCliente), src/lib/db.js (eliminaCliente), src/pages/Backoffice.jsx (Elimina cliente…)"
    description: >
      Nato col collaudo dei rilasci (REQ-DEV-009), che si registra davvero
      sul test e poi deve sparire: il backoffice sapeva chiudere ed
      eliminare un'istanza col suo progetto (REQ-FLOTTA-014), non un
      cliente che non ha mai attivato. Serve anche fuori dal collaudo: chi
      si registra e ci ripensa ha diritto alla cancellazione (GDPR, art.
      17), e un cliente la cui istanza è già stata eliminata restava in
      elenco per sempre.
      LA REGOLA (lib/eliminazione-cliente.js, pura): si può eliminare un
      cliente senza istanza, o con l'istanza in stato «eliminata»; non si
      può se l'istanza ha un progetto vivo (prima si chiude e si elimina
      quella, dalla sua scheda: il progetto Google e il backup passano di
      lì) né con un'attivazione in coda o in corso. Si cancellano
      clienti/{uid} con la sottocollezione temi_su_misura, richieste/{slug},
      contatti/{uid} e contatti/{uid}_tema, istanze/{slug} (quella
      eliminata), e l'account di Auth (se non c'è più, va bene così).
      LA FUNCTION eliminaCliente (solo admin, slug nel formato dei progetti)
      legge cliente, istanza e richiesta, applica la regola, cancella in un
      batch e logga slug e uid (mai l'email). IL BACKOFFICE mostra «Elimina
      cliente…» nel gruppo «Cliente», a parte dalle azioni di tutti i
      giorni, solo per chi non ha un'istanza o ce l'ha eliminata e non ha
      un'attivazione in corso; chiede conferma con nome ed email e non si
      torna indietro.
