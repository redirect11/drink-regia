    description: >
      Richiesta da tana-drink, 05/11/2026. L'utente: «i temi esclusivi per
      la Tana dovrebbero essere anche visibili in regia, come se la Tana li
      avesse acquistati», «la regia deve sempre elencare moduli e temi
      acquistati in app», «deve essere sempre tutto sincronizzato».
      IL PROBLEMA: licenzaProtetta non scrive `temi`, e in tana-drink gli
