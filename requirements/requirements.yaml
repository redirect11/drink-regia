    description: >
      «Gli aggiornamenti vanno fatti a ondate. Con molti progetti, un
      rilascio va prima sul test, poi sulla Tana, poi su un primo gruppo,
      poi su tutti. La regia deve sapere quale versione gira in ogni locale
      e cosa fare se un aggiornamento fallisce. — Va bene gestiamolo»
      (l'utente, 27/10/2026).
      UN RILASCIO E' UN TAG vX.Y.Z di tana-drink, mai `main`: fra
      un'ondata e l'altra `main` puo' andare avanti. Il backoffice lo crea
      (riquadro «Rilasci», un rilascio aperto alla volta) e la Function
      `gestisciRilascio` fotografa le ondate in `rilasci/{tag}`: prova
      (gruppo «prova», istanze nostre), interna (interne ed esistenti, come
      la Tana), pilota (gruppo «pilota»), generale (tutte le altre attive;
      le chiuse no). Il gruppo lo sceglie l'admin, riga per riga.
      UN'ONDATA ALLA VOLTA: la avvia l'admin, e solo quando quella prima e'
      finita senza falliti, in corso o in attesa. Un locale esistente non
      si lancia: pubblica dal suo repository e l'ondata aspetta che
      riferisca la versione del tag.
