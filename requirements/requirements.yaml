  - id: REQ-FLOTTA-036

    title: "Il webhook di Stripe elabora ogni evento una volta sola, e un evento in ritardo non riporta indietro lo stato"
    area: "functions/lib/eventistripe.js, functions/lib/abbonamento.js (subscriptionDellaFattura), functions/index.js (stripeWebhook, elaboraEventoStripe), firestore.rules (eventi_stripe)"
    description: >
      Audit del 22/10/2026, M4: Stripe consegna ogni evento almeno una
      volta e non in ordine, e il webhook non teneva conto né dell'uno né
      dell'altro: un `invoice.paid` in ritardo riattivava un abbonamento
      disdetto.
      UNA VOLTA SOLA: ogni evento passa dal registro eventi_stripe/{event.id},
      preso in carico in transazione prima di ogni effetto. Già fatto: si
      risponde 200 senza rifare niente. In corso in un'altra istanza: 409, e
      Stripe lo ripete più tardi. Una presa in carico più vecchia di 5
      minuti (la Function morta a metà) si riprende. Se l'elaborazione
      fallisce la riga si toglie e si risponde 500: la ripetizione di
      Stripe riparte da capo, e ogni effetto resta ripetibile da sé (la
      ricarica per id di sessione, il posto Fondatori per uid, lo stato del
      cliente in ordine). Ogni riga ha `scade_il` (45 giorni) per la policy
      TTL di Firestore. Le regole: la legge l'admin, non la scrive nessun
      client.
      IN ORDINE: il cliente tiene `abbonamento.evento_stripe_creato`, l'ora
      (event.created) dell'ultimo evento che ne ha scritto lo stato. Un
      evento più vecchio non riscrive stato, piano, moduli, terminali e
      rinnovo; a parità di secondo si scrive. «Disdetto» non si riapre da un
      evento di Stripe (una subscription cancellata non torna attiva: un
      abbonamento nuovo passa dal Checkout); un abbonamento che l'admin ha
      messo fuori da Stripe non lo cambiano gli eventi della vecchia
      subscription; `pagato_fino` non torna indietro; l'ultimo pagamento e
      l'ultimo fallimento si scrivono sempre. La lettura e la scrittura del
      cliente sono nella stessa transazione.
      LA VERSIONE DELL'API: il webhook riceve gli eventi nella versione
      dell'endpoint registrato su Stripe, non in quella dell'SDK (stripe
      17.7, 2025-02-24.acacia). Dalla 2025-03-31.basil la subscription di
      una fattura non è più in `invoice.subscription` ma in
      `invoice.parent.subscription_details.subscription`
      (subscriptionDellaFattura legge tutte e due, e le righe).
    status: implemented
    generate_issue: true
    labels: [prodotto, regia, abbonamento, sicurezza]
    test_cases:
      - tests/eventistripe.test.js
      - tests/abbonamento.test.js

