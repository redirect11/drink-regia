      Function chiede ai-locale@ senza quel permesso, il deploy si ferma
      con iam.serviceaccounts.actAs … per tutte le Functions della Tana».
      E «REGIA_PROGETTO per la Tana lo scrivo io, e solo dopo» che account
      e permesso ci sono. (5) Per un locale esistente lo script dà anche
      `roles/iam.serviceAccountUser` sull'account `ai-locale` (non sul
      progetto) all'account di deploy di tana-drink,
      `firebase-adminsdk-fbsvc@<progetto>`. (6) La Tana non passa da
      «Aggiorna» della regia: un workflow suo, «Prepara l'AI di un locale
      esistente», fa account, ruoli e permesso su richiesta, sul test o in
      produzione, e si può rilanciare senza cambiare niente.
      PROVATO SUL TEST (12/11/2026, run 43286842706): l'aggiornamento di
      prova-bar con l'app di tana-drink feature/ai-dalla-regia ha creato
      ai-locale@drinkpos-prova-bar coi suoi ruoli, e ha pubblicato
