  - id: REQ-FLOTTA-046
    title: "Il cambio di piano del titolare su un abbonamento a mano: subito solo la riduzione, l'aumento è una richiesta all'assistenza"
    area: "functions/lib/cambiopiano.js (eRiduzione, decisioneManuale), functions/index.js (cambiaScelta, ramo manuale), src/pages/SceltaPiano.jsx (il messaggio con via 'richiesta')"
    description: >
      Audit di sicurezza del 09/11/2026, finding 5 (alta; era la M2 del
      22/10/2026). Con `abbonamento.origine === 'manuale'` (bonifico, piano
