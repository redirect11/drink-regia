      token del server dei metadati con un token Anthropic legato alla
      regola di federazione (i quattro id in functions/.env.<progetto>,
      non segreti). Senza la regola configurata resta ANTHROPIC_API_KEY.
      Lato Console, dall'utente: workspace «drink», account di servizio e
