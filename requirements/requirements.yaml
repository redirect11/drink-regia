  - id: REQ-FLOTTA-092
    title: "Il modello AI si sceglie per tipo di richiesta dal backoffice: Sonnet per tutti, all'inizio"
    area: "functions/piani.json (ai.prezzi_usd_per_milione), functions/lib/ai.js (TIPI_MODELLO, modelliDelListino, modelloPer, validaModelliAI, interrogaConPrenotazione), functions/index.js (interrogaClaude, gestisciModelliAI), src/lib/db.js (impostaModelliAI), src/pages/Backoffice.jsx (Vendita), firestore.rules (impostazioni)"
    description: >
      Daniele, 13/11/2026, in chat, alla domanda su quali richieste far
      passare a Sonnet: «Per tutto». Oggi la regia ha un solo modello per
      ogni richiesta (functions/piani.json → ai.modello, claude-opus-5-5):
      da qui ogni tipo di richiesta ha il suo, lo sceglie l'admin dal
      backoffice, e il valore iniziale è claude-sonnet-5-5 per tutti.
      Sulle scelte della prima stesura di questa voce (la sezione «Modelli
      AI» in «Vendita», le etichette, il salvataggio di un tipo alla
      volta), lo stesso giorno: «per tutti i 10 i punti facciamo come
      dici».
      CRITERI DI ACCETTAZIONE. (1) Il listino (functions/piani.json →
      ai.prezzi_usd_per_milione) ha claude-sonnet-5-5 con input 2, output
      10, cache_lettura 0.10 dollari per milione di token, dalla
      documentazione Anthropic del 03/11/2026 [da verificare sulla pagina
      dei prezzi prima del rilascio]. Gli altri prezzi non cambiano. (2) I
      tipi che hanno un modello sono descrizione, fattura, tema e chat
      (ai.TIPI_MODELLO). (3) I modelli che si possono scegliere sono
      quelli che hanno un prezzo nel listino, e solo quelli
      (ai.modelliDelListino): una richiesta che non si sa prezzare non
      parte. (4) La scelta si salva in impostazioni/regia come
      `ai_modelli: { <tipo>: <modello> }`. Senza una scelta per un tipo, o
      con un valore che non è un modello del listino (scritto a mano, o
      rimasto dopo che un modello è uscito dal listino), vale
      claude-sonnet-5-5 (ai.modelloPer). (5) Il server rilegge il modello a
      ogni richiesta: interrogaClaude legge impostazioni/regia e passa a
      interrogaConPrenotazione il modello del tipo; la chiamata
      (parametriClaude) usa quello, e il costo (costoMicroeuro) lo usa come
      modello chiesto, così un tentativo senza `model` in usage.iterations
      si paga al modello scelto. Il ripiego `fallbacks: 'default'` resta.
      La stima della prenotazione resta al prezzo più alto del listino
      (REQ-FLOTTA-088), qualunque sia il modello scelto. (6) La Function
      gestisciModelliAI salva la scelta: risponde solo all'admin
      (permission-denied prima di guardare i dati), accetta una mappa non
      vuota di tipi conosciuti con modelli del listino (ai.validaModelliAI,
      se no invalid-argument) e scrive solo quei tipi in
      impostazioni/regia.ai_modelli, con merge. (7) Nel backoffice, in
      «Vendita», la sezione «Modelli AI» ha una scelta per tipo
      (Descrizione, Fattura, Tema, Chat) coi soli modelli del listino;
      mostra la scelta salvata, o Sonnet; cambiarla chiama
      impostaModelliAI({ <tipo>: <modello> }) di src/lib/db.js, che passa
      dalla Function e non scrive il documento da sé. (8) LE REGOLE
      (Daniele, 13/11/2026, sulle regole di impostazioni/regia: «il modo più
      sicuro»): nessuno, nemmeno l'admin, scrive da client le chiavi
      `ai_modelli` e `limiti_chat` di impostazioni/regia, né crea, riscrive
      intero o cancella il documento quando le porta; `limiti_chat`
      arriverà con la chat (REQ-FLOTTA-094) e passerà dalla Function
      gestisciLimitiChat, ed è chiusa già da ora. Le altre chiavi che il
      backoffice scrive oggi (deploy_automatico, attivazione_simulata,
      aggiornate_il) e le altre impostazioni (impostazioni/aggiornamenti)
      restano come prima. Le Functions scrivono con l'Admin SDK, che le
      regole non le guarda. Il server continua a ricontrollare il modello
      col listino (criterio 4).
      PUNTI DEBOLI. (a) Il tipo «chat» oggi non esiste fra le richieste
      della regia (preparaMessaggio conosce descrizione, fattura e tema):
      la scelta si salva ma non viene usata finché la chat non arriva. (b)
      Chiuse le due chiavi, se gestisciModelliAI non risponde l'admin non
      ha un'altra strada dal sito per cambiare il modello. (c) Sonnet costa meno di
      Opus ma risponde in modo diverso: la qualità di fatture e temi con
      Sonnet non è provata da nessun test.
