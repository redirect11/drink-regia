    description: >
      Daniele, 12/11/2026, scoperto che con `nome+qualcosa@gmail.com` si
      registrano quanti locali si vuole: «le possiamo usare noi per test
      ma non dobbiamo accettarle in alcun modo da chi si registra. Se uno
      prova a registrarsi con una mail che già esiste, quindi anche con il
      + davanti, non può registrarsi perché ha già una sua utenza».
      CRITERI DI ACCETTAZIONE. (1) Chi si registra da sé con un'email col
      «+» viene fermato: nel modulo, accanto alla casella, prima di creare
      l'account; e dalla regia, che lo rifiuta comunque. (2) Ogni cliente
      ha la forma base della sua email (`email_norma`): minuscole, senza
      «+qualcosa» e, per Gmail, senza punti e con gmail.com. (3) La
      registrazione rifiuta un'email la cui forma base è già di un altro
      cliente, con «Esiste già un account con questa email: entra con
      quello.», nella stessa transazione che controlla lo slug. (4) L'admin
      dal backoffice («Nuovo locale») può ancora usare il «+», per le prove:
      quei clienti non riservano la forma base. (5) Per i clienti nati
      prima, nel backoffice (sezione «Rilasci», accanto a «Scadenze») c'è
      «Allinea le email», solo per l'admin: la regia scrive la forma base
      dove manca e mai per un'email col «+», e dice quanti clienti ha
      allineato; rifatto non cambia niente. Daniele, 13/11/2026, sullo
