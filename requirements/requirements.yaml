  - id: REQ-AI-003
    title: "Il cassetto AI nella regia: credito in euro per installazione, tetto mensile, ricarica con Stripe, e la Tana come locale esistente"
    area: "functions/lib/ai.js, functions/lib/esistente.js, functions/index.js (richiestaAI, creaRicaricaAI, gestisciCassettoAI, registraLocaleEsistente, stripeWebhook), firestore.rules (ai/), functions/piani.json (ai), src/pages/CreditoAI.jsx, src/pages/Backoffice.jsx, src/lib/ai.js"
    description: >
      La parte della regia di REQ-AI-003 di tana-drink. Decisione
      dell'utente del 24/10/2026: «un cassetto AI unico nella regia, per
      tutti i locali compresa la Tana».
      IL CREDITO: per installazione, in `ai/{slug}`, in micro-euro interi
      (credito, tetto mensile, speso del mese che riparte il primo del mese
      a mezzanotte italiana), con lo storico in `ai/{slug}/consumi` (tipo,
      modello, token, costo, esito: mai il contenuto) e in
      `ai/{slug}/ricariche`. Lo scrivono solo le Functions; il titolare lo
      legge nella dashboard, l'admin lo governa dal backoffice (ricarica a
      mano, tetto, acceso o spento, chiave).
      LA PORTA: `richiestaAI`, HTTP, chiamata dal server dell'installazione
      con `Authorization: Bearer <slug>.<segreto>`; la regia tiene solo
      l'impronta SHA-256 del segreto, in `ai/{slug}/riservato/chiave`, che
      nessun client legge. Accetta due richieste sole, `descrizione`
      (REQ-AI-002 di tana-drink) e `fattura` (REQ-AI-001: foto o PDF in
      base64), mai testo libero. Prima di chiamare controlla che il caso
      peggiore (tutti i token d'uscita permessi) stia nel credito e nel
      tetto; chiama Claude con la chiave della regia (`ANTHROPIC_API_KEY`,
      mai in un'installazione), modello del listino, output strutturati,
      fallback «default» di Anthropic; scala il costo vero dalla usage
      (per tentativo, al prezzo del modello che l'ha eseguito, cambio e
      ricarico del listino, per eccesso). Un credito finito ferma solo
      l'AI: risponde 402 e l'app lavora come sempre.
      LA RICARICA: a pacchetti (piani.json → ai.pacchetti), Checkout di
      Stripe in modalita' pagamento; il webhook accredita l'importo
      incassato una volta sola per sessione. IPOTESI in attesa della
      decisione dell'utente («pacchetti o consumo: da decidere»).
      LA TANA: `registraLocaleEsistente` la registra senza provisioning
      (nessuna richiesta), col suo progetto, piano completo, istanza
      `interna` ed `esistente` con `licenza_dalla_regia: false`: la
      sospensione dei morosi la salta, la regia non le scrive la licenza,
      e Aggiorna, Sospendi e Chiudi non la toccano.
      DA DECIDERE CON L'UTENTE: pacchetti o consumo, il ricarico, il cambio,
      gli importi dei pacchetti e il tetto predefinito (oggi segnaposto in
      piani.json, ricarico 1 = al costo).
      LATO APP (tana-drink): una Function dell'installazione che chiama
      `richiestaAI` con la chiave nei suoi segreti; contratto in
      docs/handover.md §7.
