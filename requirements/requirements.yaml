    area: "src/App.jsx (/dashboard/*), src/lib/areaTitolare.js, src/pages/Dashboard.jsx, src/pages/IlLocale.jsx, src/pages/SceltaPiano.jsx, src/pages/CreditoAI.jsx (senza), src/index.css, e2e/dashboard.spec.js, e2e/collaudo-registrazione.spec.js, e2e/aiuto.js (sezione)"
