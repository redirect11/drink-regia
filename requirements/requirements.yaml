      (origine manuale o sconto) non è un errore ma una richiesta
      all'assistenza: la regia scrive una richiesta di contatto
      (REQ-FLOTTA-017) in `contatti/<uid>_<modulo>`, con la scelta che
      l'admin deve scrivere e la nota «Dall'app: aggiungere …», e risponde
      `{ ok: true, in_attesa: true }`; l'app dice «richiesta inviata
      all'assistenza», l'admin la vede in «Richieste», la evade con «Cambia
      piano» fuori da Stripe e la segna gestita. La stessa richiesta ancora
      aperta non si ripete (409); una per modulo, così non cancella quella
      della dashboard né un altro modulo. Un modulo compreso nel piano non
      si disdice; uno in prova si spegne alla fine della prova. Disdire
      risponde `dal` = oggi: la subscription si aggiorna subito col
      conguaglio, e la licenza che toglie aspetta il taglio della giornata
      (REQ-FLOTTA-024). Nessun Checkout da qui: la licenza non cambia mai per
      un ritorno dal browser. Ogni cambio va nello storico del cliente con
      chi l'ha fatto (modo «app»). I motivi di puoProvare sono impersonali,
      perché l'app li mostra così come sono.
      LA BASE DI UN MODULO (tana-drink REQ-LIC-015, decisione dell'utente
      del 07/11/2026): un modulo del listino può richiederne un altro
      (`richiede` in piani.json). Oggi gli ordini dal telefono vogliono il
      menù digitale, perché il cliente ordina da lì. Senza la base (nel
      piano, comprata o in prova) il modulo non si prova e non si aggiunge,
      dall'app e dalla dashboard: «Ordini dal telefono del cliente richiede
      Menù digitale e tavoli.» (baseMancante in prove.js). L'app non mostra
      i tasti, ma la porta vera è questa.
      LA BASE IN OGNI PORTA (l'utente, 07/11/2026, dopo la PR #91: «risolvi
      i tre buchi»): (1) l'area clienti: il Checkout, il codice al 100% e il
      cambio di piano del titolare, «Cambia piano» dell'admin e la richiesta
      di contatto rifiutano una scelta con un modulo senza la sua base nel
      piano o fra i moduli scelti (problemaBasi in prove.js, lo stesso
      messaggio); nel sito la casella del modulo aspetta la base e,
      togliendo la base, se ne va con lei (src/lib/piani.js: richiedeDi,
      baseMancante, senzaOrfani; SceltaPiano, CambiaPiano, ProveModuli);
      (2) la base non si disdice dall'app finché un modulo che la richiede
      è comprato o in prova («Prima va tolto Ordini dal telefono del
      cliente, che richiede Menù digitale e tavoli.», chiLoRichiede);
      (3) una prova rimasta senza base si spegne con la base
      (proveDaTogliere): la prova del menù finita porta via anche quella
      degli ordini.
