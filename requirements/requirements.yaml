  - id: REQ-FLOTTA-023
    title: "Le scadenze a eventi: lo stato dell'abbonamento e un compito per ogni scadenza, niente giri quotidiani"
    area: "functions/lib/scadenze.js, functions/lib/abbonamento.js, functions/lib/cambiopiano.js, functions/index.js (scadenza, registraPagamento, programmaScadenze, licenzaSegueIlPiano), src/pages/Backoffice.jsx"
    description: >
      «Non possiamo mettere un qualcosa che tiene traccia del periodo delle
      licenze ed esegue operazioni in base ad eventi piuttosto che farlo
      ogni mattina? [...] Non mi piace la temporizzazione di questi
      check», poi «Ok procedi così» e, sul pagamento fuori da Stripe, «ok
      1» (l'utente, 31/10/2026). Via i tre giri quotidiani (sospendiMorosi,
      proveScadute, eliminazioniProgrammate). Con Stripe decide lo stato
      dell'abbonamento: Stripe ritenta col suo calendario (in sospeso),
      poi «non pagato» o disdetto; il webhook scrive lo stato della
      subscription sul cliente, e un pagamento fallito non lo cambia più.
      Il cambio di stato fa la cosa giusta al locale (azioneDiPagamento):
      non pagato sospende, o con «solo finché si paga» riporta al Free;
      disdetto chiude; di nuovo attivo riattiva una sospensione per il
      pagamento (non una dell'admin) o riporta il piano. Le interne no.
      Fuori da Stripe (oggi l'unico modo di vendere, coi pagamenti online
      spenti) l'admin scrive «pagato fino al» in «Cambia piano» o con
      «Registra pagamento»; alla data, più i giorni di grazia
      (impostazioni/regia.giorni_grazia, 7 se non detti), un compito
      segna l'abbonamento non pagato. Vuoto, nessuna scadenza (omaggi).
      Prove, eliminazioni programmate e condizioni degli aggiornamenti
      hanno un compito alla loro data (Cloud Tasks, onTaskDispatched
      «scadenza»); un compito ricontrolla prima di fare, quindi una
      scadenza spostata o annullata non si cancella, si ignora; oltre 29
      giorni il compito si riprogramma da solo. «Programma le scadenze»
      nel backoffice programma una volta quelle nate prima. Serve l'API
      Cloud Tasks sul progetto e il ruolo per creare la coda all'account
      del deploy.
      Dal 02/11/2026 («viene attivata la licenza con una durata in base
      alla subscription, se la subscription scade e non viene pagato nulla
      la licenza viene disattivata»): anche con Stripe la licenza scade,
      alla fine del periodo PAGATO (pagato_fino, dalla fattura pagata) più
      7 giorni, non alla fine del periodo della subscription, che Stripe
      sposta al rinnovo prima del pagamento; alla scadenza la regia chiede
      a Stripe lo stato vero (un rinnovo pagato il cui evento si è perso
      sposta la scadenza; altrimenti non pagato, o disdetto). Disdetto con
      «solo finché si paga» torna al Free; chi torna a pagare riapre anche
      un locale chiuso per il pagamento. Il titolare gestisce l'abbonamento
      da solo col portale clienti di Stripe («Gestisci l'abbonamento»:
      disdetta a fine periodo, carta, fatture).
    status: implemented
    generate_issue: true
    labels: [prodotto, regia, abbonamento]
