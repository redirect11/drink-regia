  - id: REQ-FLOTTA-035
    title: "L'IVA al 22% su canoni, attivazione, cambi di piano e ricariche AI, con un'aliquota fissa di Stripe"
    area: "functions/lib/abbonamento.js (parametriAliquotaIva, eAliquotaIva, righeCheckout, righeSubscription, prodottiDi, rigaAttivazione, sessioneCheckout), functions/lib/ai.js (rigaRicarica), functions/index.js (aliquotaIvaSuStripe, prodottiSuStripe, creaCheckout, aggiornaSubscription, creaRicaricaAI)"
    description: >
      Fase 0, prima di vendere (02/11/2026): il Checkout addebitava
      l'imponibile senza IVA, mentre il listino (DEC-0005) e il sito
      dicono «+ IVA». I prezzi di piani.json restano IVA esclusa
      (`tax_behavior: 'exclusive'`) e Stripe aggiunge il 22% (`iva` del
      listino) con una tax rate fissa, non Stripe Tax: i clienti sono
      locali italiani con partita IVA, l'aliquota è una sola, e Stripe Tax
      costa una percentuale su ogni transazione.
      L'ALIQUOTA SI CERCA E SI CREA DA SOLA: fra le tax rate attive di
      Stripe quella col segno `metadata.drink = 'iva'` e la percentuale del
      listino; se manca la si crea, con una chiave di idempotenza perché due
      Checkout insieme non ne creino due. Niente id da copiare a mano in un
      segreto per ogni account (test e produzione). Senza aliquota non si
      apre nessun Checkout e non si cambia nessuna subscription.
      DOVE: ogni riga del Checkout dell'abbonamento, attivazione compresa,
      e l'aliquota predefinita della subscription; ogni riga nuova dei
      cambi di piano (cambiaScelta, cambiaPianoAdmin), su cui Stripe
      calcola il conguaglio; la ricarica del credito AI (pagamento
      singolo), dove il credito resta l'imponibile (`amount_subtotal`).
      I CAMBI DI PIANO: una subscription non accetta `product_data` nelle
      righe, vuole l'id di un prodotto. Prima si mandavano le righe del
      Checkout, che Stripe avrebbe rifiutato; ora i prodotti hanno id fissi
      (`drink-piano-base`, `drink-modulo-<id>`, `drink-terminale`), cercati
      e creati se mancano.
      I DATI DI FATTURAZIONE: il Checkout chiede l'indirizzo di fatturazione
      e lascia scrivere la partita IVA (`tax_id_collection`), che vanno sul
      customer di Stripe e sulle sue ricevute; con un customer che c'è già
      Stripe li aggiorna (`customer_update`). La fattura elettronica però si
      fa coi dati della registrazione (clienti/{uid}.fatturazione: partita
      IVA, codice fiscale, PEC, codice destinatario), che Stripe non ha:
      le ricevute di Stripe non sono fatture elettroniche.
      NON PROVATO SU STRIPE: la logica è provata senza chiavi; il primo
      Checkout in modalità test deve mostrare l'IVA e il totale.
    status: implemented
    generate_issue: true
    labels: [prodotto, regia, abbonamento]
    test_cases:
      - tests/abbonamento.test.js
      - tests/ai.test.js

