      la stessa email di un account con la password la cui email NON è
      confermata prende il posto di quell'accesso: l'uid resta lo stesso,
      quindi il titolare ritrova il locale, ma Firebase toglie la password,
      e da lì si entra solo con Google (o si rifà la password con «Password
      dimenticata?»). Con l'email confermata i due accessi si collegano e
      valgono entrambi. Non è un difetto da correggere: la password mai
      confermata vale meno dell'email che Google garantisce.
