  - id: REQ-DEV-009
    title: "I rilasci solo su tag: il test col collaudo automatico, la produzione se il collaudo è riuscito"
    area: ".github/workflows/firebase-hosting.yml (Dove va, Prove sul sito di test, Collaudo riuscito sul test), .github/workflows/e2e.yml (riusabile, input collaudo), e2e/collaudo-registrazione.spec.js, e2e/collaudo-licenza.spec.js, e2e/aiuto.js (COLLAUDO), tests/ci.test.js, docs/handover.md §3, docs/actions-come-tana-drink.md, CLAUDE.md"
    description: >
      L'utente, 09/11/2026, dopo le verifiche a mano chieste alla fine
      dell'audit (una registrazione vera e una licenza dal backoffice):
      «automatizza solo su tag per rilascio. Nel senso che facciamo questo
      test solo prima di rilasciare su test. Se su test funziona non lo
      facciamo in produzione. Dobbiamo fare i rilasci solo su tag».
      PRIMA: un push su develop pubblicava sul test (REQ-DEV-002, 30/10);
      il giro Playwright (REQ-DEV-004) girava dopo ogni deploy, in sola
      lettura per scelta: la registrazione si fermava al passo del locale e
      il backoffice non premeva niente. Quello che davvero cambia con un
      rilascio (la Function registraCliente con l'account delle Functions,
      la licenza scritta nel Firestore del locale, la catena
      dell'aggiornamento con dispatch, Terraform e callback) si provava a
      mano.
      ORA, firebase-hosting.yml: parte solo da un tag o a mano. «Dove va»
      dà due uscite: ambiente (test | production) e collaudo. Un tag su un
      commit di main è produzione; un tag fuori da main (vX.Y.Z-beta su
      develop) è test con collaudo acceso; un lancio a mano su un ramo è
      test senza collaudo, per provare un ramo. Dopo il deploy sul test il
      job «Prove sul sito di test» chiama e2e.yml con collaudo = true solo
      per il tag. La produzione aspetta «Collaudo riuscito sul test»: con
      il token del workflow (permesso actions: read) cerca fra i run
      riusciti di firebase-hosting.yml uno il cui commit è antenato del
      tag di produzione (git merge-base --is-ancestor) e in cui il passo
      «Collaudo sul test» è verde; senza, si ferma con un errore che dice
      di taggare una -beta su develop. Il collaudo non si ripete in
      produzione: la produzione eredita quello del test.
      e2e.yml è riusabile (workflow_call) e si lancia anche a mano
      (workflow_dispatch), con l'interruttore collaudo (default false). Il
      job («Playwright sul sito di test») ha un nome fisso: al primo tag
      (v0.3.0-beta.1, run 42670530702) il nome calcolato da `inputs` ha
      fatto abortire il job senza nemmeno crearlo e senza un messaggio, e
      lo stesso è successo al lancio a mano. I due passi dicono cosa si è
      provato: «Prove in sola lettura» (playwright test --grep-invert
      collaudo) sempre, «Collaudo sul test» (i due file collaudo-*, con
      E2E_COLLAUDO=true) solo con l'input; la garanzia cerca quel passo
      fra i passi dei job. Gira nell'environment test con E2E_PASSWORD.
      IL COLLAUDO (e2e/collaudo-*.spec.js, saltati senza E2E_COLLAUDO=true,
      in serie): la registrazione (e2e/collaudo-registrazione.spec.js):
      l'admin toglie prima i clienti «collaudo-*» rimasti da un giro
      fallito; un titolare nuovo si registra in quattro passi con un'email
      su collaudo.invalid (RFC 2606: la verifica parte e non arriva a
      nessuno) e arriva alla dashboard con l'avviso di verifica e la scelta
      del piano, senza mai attivare l'istanza (creerebbe un progetto
      Google, quota contata); un secondo titolare con lo stesso nome del
      locale è fermato sullo slug (REQ-FLOTTA-045), ne sceglie un altro e
      passa; l'admin vede i due clienti e li elimina con «Elimina cliente…»
      (REQ-FLOTTA-059), e il titolare eliminato non entra più. La licenza e
      l'aggiornamento (e2e/collaudo-licenza.spec.js, sul locale
      E2E_LOCALE_COLLAUDO, default prova-bar, app su
      drinkpos-<locale>.web.app): «Sospendi» col motivo «collaudo
      automatico», l'app del locale mostra «Installazione sospesa» col
      motivo (è la licenza scritta dalla regia nel Firestore del locale con
      l'account runtime-regia, finding 3 dell'audit), «Riattiva» la toglie;
      poi «Aggiorna subito»: la scheda dice «partito» (o già «in corso»,
      se si è ricaricata), e si ricarica ogni trenta secondi finché
      «aggiornamento a … in corso» sparisce (fino a venti minuti);
      «fallito» ferma il test. Il collaudo scrive sulla regia di test e
      consuma un run della flotta: per questo solo sui tag, e senza
      ripetizioni (retries: 0): in un gruppo seriale un fallimento rifà il
      file intero, e il secondo giro lanciava un secondo aggiornamento vero
      del locale e trovava i clienti del primo.
      IL PRIMO COLLAUDO INTERO (tag v0.3.0-beta.2, run 42686747514,
      09/11/2026): deploy e prove in sola lettura verdi, «Aggiorna
      istanza» su prova-bar riuscito (con la configurazione web passata
      come artifact), ma il collaudo rosso per tre cose, tutte sistemate:
      un bug vero della registrazione (il secondo «Avanti» inviava il
      modulo da sé, REQ-FLOTTA-003); il test della licenza che voleva
      «partito» quando la scheda diceva già «in corso»; la pulizia che
      contava i clienti per nome, e due si chiamavano uguale.
      IL SECONDO (tag v0.3.0-beta.3, run 42800893624, 10/11/2026): cinque
      prove su sei verdi, licenza compresa; l'ultima rossa perché dopo
      «Esci» il test andava subito su /accedi e l'uscita, asincrona, non
      era ancora avvenuta: la pagina rimandava l'admin alla sua dashboard.
      Si aspetta il link «Accedi» prima di proseguire, come fa già
      e2e/accesso.spec.js. Rifacendolo in locale è uscito un difetto
      latente: la password del titolare di collaudo finiva con la marca in
      base 36, che può venire di sole lettere, e la regola vuole una
      cifra; ora la cifra è fissa.
      IL TERZO (tag v0.3.0-beta.4, run 43032681824, 11/11/2026) non è
      arrivato alle prove: `playwright install --with-deps` non risolveva
      i mirror apt di Ubuntu sull'immagine ubuntu-26.04, che ubuntu-latest
      aveva appena iniziato a dare, tre volte su tre. Fissare il job su
      ubuntu-24.04 non è bastato (tag v0.3.0-beta.5, run 43046827763,
      stesso errore): non era l'immagine, erano i mirror di Ubuntu
      irraggiungibili dai runner. Il browser si installa senza
      `--with-deps`, cioè senza apt: le librerie di sistema l'immagine
      le ha già.
      COSA NON COPRE, e resta a mano quando serve: l'attivazione di un
      locale nuovo (progetto Google), i pagamenti Stripe (sandbox), il
      cassetto AI.
    status: implemented
    generate_issue: true
    labels: [metodo, regia]
    priority: P1
    test_cases:
      - tests/ci.test.js

  - id: REQ-DEV-010
    title: "Le dipendenze indirette con avvisi di sicurezza sono forzate alla versione corretta"
    area: "package.json e functions/package.json (overrides), i due package-lock.json"
    description: >
      L'utente, 11/11/2026, davanti ai run rossi di Dependabot e alla
      proposta di chiudere gli avvisi non applicabili: «direi di forzare
      le versioni corrette e adeguarci noi. Mi sembra proprio
      l'obiettivo di quei controlli di sicurezza». I pacchetti con un
      avviso non li scegliamo noi: li portano firebase, firebase-tools e
      firebase-admin, che chiedono ancora le versioni vecchie, e per
      questo Dependabot non riusciva ad aprire la sua PR («security
      update not possible»). Con `overrides` si installa la versione
      corretta: @grpc/grpc-js ^1.14.5 e uuid ^11.1.1 nel sito e nelle
      Functions, fast-xml-parser ^5.12.0 nelle Functions, minimatch
      ^11.0.1 solo sotto glob (eslint e gli altri vogliono la 3, la 5 e
      la 6, che il difetto non ce l'hanno). uuid resta alla 11 e non va
      oltre: dalla 12 e' solo ESM, e le librerie di Google lo caricano
      con require. Provato l'11/11/2026 con lint, tutti i test, la build,
      la CLI di Firebase e i test delle regole sull'emulatore. Il test
      guarda i lockfile: se un aggiornamento riporta dentro una versione
      colpita, fallisce li'. Quando Google aggiorna le sue librerie gli
      override si tolgono.
      IL DEPLOY VUOTO (tag v0.3.0-beta.7, run 43076605297, 11/11/2026):
      con minimatch 11 forzato sotto glob, firebase-tools elencava zero
      file («found 0 files in dist») e ha pubblicato sul sito di test una
      versione vuota: «Page Not Found» su ogni pagina. glob 10 non regge
      minimatch 11. Lint, test, build ed emulatori erano verdi: nessuno
      di loro elenca i file di un deploy, e nella PR #124 il deploy vero
      era segnato come non provato. CRITERIO DI ACCETTAZIONE: con le
      dipendenze installate dal lockfile, l'elenco dei file che
      firebase-tools pubblicherebbe da una cartella non e' vuoto
      (firebase-tools/lib/listFiles, la stessa funzione del deploy). Un
      override entra solo se questo test resta verde. minimatch sotto
      glob torna alla versione che firebase-tools chiede: l'avviso
      riguarda uno strumento di sviluppo, e si chiude a mano finche'
      firebase-tools non aggiorna glob.
    status: implemented
    generate_issue: true
    labels: [metodo, regia, sicurezza]
    priority: P2
    test_cases:
      - tests/dipendenze-indirette.test.js

