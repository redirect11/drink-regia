  - id: REQ-FLOTTA-090
    title: "Il locale sospeso o chiuso: rinnovo_url nella licenza e, nell'area del titolare, il riquadro per pagare o per scriverci"
    area: "functions/lib/licenza.js (licenzaProtetta, licenzaIniziale, CHIAVI_PROTETTA), functions/lib/rinnovo.js, functions/index.js (pagamentoRinnovo), src/lib/rinnovo.js, src/lib/db.js (apriPagamentoRinnovo), src/pages/RinnovoLocale.jsx, src/pages/Dashboard.jsx, docs/handover.md §7"
    description: >
      Daniele, 13/11/2026, in chat: «Al cliente dobbiamo mostrare una cosa
      diversa. Il servizio viene sospeso subito ma dobbiamo portare
      l'utente alla schermata di pagamento per il rinnovo in qualche modo
      (se prevediamo di accettare pagamenti altrimenti sito sospeso e si
      danno le info di contatto per contattarci)». E alle due domande
      dello stesso giorno: il titolare di un locale sospeso consulta e
      scarica i dati in sola lettura nell'app («si»); le sospensioni
      dell'admin vanno come quelle per mancato pagamento, tutto fermo e al
      titolare solo i contatti («Si»). La parte dell'app (la pagina neutra
      per i clienti del bar, il messaggio al personale, la schermata del
      titolare col tasto «Riattiva il locale») la fa tana-drink; la regia
      dà l'indirizzo del rinnovo e la pagina dove si arriva.
      CRITERI DI ACCETTAZIONE. (1) La licenza (licenza/attuale e
      settings/bar.licenza) porta `rinnovo_url` =
      `<REGIA_URL>/dashboard/piano?rinnovo=1`, calcolato dall'origine di
      `regia_url`; senza indirizzo della regia vale null. Non si toglie
      niente di quello che c'era. Sta fra le chiavi che la verifica delle
      licenze confronta, e lo scrivono sia licenzaProtetta sia
      licenzaIniziale (la prima attivazione). Le licenze esistenti lo
      ricevono alla prossima riscrittura (cambio di stato, di piano, di
      pagamento, aggiornamento, «Allinea» del backoffice); finché non
      succede la verifica le segna diverse. (2) Nell'area del titolare, in
      cima a «Piano e moduli», un riquadro quando il locale è sospeso o
      chiuso (`istanza.licenza_stato`), o l'abbonamento è in ritardo o non
      pagato; con `?rinnovo=1` e il locale in regola il riquadro lo dice.
      Nella panoramica, in cima, un avviso che porta al riquadro. (3)
      Sospeso per il pagamento (`licenza_per: 'pagamento'`, o il motivo
      «pagamento non ricevuto» dei locali di prima), pagamenti online
      accesi e abbonamento con Stripe: «Il tuo locale è sospeso dal
      ‹data›» e un tasto per pagare. Il tasto chiama una callable che
      cerca sul server, per il cliente che chiama e solo per la SUA
      subscription, l'ultima fattura aperta di Stripe e ne dà la pagina di
      pagamento (`hosted_invoice_url`); senza fattura aperta, il portale
      clienti. Nessun id arriva dal browser. Pagata la fattura, il locale
      si riattiva da solo (REQ-FLOTTA-023: invoice.paid → abbonamento
      attivo → «riattiva»). (4) Pagamenti online spenti, sospeso
      dall'admin, o abbonamento gestito a mano: «Il tuo locale è sospeso:
      per riattivarlo scrivici a ‹EMAIL_CONTATTI›», senza tasto per
      pagare; la callable rifiuta coi pagamenti spenti. (5) Chiuso: niente
      «riattiva», solo i contatti e cosa succede ai dati (la
      cancellazione programmata con la sua data, se c'è). (6) Lo stato
      dell'abbonamento si dice in italiano (attivo, in ritardo col
      pagamento, non pagato, disdetto), mai il valore grezzo di Stripe
      («past_due»). (7) Il contratto in docs/handover.md §7 dice
      `rinnovo_url`.
      PUNTO DEBOLE, SCELTA DI DANIELE: «il servizio viene sospeso subito»,
      quindi anche a metà serata. Oggi subito vale per le sospensioni e le
      chiusure dell'admin; quella per il pagamento arriva all'app al
      taglio della giornata (REQ-FLOTTA-024), e il riquadro lo dice. Se
      anche quella deve essere immediata, è una decisione da prendere a
      parte. Altro punto debole: chi apre `rinnovo_url` senza sessione
      nella regia passa dall'accesso e arriva alla panoramica, non al
      riquadro: lì l'avviso lo porta al riquadro con un tocco.
    status: implemented
    generate_issue: true
    labels: [regia, flotta]
    priority: P1
    test_cases:
      - tests/rinnovo.test.js
      - tests/RinnovoLocale.test.jsx
      - tests/licenza.test.js
      - tests/db.test.js

  - id: REQ-FLOTTA-086
    title: "Istanza e titolare scollegati: il backoffice lo dice e li ricollega, la dashboard non finge «Non ancora attivata»"
    area: "functions/lib/collegamento.js, functions/index.js (collegaIstanza, statoMiaApp, avviaProvisioning), src/lib/db.js, src/lib/istanze.js, src/pages/CollegaIstanza.jsx, src/pages/Backoffice.jsx (scheda del locale), src/pages/Dashboard.jsx"
    description: >
      Sul test il titolare di prova-free vedeva «L'app: Non ancora
      attivata» col tasto «Attiva l'istanza», mentre il backoffice la
      mostrava «Attiva». Causa probabile: istanze/prova-free.uid non è
      l'uid dell'account del titolare (app nata prima di M7, o account
      ricreato), le regole negano la lettura e la dashboard, che non
      ascoltava gli errori, la trattava come un'istanza che non c'è. Il
      backoffice accoppia cliente e istanza per slug e non lo vedeva.
      Daniele, 13/11/2026: «fai il tasto di collegamento nel backoffice, ma
      deve apparire solo se per qualche motivo istanza e regia risultano
      scollegati».
      PERCHÉ LA DASHBOARD NON LEGGE PIÙ PER SLUG. Provato sull'emulatore
      il 13/11/2026: un titolare che legge istanze/{slug} o
      richieste/{slug} che non esistono ancora riceve «permission-denied»,
      come per un documento di un altro; l'errore non distingue un cliente
      nuovo da uno scollegato, e l'ascolto aperto prima dell'attivazione si
      ferma. Aprire le regole ai documenti che non ci sono è stato
      scartato. Daniele, 13/11/2026: «non va bene serve una soluzione piu
      sicura e piu robusta». Le regole restano come sono: la dashboard
      ascolta le query `where('uid', '==', <il suo uid>)`, che le regole di
      oggi permettono, che tornano vuote senza errore e restano vive; solo
      con la query dell'istanza vuota chiede alla regia statoMiaApp, che
      risponde per il locale dell'account che chiama e per nessun altro.
      Così nessuno impara niente di locali che non sono suoi: la query
      vede solo documenti col proprio uid, e la Function non accetta uno
      slug, lo prende dal documento del cliente, che il titolare non può
      cambiare.
      CRITERI DI ACCETTAZIONE. (1) Nella scheda del locale del backoffice,
      se c'è un'istanza non eliminata e il suo uid non è quello del
      cliente (diverso o vuoto), in cima un avviso: «L'app è legata a un
      altro account: il titolare non la vede nella sua area», con l'uid a
      cui è legata e l'email e l'uid del titolare, e il tasto «Collega
      l'app al titolare». Con istanza e cliente collegati, senza istanza o
      con l'istanza eliminata, né avviso né tasto. (2) Il tasto chiede
      conferma mostrando nome del locale, email del titolare e uid vecchio
      → nuovo; annullato non fa niente; l'esito, riuscito o no, si legge
      sulla scheda. (3) La Function collegaIstanza({ slug }) risponde solo
      all'admin (permission-denied altrimenti); rilegge sul server, in una
      transazione, il cliente con quello slug (esattamente uno: nessuno o
      più di uno è un errore chiaro), l'istanza, la richiesta e il
      cassetto AI. Rifiuta se l'istanza non c'è, se è eliminata o se è già
      collegata. Scrive istanze/{slug}.uid = uid del cliente con la traccia
      (quando, chi, l'uid di prima) e nient'altro dell'istanza; allinea
      richieste/{slug}.uid e ai/{slug}.uid solo se oggi sono l'uid vecchio
      o vuoti; un uid già giusto resta com'è; un uid di un terzo, diverso
      dal vecchio, ferma tutto con un errore chiaro e non scrive niente.
      Risponde con l'uid vecchio e il nuovo. (4) Al prossimo «Aggiorna» il
      passo del titolare nel locale (pianoTitolare) non chiude fuori
      l'account già usato con l'uid vecchio: lo tiene, admin, con un
      avviso. (5) La dashboard ascolta istanze e richieste con la query
      sul suo uid. Sulle regole vere: per un cliente nuovo la query torna
      vuota senza errore; un documento creato dopo arriva all'ascolto; il
      documento di un altro uid non compare. (6) Solo con la query
      dell'istanza vuota, la dashboard chiama statoMiaApp: solo con
      l'accesso, senza argomenti, risponde { app: 'nessuna' | 'collegata'
      | 'scollegata' } e nient'altro, per il locale del documento
      clienti/{uid} di chi chiama. Un'istanza senza uid e senza progetto
      (un lancio fallito prima di creare il progetto) vale 'nessuna': il
      titolare vede l'attivazione fallita e la rilancia. Da qui in poi
      anche il lancio fallito scrive l'uid sull'istanza. (7) Con
      'scollegata', o con la lettura che fallisce, niente «Non ancora
      attivata» e niente «Attiva l'istanza»: «Non riesco a leggere lo stato
      della tua app: scrivici a <email del prodotto>». Con 'nessuna',
      «Non ancora attivata» col tasto, come prima.
