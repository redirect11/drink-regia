  - id: REQ-FLOTTA-045
    title: "Lo slug del cliente è unico: la registrazione la scrive la Function registraCliente, e ogni ricerca per slug si ferma davanti a un doppione"
    area: "functions/lib/registrazione.js (nuovoCliente, documentoRegistrazione, registraCliente, clientePerSlug), functions/index.js (registraCliente, docClientePerSlug e tutte le ricerche per slug), firestore.rules (clienti/{uid}: create if false), src/lib/db.js (creaCliente, registra, completaRegistrazione, slugGiaInUso), src/pages/Registrati.jsx (la casella dell'identificativo)"
    description: >
      Audit di sicurezza del 09/11/2026, finding 4 (alta). Il documento
      clienti/{uid} lo scriveva il browser alla registrazione, e la regola
      `create` controllava la forma dello slug ma non che fosse libero: una
      regola non può interrogare la collezione. Due locali con lo stesso
      nome (o un malintenzionato col nome di un concorrente non ancora
      attivo) finivano sullo stesso slug, e le Functions cercavano il
      cliente con `where('slug', '==').limit(1)`: con due clienti «il
      primo», in silenzio. La licenza, i dati del locale copiati nell'app
      (P.IVA, telefono), la subscription di Stripe di un modulo comprato
      dall'app potevano andare al cliente sbagliato.
      LA REGISTRAZIONE passa dalla callable `registraCliente`: uid ed email
      sono quelli dell'account, i dati del locale, della fatturazione e
      del referente arrivano come li raccoglie il modulo, e il documento si
      costruisce sul server con gli stessi campi di prima (un test lo
      confronta con nuovoCliente del sito, campo per campo), con i
      controlli che facevano le regole (slug valido, partita IVA di 11
      cifre) più i consensi dati davvero. Si scrive in TRANSAZIONE, dopo
      aver letto che nessun cliente e nessuna istanza hanno quello slug e
      che l'account non ha già un locale. Slug preso: `already-exists`,
      «Questo identificativo è già in uso: scegline un altro.», con
      `details.campo = 'slug'`; il sito torna al passo del locale e apre la
      casella dell'identificativo, prima nascosta, già piena di quello
      rifiutato; chi non ha il problema non la vede e tiene lo slug dal
      nome, come sempre. Col sito chiuso (REQ-FLOTTA-043) non si registra
      nessuno: chiude anche il finding 26. Dopo un rifiuto l'account c'è:
      al secondo tentativo con lo stesso account entrato non si ricrea.
      LE REGOLE: `allow create: if false` su clienti/{uid}; il sito non
      scrive mai clienti/{uid} dal browser, nemmeno alla registrazione.
      LE RICERCHE PER SLUG: l'helper `clientePerSlug` chiede due documenti
      (`limit(2)`) e con due si ferma con «Identificativo ambiguo: più di un
      cliente con lo slug …» (`failed-precondition`; 409 per l'app dei
      locali in moduloDallApp). Lo usano tutte le ricerche di index.js:
      clienteDi (licenza, dati del locale, aggiornamenti), le scadenze, le
      callable admin (registraPagamento, applicaSconto, impostaTemi,
      gestisciEliminazione, cambiaPianoAdmin, creaCliente,
      registraLocaleEsistente), lanciaAggiornamento, moduloDallApp.
      LA SEMINA (REQ-DEV-004) scrive con l'Admin SDK: gli slug delle
      persone sono diversi fra loro, e un test lo tiene così.
      Le regole restano provate sul testo (finding 16: l'emulatore non è
      ancora fra le dipendenze); la transazione si prova con un Firestore
      finto.
      CORREZIONE DEL 09/11/2026, sera (dal primo collaudo automatico,
      REQ-DEV-009): sul sito vero il rifiuto dello slug non si vedeva mai.
      createUserWithEmailAndPassword fa entrare l'utente prima che la
      Function risponda; App.jsx, vedendo un utente su /registrati,
      mandava alla dashboard e smontava la pagina: il secondo titolare si
      ritrovava su «Completa la registrazione» coi campi vuoti e senza
      messaggio. Ora db.js dice quando la registrazione è in corso
      (registrazioneInCorso, vero fra l'account e il cliente, falso dopo
      anche in errore) e App lascia la pagina dov'è finché non finisce; la
      pagina torna al locale con la casella dell'identificativo e il
      messaggio, come i test unitari già pretendevano (tests/db.test.js,
      tests/App.test.jsx).
    status: implemented
    generate_issue: true
    issue_a_posteriori: true
