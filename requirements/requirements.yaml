  - id: REQ-FLOTTA-028
    title: "I codici sconto, e la Tana come abbonamento premium con la licenza dalla regia"
    area: "functions/lib/sconti.js, functions/lib/esistente.js, functions/index.js (gestisciSconti, applicaSconto, impostaAggiornamentiEsistente), src/lib/sconti.js, src/pages/Backoffice.jsx, src/pages/Dashboard.jsx, firestore.rules"
    description: >
      L'utente, 02/11/2026, sulla Tana: «Dobbiamo trattarlo come
      abbonamento premium e tracciare i moduli attivi. Ha un codice sconto
      allegato con una durata illimitata per avere tutti i servizi attivi.»
      Decisioni: i codici sconto stanno nella regia (coi pagamenti online
      spenti; con Stripe diventeranno coupon), e la Tana ha il piano
      Completo, fatture comprese. Un codice ha percentuale e durata in mesi
      o illimitata; si crea e si disattiva in «Vendita» (chi lo ha lo
      tiene), e l'admin lo applica dalla scheda del locale. Al 100%
      illimitato l'abbonamento è attivo, non si paga e non scade; al 100% a
      tempo è un piano a mano pagato fino alla fine dello sconto; parziale
      cambia solo il prezzo. Un locale esistente può avere la licenza dalla
      regia (licenza_dalla_regia), calcolata dal piano come per gli altri:
      si scrive subito, e se la regia non può scrivere nel suo progetto si
      torna indietro e lo si dice. Nella stessa verifica: la regola dei
      clienti lasciava al titolare moduli, terminali e prove, che la regia
      trasforma in licenza; ora il titolare cambia solo i dati anagrafici.
      IL CODICE ALL'ACQUISTO (02/11/2026). L'utente: «gli acquisti possono
      avere anche i codici sconto mi raccomando»; il Checkout li ignorava, e
      chi aveva un codice pagava il listino. Alle tre domande: lo scrivono
      «tutti e due» (il titolare nella scelta del piano, l'admin dal
      backoffice come prima); col prezzo Fondatori vale «il più
      conveniente»; un codice al 100% «senza passare da Stripe». In
      functions/lib/acquisto.js: lo sconto di un acquisto (il codice scritto,
      o quello dell'admin ancora in corso), il coupon di Stripe in
      percentuale sui mesi che restano (col pagamento annuale per anni
      interi; un codice di meno di un anno vale solo al mese), il confronto
      coi Fondatori sul primo anno attivazione compresa (vince il codice a
      parità), e l'attivazione con un codice al 100%. Le Functions
      verificaCodiceSconto («Applica», non scrive niente) e attivaConCodice;
      creaCheckout decide lo sconto prima di prenotare un posto Fondatori, e
      il webhook riscrive lo sconto sul cliente dai metadati. Coi pagamenti
      spenti il codice viaggia con la richiesta di contatto. Un codice al
      100% è un abbonamento attivo come quello dato dall'admin: il locale
      si attiva da «Attiva», e col deploy automatico spento la richiesta
      aspetta l'admin (REQ-FLOTTA-011).
      IL LIMITE DI USI (02/11/2026). L'utente: «Aggiungiamo limite di
      utilizzo del codice». Un codice ha usi_massimi (da 1 a 100000, o vuoto
      per nessun limite) e il contatore usi. Un uso è un locale che prende lo
      sconto: al pagamento, con un codice al 100%, o applicato dall'admin
      dalla scheda; chi lo ha già sul suo cliente e lo riusa non ne consuma
      un altro. Al pagamento l'uso si tiene da parte per la durata del
      Checkout (sconti/{CODICE}.prenotazioni, come i posti Fondatori), si
      libera se la sessione non nasce, e il webhook lo conta quando Stripe
      conferma (metadato sconto_uso). Il codice al 100% e l'admin contano in
      transazione col codice: l'ultimo uso lo prende uno solo. Esaurito, il
      codice non vale per nessuno nuovo, nemmeno dall'admin; il limite si
      alza o si toglie da «Limite…» nel backoffice, le condizioni dello
      sconto restano quelle.
