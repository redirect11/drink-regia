      transitive si allineano con npm audit fix; il resto degli avvisi è
      a monte e non ha una versione che lo chiuda senza un major: i due di
      @grpc/grpc-js dentro firebase 12 (il browser non lo usa), quelli
      dentro firebase-tools (strumento di sviluppo) e gli 8 moderati di
      firebase-admin 13 nelle Functions, da chiudere con firebase-admin 14
      (REQ-DEV-006).
      COSA CAMBIA NEI TEST: happy-dom 21 non definisce più window.alert,
      confirm e prompt, che le pagine del backoffice usano e i test spiano;
      tests/finestra.js, nei setupFiles, li mette sulla finestra finta con
      la risposta di chi chiude il dialogo. Lo storage di happy-dom 21 è un
      proxy: vi.spyOn(localStorage, ...) non si ripristina più e sul
      prototipo non intercetta; i due test della lingua col browser che
      non lascia salvare sostituiscono globalThis.localStorage con un
      archivio che rifiuta, per la durata del test. I flag future di
      react-router 6 (v7_startTransition, v7_relativeSplatPath) spariscono
      da BrowserRouter e dai MemoryRouter dei test: in react-router 7 sono
      il comportamento normale. Il sorgente del sito non cambia.
      IL TEST (tests/dipendenze.test.js) tiene ferme le soglie minime in
      package.json e nel lockfile, pretende coverage-v8 e vitest allo
      stesso minor e la finestra finta nei setupFiles. npm 10.7 fallisce
