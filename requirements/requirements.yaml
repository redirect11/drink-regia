  - id: REQ-FLOTTA-093
    title: "Il costo massimo si misura prima di prenotare: il credito non va mai sotto zero"
    area: "functions/lib/ai.js (stimaMassimaMicroeuro, parametriConteggio, interrogaConPrenotazione, chiudiPrenotazione, MARGINE_CONTEGGIO, TENTATIVI_MASSIMI), functions/index.js (interrogaClaude), src/lib/ai.js (statoCredito), src/pages/Backoffice.jsx (blocco Credito AI), docs/handover.md §7"
    description: >
      Daniele, 13/11/2026, in chat, sul credito che fino a qui poteva
      scendere di poco sotto zero quando una fattura costava più della sua
      stima per byte (REQ-FLOTTA-088, punto 9): «Non deve mai succedere».
      Se la misura non copre la richiesta, la richiesta non parte. Sui
      dubbi della prima stesura di questa voce (il rifiuto a metà risposta,
      il conteggio che non risponde, lo sforamento che capita lo stesso),
      lo stesso giorno: «per tutti i 10 i punti facciamo come dici».
      Questa voce sostituisce il punto 9 di REQ-FLOTTA-088 per il credito;
      per il tetto al cambio di mese resta com'è.
      Dalla documentazione ufficiale di Anthropic, verificata il
      13/11/2026: il conteggio dei token (client.messages.countTokens
      dell'SDK) accetta PDF e immagini in base64, le istruzioni di sistema
      e i tool; è gratuito, con un suo limite di richieste al minuto; il
      numero «è una stima, può differire di poco». Dalla guida di Anthropic
      sul ripiego: un rifiuto a metà risposta si paga (ingresso e uscita già
      scritta), e il modello di ripiego riceve il testo già scritto come
      contesto.
      CRITERI DI ACCETTAZIONE. (1) Prima della prenotazione, dopo aver
      creato il client, la regia conta i token d'ingresso con lo stesso
      modello, le stesse istruzioni, lo stesso messaggio e lo stesso
      output_config che partiranno (ai.parametriConteggio), senza i
      parametri del ripiego. Il conteggio si inietta in
      interrogaConPrenotazione come `conta`, accanto a `crea` e `prenota`,
      per provarlo con un finto; senza `conta` si usa
      client.messages.countTokens con un tempo massimo di 10 secondi e
      nessun nuovo tentativo (`{ timeout: 10_000, maxRetries: 0 }`): coi
      valori predefiniti dell'SDK (10 minuti, 2 nuovi tentativi anche sui
      429) un conteggio lento consumava il tempo della Function (300
      secondi) prima della chiamata al modello, e la prenotazione scadeva
      alla stima. Il tempo massimo vale anche per un `conta` iniettato.
      (2) LA STIMA mette da parte due
      tentativi completi, perché il ripiego `fallbacks: 'default'` può
      rifare la richiesta con un altro modello dopo un rifiuto a metà
      risposta: uscita 2 × max_tokens; ingresso I per il primo tentativo
      più (I + max_tokens) per il secondo, che riceve come contesto il
      testo già scritto, con I = ingresso contato × (1 +
      MARGINE_CONTEGGIO, 5%) arrotondato in su. Ogni voce (ingresso,
      uscita) al prezzo più alto del listino
      (stimaMassimaMicroeuro(m, { inputContati })), più UN micro-euro dopo
      l'arrotondamento: la stima moltiplica i totali, il costo somma i
      tentativi uno per uno, e in virgola mobile i due conti possono cadere
      da parti diverse del Math.ceil (revisione della PR #234, 13/11/2026:
      24 casi su 72.369, per esempio una fattura con 12.857 token su
      claude-opus-5, costo 971.356 µ€ contro una stima di 971.355). (3) SE
      IL CONTEGGIO NON RISPONDE (errore, limite raggiunto, numero non
      valido, o nessuna risposta entro TEMPO_CONTEGGIO_MS, 10 secondi): una
      richiesta senza file (la descrizione) usa la stima per byte, con la
      stessa forma a due tentativi e la stima d'ingresso della richiesta
      (stimaInputToken) al posto del contato; una richiesta con un file
      (fattura, tema, e qualunque richiesta con un file) risponde 503 {
      codice: 'servizio', errore: 'Il servizio AI è occupato: riprova tra
      poco.' }, senza prenotare e senza chiamare il modello. (4) Se il
      credito non copre la stima: 402 credito, come oggi, e il modello non
      si chiama. (5) L'INVARIANTE, provata per ogni tipo, ogni coppia di
      modelli (anche uno che il listino non conosce), ogni divisione
      dell'uscita e un intervallo fitto di conteggi (uno per uno fino a
      20.000, poi a passi fino a 300.000): per ogni usage che rispetta i limiti (al massimo 2
      tentativi; ingresso del primo ≤ I, del secondo ≤ I + max_tokens;
      uscita di ciascun tentativo ≤ max_tokens) costoMicroeuro ≤ stima;
      quindi, col credito che alla prenotazione copriva la stima, dopo la
      chiusura il credito resta ≥ 0. (6) SE LO SFORAMENTO CAPITA LO STESSO
      (costo vero > stima: è un difetto): il credito si ferma a zero, mai
      sotto; l'importo che manca si somma a `sforato_microeuro` nel
      cassetto ai/{slug}; nei log una riga cercabile `[ai] SFORAMENTO` col
      locale, il costo e la stima; la riga dei consumi tiene il costo vero.
      Lo sforato NON si recupera dal locale: Daniele, 13/11/2026, «gestisco
      io a mano. In realtà è un costo che ci accolliamo». Il campo si
      chiamava `da_recuperare_microeuro` nella PR #234 ed è stato
      rinominato prima che un cassetto lo avesse. (7) Nel backoffice, nel
      blocco Credito AI della scheda del locale, un avviso informativo
      «Sforamento assorbito da Stonebit: X €» quando `sforato_microeuro` è
      sopra zero, senza toni di recupero. (8) Il contratto in
      docs/handover.md §7 non dice più che il credito può scendere di poco
      sotto zero, e dice del conteggio, del 503 per le richieste con un
      file e dello sforato a carico di Stonebit.
      LIMITE NOTO (revisione della PR #234). Lo sforamento si segna in
      `sforato_microeuro` solo nella chiusura normale. Se la correzione
      dopo la risposta non si scrive (il ramo «[ai] CHIUSURA») o la
      prenotazione scade (riga «interrotta»), il locale paga la stima e un
      costo vero più alto, se ci fosse, non lascia traccia nel cassetto:
      resta solo la riga «[ai] SFORAMENTO» nei log, che si scrive prima
      della chiusura.
      PUNTI DEBOLI. (a) Il conteggio è «una stima, può differire di poco»:
      il 5% di margine è una scelta, non un numero garantito da Anthropic.
      (b) La stima è più alta di oggi, anche per le descrizioni (due
      tentativi completi): un locale col credito basso può vedersi
      rifiutare una richiesta che prima partiva, e il credito che rende
      `attivo` la risposta di { tipo: 'credito' } sale. (c) Quando il
      conteggio è al limite, fatture e temi rispondono 503 finché non
      torna. (d) Una chiamata in più a ogni richiesta: più tempo prima della
      risposta. (e) La creazione della cache (1,25 volte il prezzo
      d'ingresso) non è nella stima: oggi le richieste non chiedono la
      cache, se un giorno la chiedono la stima va rivista. (f) Come
      Anthropic fattura un rifiuto prima di qualunque risposta resta [da
      verificare]: la stima lo copre comunque, perché conta due tentativi
      interi. (g) Il micro-euro in più copre l'errore di arrotondamento
      finché una richiesta vale molto meno di un miliardo di micro-euro:
      oggi una richiesta vale al massimo qualche euro.
    status: implemented
    generate_issue: true
    labels: [regia, ai, sicurezza]
    priority: P1
    test_cases:
      - tests/ai-conteggio.test.js
      - tests/ai-prenotazione.test.js
      - tests/Backoffice.test.jsx
      - tests/ai.test.js

