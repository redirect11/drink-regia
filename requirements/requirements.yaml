  - id: REQ-DEV-008
    title: "Le dipendenze con falle note aggiornate insieme: vite 7, vitest 4, happy-dom 21, react-router 7"
    area: "package.json, package-lock.json, functions/package-lock.json, vitest.config.mjs (setupFiles), tests/finestra.js, tests/HomeLingua.test.jsx, src/main.jsx, tests/*.test.jsx (MemoryRouter senza future)"
    description: >
      Audit di sicurezza del 09/11/2026, finding 24, e le correzioni di
      sicurezza che Dependabot ha aperto la sera stessa (#106 happy-dom 21,
      #107 e #108 vitest/vite, #114 vitest 5) e che non si potevano unire:
      vitest 4 e 5 vogliono vite 6 o successivi e il sito stava su vite 5,
