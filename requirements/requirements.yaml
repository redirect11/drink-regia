# Il registro dei requisiti della regia (drink-regia)
#
# Stesso formato del registro di tana-drink: ogni voce dice cosa fa il sito,
# e i test citati lo dimostrano (tests/requisiti.test.js controlla che ogni
# test esista e che ogni file di test sia citato). I percorsi dei test sono
# relativi a questo repository.

requirements:
  - id: REQ-FLOTTA-002
    title: "La regia: il sito del prodotto con i prezzi, in un progetto Firebase suo (drink-regia)"
    area: "regia/ (app React + Vite a se', con package.json, firebase.json e test propri), src/lib/piani.js, src/lib/prodotto.js, src/pages/Home.jsx, src/App.jsx, src/lib/lingua.js, src/lib/comparsa.js, src/i18n/, src/index.css, DESIGN.md"
    description: >
      «Ci serve un sito/front page con prices/registrazione/login/
      backoffice/dashboard» (l'utente, 21/10/2026). La regia e' una
      seconda app nello stesso repository, cartella `regia/`, con il suo
      progetto Firebase (`drink-regia`): non condivide ne' database ne'
      hosting con le istanze, e non sa niente dei dati dei locali.
      LA PRIMA PAGINA: cosa fa il prodotto, i piani con i prezzi
      (`piani.js`: base, terminale in piu', moduli, completo, attivazione
      — logica pura, con i prezzi in un posto solo), il tasto per
      registrarsi. Il nome visibile del prodotto sta in `prodotto.js` e si
      cambia li'. Testi nel registro del mestiere, senza toni da venditore.
      LANDING PAGE INTERA (l'utente, 22/10/2026: «deve essere una landing
      page con menu e tutto il resto, una roba seria»): barra fissa col
      menu' delle sezioni (Funzioni, Come funziona, Prezzi, Domande), che
      sul telefono si apre con un tasto; hero con immagine neutra e il
      link all'installazione dimostrativa; sei funzioni raccontate dal
      banco; i tre passi dell'attivazione; i piani con il Completo in
      evidenza e i moduli; sei domande frequenti apribili; il blocco dei
      contatti; pie' di pagina a colonne con termini, privacy e email.
      Nessuna richiesta esterna (icone inline, immagine servita dal sito).
      IL RIFACIMENTO (l'utente, 29/10/2026: «dovrebbe essere piu' moderna…
      con slogan migliori… sia in inglese che in italiano»): la pagina nuova
      e' descritta in DESIGN.md — percorso problema, promessa, prove,
      prezzo, dubbi, azione; i tre pilastri (non si ferma, e' tuo, fatto
      per il servizio); schermate vere dell'app; testi persuasivi ma
      verificabili; italiano su `/` e inglese su `/en`, coi testi in file
      per lingua.
      FATTO IL 30/10/2026 (ramo feature/home-nuova): la pagina segue il §5
      di DESIGN.md con il titolo A; il pubblico e' la ristorazione in
      generale, bar e ristoranti (l'utente: il prodotto prende le comande e
      tiene conti e cassa, non e' solo per bar), e i testi lo dicono. Titolo
      di primo livello = la promessa, non il nome del prodotto; sezioni in
      ordine problema, pilastri, funzioni (con l'etichetta del modulo che le
      porta, nascoste se il modulo non e' in vendita), passi, prezzi (piani,
      tabella dei moduli con la colonna del Completo, la convenienza del
      Completo calcolata dal listino, la nota sullo scontrino non fiscale),
      domande, chiusura. Playfair Display servita dal sito per h1 e h2; la
      foto del banco come sfondo; dissolvenza delle sezioni spenta con
      prefers-reduced-motion (src/lib/comparsa.js). LE DUE LINGUE
      (src/lib/lingua.js, src/i18n/home.it.js e home.en.js con le stesse
      chiavi): la lingua viene dall'indirizzo; selettore IT / EN nella barra
      e nel pie' di pagina della prima pagina, che ricorda la scelta in
      localStorage (se il browser non lascia, la pagina va lo stesso); chi
      ha scelto l'inglese e torna su `/` va su `/en`; la lingua del browser
      propone l'altra pagina con un avviso, mai un reindirizzamento, e una
      terza lingua ripiega sull'italiano; `<html lang>`, titolo, descrizione
      e link hreflang per lingua; importi «24 €» e «€24». Registrazione,
      dashboard, backoffice e testi legali restano in italiano, e la pagina
      inglese lo dice.
      REVISIONE DELLA PR #20 (30/10/2026): le frasi reggono ai Termini e
      alla produzione di oggi — «Lavora anche senza rete» invece di «Non si
      ferma mai» (Termini §5); le domande sui dati con la formula dei
      Termini (§6) e la chiusura distinta dalla disdetta (30 giorni, backup
      scaricabile per 180); «Attivazione automatica» e «nasce da sola» solo
      con i pagamenti online accesi o il Free in vendita, altrimenti
      l'attivazione concordata (REQ-FLOTTA-017); i terminali in più col
      prezzo del listino; il titolo dei prezzi descrittivo; la prova
      sociale neutra; stampa automatica, soglie di riordino e
      registrazione dette come sono in tana-drink; i nomi dei piani dal
      listino anche in inglese. La comparsa delle sezioni nasconde solo gli
      elementi che osserva (un modulo rimesso in vendita a pagina aperta
      si vede subito); `/EN` vale `/en`; se il browser non lascia salvare
      la lingua, la scelta vecchia si toglie e la nuova vale in memoria. Il
      preload del font solo sulla prima pagina, il peso 600 tolto.
      RESTA (DESIGN.md §9): le quattro schermate vere dell'app, la scelta
      del titolo (A, B o C), il nome del prodotto, la prova sociale, `/en`
      per chi non esegue JavaScript, la verifica Lighthouse sul telefono.
    status: partial
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/piani.test.js
      - tests/Home.test.jsx
      - tests/App.test.jsx
      - tests/HomeLingua.test.jsx
      - tests/lingua.test.js
      - tests/comparsa.test.js
  - id: REQ-FLOTTA-003
    title: "Registrazione e accesso del titolare: account con email verificata, dati del locale, di fatturazione e del referente"
    area: "src/pages/Registrati.jsx, src/pages/Accedi.jsx, src/pages/Legali.jsx, src/lib/clienti.js, src/lib/validazione.js, src/lib/db.js, firestore.rules"
    description: >
      «Per la registrazione servono molti piu' dati. Fai una roba piu'
      robusta e production grade» (l'utente, 22/10/2026).
      QUATTRO PASSI, ognuno controllato prima di andare avanti, con
      l'errore accanto alla casella: (1) account — email, password di
      almeno 10 caratteri con una cifra, ripetuta; (2) il locale — nome
      (con l'indirizzo che l'app avra', dallo slug), tipo, indirizzo con
      CAP, citta' e provincia, telefono, sito facoltativo; (3) fatturazione
      — ragione sociale, partita IVA con la cifra di controllo, codice
      fiscale facoltativo (controllato), PEC o codice destinatario SDI per
      la fattura elettronica, sede legale se diversa dal locale; (4)
      referente — nome, cognome, ruolo, telefono, e i consensi: termini di
      servizio e privacy obbligatori (con le due pagine), novita'
      facoltative. I consensi si salvano con l'istante.
      L'EMAIL VA CONFERMATA: alla registrazione parte il messaggio di
      verifica; la dashboard lo ricorda finche' non e' confermata, con
      «Invia di nuovo» e «Ho confermato»; senza email verificata non si
      attiva l'istanza (`puoAttivare`, e le regole Firestore lo ripetono
      sulla richiesta). «Password dimenticata» manda il messaggio di
      recupero senza dire se l'email esiste.
      Il documento clienti/{uid} e' a blocchi (schema 2): locale,
      fatturazione, referente, consensi; `nome_locale` e `slug` restano in
      cima perche' istanze, richieste e backoffice li leggono da li'. Le
      regole: un cliente scrive solo il suo documento, con i blocchi
      attesi, la sua email e una partita IVA di 11 cifre; piano e
      abbonamento non li tocca.
      AUDIT H1 (chiusa il 02/11/2026): dopo la registrazione il titolare
      cambia solo i blocchi locale, fatturazione, referente e consensi
      (elenco di quello che si può, non di quello che non si può), con la
      partita IVA sempre di 11 cifre e i consensi che non si cancellano;
      piano, moduli, terminali, prove, sconto, abbonamento, email e slug li
      scrivono solo l'admin e le Functions. Il sito non aggiorna mai
      clienti/{uid} dal browser: nessuna funzione dipendeva da quelle
      scritture. Le regole sono provate sul testo; il 02/11/2026 anche
      sull'emulatore di Firestore (25 casi, fuori dal repository, che non
      ha ancora l'emulatore fra le dipendenze).
      Da rivedere con un consulente prima di vendere: i testi di termini e
      privacy (src/pages/Legali.jsx) sono una struttura, non un
      parere legale.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/clienti.test.js
      - tests/validazione.test.js
      - tests/Registrati.test.jsx
  - id: REQ-FLOTTA-004
    title: "La dashboard del cliente: il suo locale, il piano, lo stato dell'istanza, l'indirizzo dell'app"
    area: "src/pages/Dashboard.jsx, src/lib/istanze.js"
    description: >
      Dopo l'accesso il titolare vede: il nome e lo slug del locale, il
      piano scelto, lo stato dell'istanza (`da attivare`, `in coda`, `in
      corso`, `attiva`, `errore`, con la data dell'ultimo passaggio) e,
      quando e' attiva, l'indirizzo dell'app e il promemoria dell'accesso
      admin. Il tasto «Attiva» chiama la Function `chiediAttivazione`
      (REQ-FLOTTA-006), senza passare dati; senza abbonamento valido
      (REQ-FLOTTA-007) il tasto spiega cosa manca, e se il server rifiuta
      la dashboard riporta il motivo. `puoAttivare` decide solo se il
      tasto e' acceso: la regola che conta la rifa' il server.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/istanze.test.js
      - tests/Dashboard.test.jsx
  - id: REQ-FLOTTA-005
    title: "Il backoffice: l'elenco dei clienti e delle istanze, per chi ha il claim admin"
    area: "src/pages/Backoffice.jsx, src/lib/backoffice.js, src/App.jsx (rotta /backoffice/*), src/index.css (.sotto-menu), firestore.rules"
    description: >
      Una pagina protetta dal claim `admin` dell'Auth della regia: tutti i
      clienti con piano, stato dell'istanza, progetto, versione pubblicata
      e ultimo passaggio; le richieste in coda o in errore in cima. Da qui
      si rilancia un'attivazione fallita e si segna un abbonamento pagato a
      mano (finche' Stripe non c'e', REQ-FLOTTA-007). La regia vede
      aggregati e stati, mai i dati operativi dei locali.
      Dal 29/10/2026 un locale per scheda (l'utente: «puoi migliorare la
      visualizzazione?»): nome e stato breve colorato in alto, i dati in
      una griglia che va a capo da sola, il link all'app del locale, le
      azioni a gruppi (istanza e piano, credito AI, licenza), con Sospendi
      e Chiudi a parte, a destra.
      IN SEZIONI, CON UN SOTTO-MENÙ (l'utente, 30/10/2026: «puoi separare le
      varie sezioni del backoffice magari in sotto menu? Così è tutto troppo
      caotico»). Cinque sezioni, ognuna col suo indirizzo, e /backoffice
      porta alla prima: «Locali» (/backoffice/locali: le schede, con la
      ricerca per nome, identificativo o email e la vista per stato — tutti,
      da seguire, attivi, in attivazione, sospesi o chiusi, eliminati —
      nell'indirizzo, così un elenco filtrato si condivide), «Richieste»
      (/backoffice/richieste: l'interruttore del deploy automatico, le
      attivazioni da autorizzare, le richieste di contatto), «Rilasci»
      (/backoffice/rilasci: i rilasci a ondate e gli aggiornamenti falliti
      tutti insieme, con Riprova e Torna indietro), «Vendita»
      (/backoffice/vendita: pagamenti online, Free, moduli e giorni di
      prova), «Nuovo locale» (/backoffice/nuovo: nuovo ed esistente; fatto,
      si torna all'elenco). Il controllo del claim admin vale per ogni
      sotto-rotta; un indirizzo che non c'è porta a «Locali». Il sotto-menù è
      un `nav` con aria-label, la voce attiva ha aria-current, e sul
      telefono la riga scorre di lato dentro sé stessa senza far scorrere la
      pagina. Un contatore sulla voce quando c'è da fare, contato una volta
      sola dove si risolve: attivazioni fallite ed eliminazioni non riuscite
      in «Locali», attivazioni da autorizzare e contatti aperti in
      «Richieste», aggiornamenti falliti in «Rilasci». I dati si leggono una
      volta per tutte le sezioni.
      «AGGIORNA» DICE COSA FA (stessa data): il bottone è «Aggiorna subito»,
      e accanto, sempre visibile e come sua descrizione accessibile, dice che
      porta solo quel locale all'ultima versione dell'app, per una
      correzione urgente, mentre a tutti un rilascio arriva a ondate da
      «Rilasci». La versione la sceglie la Function `aggiornaIstanza`
      (APP_REF: develop di tana-drink sulla regia di test, main in
      produzione) e la pagina non la scrive; l'esito dice il ref che la
      Function restituisce.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/Backoffice.test.jsx
      - tests/App.test.jsx
  - id: REQ-FLOTTA-007
    title: "L'abbonamento: Stripe Checkout nella regia, webhook che aggiorna il cliente, licenza che segue il piano"
    area: "functions/piani.json, src/lib/piani.js, src/pages/SceltaPiano.jsx, src/pages/Dashboard.jsx, src/lib/db.js (avviaPagamento), functions/index.js (creaCheckout, stripeWebhook), functions/lib/abbonamento.js"
    description: >
      Il titolare sceglie piano, moduli in piu' e terminali nella dashboard
      (SceltaPiano: il prezzo del mese si aggiorna mentre sceglie), e «Vai
      al pagamento» chiama la Function `creaCheckout`, che apre una
      sessione di Checkout di Stripe in modalita' abbonamento mensile — una
      riga per il piano, una per ogni modulo in piu', una per i terminali
      oltre quelli inclusi — con uid e scelta nei metadati. Il webhook
      `stripeWebhook` verifica la firma e aggiorna `clienti/{uid}`:
      `checkout.session.completed` scrive piano, moduli, terminali e
      abbonamento attivo; `invoice.paid` conferma; `invoice.payment_failed`
      mette in sospeso; `customer.subscription.deleted` disdice. Da li'
      `puoAttivare` (REQ-FLOTTA-004) lascia attivare l'istanza, e la
      licenza (REQ-FLOTTA-006) accende i moduli del piano.
      I PREZZI STANNO IN UN POSTO SOLO, piani.json, letto dal sito e
      dalle Functions: da confermare prima di pubblicare. Dal 02/11/2026
      (DEC-0005) il Checkout porta anche l'attivazione una tantum, la
      scelta mensile o annuale e l'offerta Fondatori: REQ-FLOTTA-021.
      Dal 02/11/2026 Stripe aggiunge l'IVA (REQ-FLOTTA-033), e il webhook
      elabora ogni evento una volta sola e in ordine (REQ-FLOTTA-034).
      IL POS NON DIPENDE DA STRIPE: un pagamento in ritardo cambia cosa dice
      la dashboard, non quello che l'istanza fa.
      STATO AL 22/10/2026: scritto, con la logica provata; le chiavi di
      Stripe (prima quelle di prova) vanno nei segreti delle Functions della
      regia (`STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`) e l'indirizzo del
      webhook va registrato su Stripe. Finche' non ci sono, «Vai al
      pagamento» spiega che il pagamento online non e' attivo e l'admin
      segna il piano a mano dal backoffice (REQ-FLOTTA-005).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/abbonamento.test.js
      - tests/SceltaPiano.test.jsx
  - id: REQ-FLOTTA-006
    title: "Le Functions della regia lanciano l'attivazione di un'istanza e ne ricevono l'esito"
    area: "functions/index.js, functions/lib/provisioning.js, functions/.env, firestore.rules, src/lib/db.js (chiediAttivazione)"
    description: >
      La parte della regia dell'attivazione automatica. Dal 29/10/2026 anche
      il workflow e il Terraform stanno qui (REQ-FLOTTA-013,
      docs/flotta-nella-regia.md); il disegno intero resta in
      tana-drink/docs/flotta.md.
      LA RICHIESTA LA SCRIVE IL SERVER (audit del 22/10/2026, falla C2:
      «Questo va assolutamente risolto», l'utente, 22/10/2026). La callable
      `chiediAttivazione` ignora il corpo della chiamata: rilegge
      `clienti/{uid}`, `istanze/{slug}`, `richieste/{slug}` e
      `impostazioni/regia`, e con `preparaRichiesta` pretende email
      verificata, piano e `abbonamento.stato == 'attivo'`, nessuna
      attivazione gia' in viaggio; slug, nome, piano e moduli (puliti col
      listino) vengono dal documento del cliente, lo stato iniziale («in
      coda» o «da approvare») dal deploy automatico. Le regole Firestore
      non lasciano creare richieste a nessun client. Prima del lancio,
      `richiestaCoerente` rilegge il cliente e rifiuta (richiesta in
      «errore», niente dispatch) se slug o uid non sono suoi o se
      l'abbonamento non e' attivo: vale anche per i rilanci dell'admin.
      Quando nasce `richieste/{slug}` in coda, o
      l'admin la rilancia (`rilanciata_il` cambia), `avviaProvisioning` /
      `rilanciaProvisioning` chiamano il workflow_dispatch di GitHub con
      slug, nome, piano, moduli e uid come stringhe, presi dal cliente; la
      richiesta passa «in corso» e nasce `istanze/{slug}`. `esitoProvisioning` riceve il POST
      del workflow col bearer `PROVISIONING_CALLBACK_SECRET` (confronto a
      tempo costante), accetta solo slug e stati noti e aggiorna istanza e
      richiesta senza perdere quello che c'era. Logica pura in
      lib/provisioning.js, provata senza emulatori.
      Segreti delle Functions: GITHUB_DISPATCH_TOKEN,
      PROVISIONING_CALLBACK_SECRET. Non ancora provato per intero.
      I ruoli del service account di provisioning (fatturazione, bucket,
      progetti dei locali) li dà scripts/ruoli-provisioning.mjs, lanciato
      da una persona; la regola pura sta in scripts/lib-iam.js. Portato
      da tana-drink col ramo feature/flotta, chiuso il 30/10/2026.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/provisioning.test.js
      - tests/flotta.test.js

  - id: REQ-DEV-001
    title: "Requisiti e test si tengono per mano anche qui"
