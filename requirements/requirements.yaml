      Checkout da li'. Il resto e' invalid-argument («Indirizzo di ritorno
      non valido: il pagamento riparte solo dal sito della regia.»). Il
      sito manda gia' window.location.origin (src/lib/db.js), quindi per
      chi usa il sito non cambia niente.
