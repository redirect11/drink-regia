    area: "functions/piani.json, functions/lib/licenza.js (MAPPA, moduliLicenza), functions/lib/moduliapp.js (compresoInOgniPiano, catalogoModuli, moduloInVendita, sceltaPerAggiungere), src/pages/Home.jsx (tabella dei moduli, etichette delle funzioni), src/i18n/home.it.js, home.en.js"
