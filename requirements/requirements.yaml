      registrazione»), con gli stessi controlli, e alla fine scrive solo
      clienti/{uid} con l'email dell'account (le regole già lo vogliono).
      L'amministratore della regia senza locale vede ancora «Nessun locale
      registrato». Chiudere la finestra non è un errore; finestra bloccata,
      email con la password che Google non garantisce, fornitore spento o
      dominio non autorizzato si spiegano in italiano. Il fornitore Google
