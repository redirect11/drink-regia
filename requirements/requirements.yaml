# Il registro dei requisiti della regia (drink-regia)
#
# Stesso formato del registro di tana-drink: ogni voce dice cosa fa il sito,
# e i test citati lo dimostrano (tests/requisiti.test.js controlla che ogni
# test esista e che ogni file di test sia citato). I percorsi dei test sono
# relativi a questo repository.

requirements:
  - id: REQ-FLOTTA-002
    title: "La regia: il sito del prodotto con i prezzi, in un progetto Firebase suo (drink-regia)"
    area: "regia/ (app React + Vite a se', con package.json, firebase.json e test propri), src/lib/piani.js, src/lib/prodotto.js"
    description: >
      «Ci serve un sito/front page con prices/registrazione/login/
      backoffice/dashboard» (l'utente, 21/10/2026). La regia e' una
      seconda app nello stesso repository, cartella `regia/`, con il suo
      progetto Firebase (`drink-regia`): non condivide ne' database ne'
      hosting con le istanze, e non sa niente dei dati dei locali.
      LA PRIMA PAGINA: cosa fa il prodotto, i piani con i prezzi
      (`piani.js`: base, terminale in piu', moduli, completo, attivazione
      — logica pura, con i prezzi in un posto solo), il tasto per
      registrarsi. Il nome visibile del prodotto sta in `prodotto.js` e si
      cambia li'. Testi nel registro del mestiere, senza toni da venditore.
      LANDING PAGE INTERA (l'utente, 22/10/2026: «deve essere una landing
      page con menu e tutto il resto, una roba seria»): barra fissa col
      menu' delle sezioni (Funzioni, Come funziona, Prezzi, Domande), che
      sul telefono si apre con un tasto; hero con immagine neutra e il
      link all'installazione dimostrativa; sei funzioni raccontate dal
      banco; i tre passi dell'attivazione; i piani con il Completo in
      evidenza e i moduli; sei domande frequenti apribili; il blocco dei
      contatti; pie' di pagina a colonne con termini, privacy e email.
      Nessuna richiesta esterna (icone inline, immagine servita dal sito).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/piani.test.js
      - tests/Home.test.jsx
      - tests/App.test.jsx
  - id: REQ-FLOTTA-003
    title: "Registrazione e accesso del titolare: account con email verificata, dati del locale, di fatturazione e del referente"
    area: "src/pages/Registrati.jsx, src/pages/Accedi.jsx, src/pages/Legali.jsx, src/lib/clienti.js, src/lib/validazione.js, src/lib/db.js, firestore.rules"
    description: >
      «Per la registrazione servono molti piu' dati. Fai una roba piu'
      robusta e production grade» (l'utente, 22/10/2026).
      QUATTRO PASSI, ognuno controllato prima di andare avanti, con
      l'errore accanto alla casella: (1) account — email, password di
      almeno 10 caratteri con una cifra, ripetuta; (2) il locale — nome
      (con l'indirizzo che l'app avra', dallo slug), tipo, indirizzo con
      CAP, citta' e provincia, telefono, sito facoltativo; (3) fatturazione
      — ragione sociale, partita IVA con la cifra di controllo, codice
      fiscale facoltativo (controllato), PEC o codice destinatario SDI per
      la fattura elettronica, sede legale se diversa dal locale; (4)
      referente — nome, cognome, ruolo, telefono, e i consensi: termini di
      servizio e privacy obbligatori (con le due pagine), novita'
      facoltative. I consensi si salvano con l'istante.
      L'EMAIL VA CONFERMATA: alla registrazione parte il messaggio di
      verifica; la dashboard lo ricorda finche' non e' confermata, con
      «Invia di nuovo» e «Ho confermato»; senza email verificata non si
      attiva l'istanza (`puoAttivare`, e le regole Firestore lo ripetono
      sulla richiesta). «Password dimenticata» manda il messaggio di
      recupero senza dire se l'email esiste.
      Il documento clienti/{uid} e' a blocchi (schema 2): locale,
      fatturazione, referente, consensi; `nome_locale` e `slug` restano in
      cima perche' istanze, richieste e backoffice li leggono da li'. Le
      regole: un cliente scrive solo il suo documento, con i blocchi
      attesi, la sua email e una partita IVA di 11 cifre; piano e
      abbonamento non li tocca.
      Da rivedere con un consulente prima di vendere: i testi di termini e
      privacy (src/pages/Legali.jsx) sono una struttura, non un
      parere legale.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/clienti.test.js
      - tests/validazione.test.js
      - tests/Registrati.test.jsx
  - id: REQ-FLOTTA-004
    title: "La dashboard del cliente: il suo locale, il piano, lo stato dell'istanza, l'indirizzo dell'app"
    area: "src/pages/Dashboard.jsx, src/lib/istanze.js"
    description: >
      Dopo l'accesso il titolare vede: il nome e lo slug del locale, il
      piano scelto, lo stato dell'istanza (`da attivare`, `in coda`, `in
      corso`, `attiva`, `errore`, con la data dell'ultimo passaggio) e,
      quando e' attiva, l'indirizzo dell'app e il promemoria dell'accesso
      admin. Il tasto «Attiva» chiama la Function `chiediAttivazione`
      (REQ-FLOTTA-006), senza passare dati; senza abbonamento valido
      (REQ-FLOTTA-007) il tasto spiega cosa manca, e se il server rifiuta
      la dashboard riporta il motivo. `puoAttivare` decide solo se il
      tasto e' acceso: la regola che conta la rifa' il server.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/istanze.test.js
      - tests/Dashboard.test.jsx
  - id: REQ-FLOTTA-005
    title: "Il backoffice: l'elenco dei clienti e delle istanze, per chi ha il claim admin"
    area: "src/pages/Backoffice.jsx, firestore.rules"
    description: >
      Una pagina protetta dal claim `admin` dell'Auth della regia: tutti i
      clienti con piano, stato dell'istanza, progetto, versione pubblicata
      e ultimo passaggio; le richieste in coda o in errore in cima. Da qui
      si rilancia un'attivazione fallita e si segna un abbonamento pagato a
      mano (finche' Stripe non c'e', REQ-FLOTTA-007). La regia vede
      aggregati e stati, mai i dati operativi dei locali.
      Dal 29/10/2026 un locale per scheda (l'utente: «puoi migliorare la
      visualizzazione?»): nome e stato breve colorato in alto, i dati in
      una griglia che va a capo da sola, il link all'app del locale, le
      azioni a gruppi (istanza e piano, credito AI, licenza), con Sospendi
      e Chiudi a parte, a destra.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/Backoffice.test.jsx
  - id: REQ-FLOTTA-007
    title: "L'abbonamento: Stripe Checkout nella regia, webhook che aggiorna il cliente, licenza che segue il piano"
    area: "functions/piani.json, src/lib/piani.js, src/pages/SceltaPiano.jsx, src/pages/Dashboard.jsx, src/lib/db.js (avviaPagamento), functions/index.js (creaCheckout, stripeWebhook), functions/lib/abbonamento.js"
    description: >
      Il titolare sceglie piano, moduli in piu' e terminali nella dashboard
      (SceltaPiano: il prezzo del mese si aggiorna mentre sceglie), e «Vai
      al pagamento» chiama la Function `creaCheckout`, che apre una
      sessione di Checkout di Stripe in modalita' abbonamento mensile — una
      riga per il piano, una per ogni modulo in piu', una per i terminali
      oltre quelli inclusi — con uid e scelta nei metadati. Il webhook
      `stripeWebhook` verifica la firma e aggiorna `clienti/{uid}`:
      `checkout.session.completed` scrive piano, moduli, terminali e
      abbonamento attivo; `invoice.paid` conferma; `invoice.payment_failed`
      mette in sospeso; `customer.subscription.deleted` disdice. Da li'
      `puoAttivare` (REQ-FLOTTA-004) lascia attivare l'istanza, e la
      licenza (REQ-FLOTTA-006) accende i moduli del piano.
      I PREZZI STANNO IN UN POSTO SOLO, piani.json, letto dal sito e
      dalle Functions: da confermare prima di pubblicare.
      IL POS NON DIPENDE DA STRIPE: un pagamento in ritardo cambia cosa dice
      la dashboard, non quello che l'istanza fa.
      STATO AL 22/10/2026: scritto, con la logica provata; le chiavi di
      Stripe (prima quelle di prova) vanno nei segreti delle Functions della
      regia (`STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`) e l'indirizzo del
      webhook va registrato su Stripe. Finche' non ci sono, «Vai al
      pagamento» spiega che il pagamento online non e' attivo e l'admin
      segna il piano a mano dal backoffice (REQ-FLOTTA-005).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/abbonamento.test.js
      - tests/SceltaPiano.test.jsx
  - id: REQ-FLOTTA-006
    title: "Le Functions della regia lanciano l'attivazione di un'istanza e ne ricevono l'esito"
    area: "functions/index.js, functions/lib/provisioning.js, functions/.env, firestore.rules, src/lib/db.js (chiediAttivazione)"
    description: >
      La parte della regia dell'attivazione automatica. Dal 29/10/2026 anche
      il workflow e il Terraform stanno qui (REQ-FLOTTA-013,
      docs/flotta-nella-regia.md); il disegno intero resta in
      tana-drink/docs/flotta.md.
      LA RICHIESTA LA SCRIVE IL SERVER (audit del 22/10/2026, falla C2:
      «Questo va assolutamente risolto», l'utente, 22/10/2026). La callable
      `chiediAttivazione` ignora il corpo della chiamata: rilegge
      `clienti/{uid}`, `istanze/{slug}`, `richieste/{slug}` e
      `impostazioni/regia`, e con `preparaRichiesta` pretende email
      verificata, piano e `abbonamento.stato == 'attivo'`, nessuna
      attivazione gia' in viaggio; slug, nome, piano e moduli (puliti col
      listino) vengono dal documento del cliente, lo stato iniziale («in
      coda» o «da approvare») dal deploy automatico. Le regole Firestore
      non lasciano creare richieste a nessun client. Prima del lancio,
      `richiestaCoerente` rilegge il cliente e rifiuta (richiesta in
      «errore», niente dispatch) se slug o uid non sono suoi o se
      l'abbonamento non e' attivo: vale anche per i rilanci dell'admin.
      Quando nasce `richieste/{slug}` in coda, o
      l'admin la rilancia (`rilanciata_il` cambia), `avviaProvisioning` /
      `rilanciaProvisioning` chiamano il workflow_dispatch di GitHub con
      slug, nome, piano, moduli e uid come stringhe, presi dal cliente; la
      richiesta passa «in corso» e nasce `istanze/{slug}`. `esitoProvisioning` riceve il POST
      del workflow col bearer `PROVISIONING_CALLBACK_SECRET` (confronto a
      tempo costante), accetta solo slug e stati noti e aggiorna istanza e
      richiesta senza perdere quello che c'era. Logica pura in
      lib/provisioning.js, provata senza emulatori.
      Segreti delle Functions: GITHUB_DISPATCH_TOKEN,
      PROVISIONING_CALLBACK_SECRET. Non ancora provato per intero.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/provisioning.test.js

  - id: REQ-DEV-001
    title: "Requisiti e test si tengono per mano anche qui"
    area: "requirements/requirements.yaml, tests/requisiti.test.js, CLAUDE.md"
    description: >
      Come in tana-drink: ogni file di test e' citato da un requisito, ogni
      test citato esiste, ogni voce ha id, titolo, stato e test. Un test lo
      controlla, cosi' il registro non invecchia in silenzio.
    status: implemented
    generate_issue: false
    labels: [metodo]
    test_cases:
      - tests/requisiti.test.js
  - id: REQ-DEV-002
    title: "Le Actions come tana-drink: un push non pubblica, il tag va sul test o in produzione, con un progetto Firebase di test"
    area: ".github/workflows/test.yml, firebase-hosting.yml, deploy.yml, vitest.config.mjs, src/App.jsx (nastro TEST), scripts/abilita-api.mjs, scripts/abilita-accesso-email.mjs, scripts/segreti-environment.mjs, functions/.env.<progetto>, functions/piani.json"
    description: >
      Lo stesso modello di pubblicazione di tana-drink
      (docs/actions-come-tana-drink.md, l'utente, 22/10/2026: «replicare le
      action, il sito di test con il suo db per le prove e il workflow»).
      Un push su un ramo qualsiasi (tranne release/**) fa lint, test e
      build e basta; una pull request verso develop o main anche la
      coverage, con soglie per area in vitest.config.mjs che si alzano e
      non si abbassano. Pubblicano solo il tag e il lancio a mano di «Deploy
      to Firebase»: il job «Dove va» guarda dove sta il commit, su main e'
      produzione (drink-regia, environment `production` con approvazione),
      tutto il resto e' test (drink-regia-test, environment `test`). Il
      deploy riusabile (deploy.yml) ha l'environment scritto a chiare
      lettere e la guardia: se VITE_FIREBASE_PROJECT_ID non coincide col
      progetto di destinazione si ferma. Il sito fuori dalla produzione
      porta un nastro «TEST» con la versione, e il pie' di pagina dice la
      versione pubblicata (VITE_APP_ENV, VITE_APP_VERSION dal deploy,
      package.json come ripiego). Le Functions leggono la configurazione
      per progetto da functions/.env.<progetto>. Gli script per un progetto
      nuovo (API, Auth email, segreti dell'environment) usano il token del
      Firebase CLI: niente gcloud, niente chiavi nel repository.
      Firebase carica solo la cartella functions/: le Functions non
      leggono file fuori da li', e il listino vive in functions/piani.json,
      letto da li' anche dal sito (il primo deploy sul test, 29/10/2026,
      non avviava nessuna Function: il listino stava nella radice, e una
      copia fatta dal predeploy non arrivava nel pacchetto).
      STATO AL 22/10/2026: codice e test fatti; il progetto
      drink-regia-test, i service account del deploy, l'environment `test`
      e i segreti si fanno col permesso dell'utente (docs/handover.md §5).
    status: implemented
    generate_issue: false
    labels: [metodo, regia]
    test_cases:
      - tests/ci.test.js
      - tests/App.test.jsx
  - id: REQ-DEV-003
    title: "Le issue nascono dal registro e la bacheca le segue, come in tana-drink"
    area: "scripts/generate-issues.mjs, scripts/lib-requisiti.mjs, scripts/bacheca.mjs, .github/workflows/generate-issues.yml"
    description: >
      «Va creato anche il project su GitHub per gestire le issue come per
      tana-drink» (l'utente, 22/10/2026). Script e workflow copiati da
      tana-drink: a ogni push che tocca requirements/requirements.yaml o
      requirements/bugs.yaml le voci con generate_issue: true diventano
      issue «[ID] titolo», idempotenti per identificativo; una voce finita
      porta la scheda su «Implemented» dai rami di lavoro, su «In test» da
      develop (etichetta in-test), e chiude l'issue da main; una voce
      scartata (deprecated, wontfix) chiude come «not planned». La bacheca
      e' il project GitHub «drink-regia» (n. 5 dell'account redirect11),
      creato il 22/10/2026 con le colonne di tana-drink (To triage,
      Backlog, Ready, Implemented, In test, Done) e i campi Priority,
      Severity, Size, collegato al repository. Le schede si muovono da sole
      solo col segreto PROJECT_TOKEN (token personale con scope project,
      lo mette l'utente); senza, le issue si aggiornano lo stesso.
    status: implemented
    generate_issue: false
    labels: [metodo, regia]
    test_cases:
      - tests/issue.test.js

  - id: REQ-FLOTTA-008
    title: "Un'istanza si ferma: Sospendi, Riattiva e Chiudi dal backoffice, e la sospensione automatica di chi non paga"
    area: "functions/index.js (impostaStatoIstanza, sospendiMorosi), functions/lib/sospensione.js, src/pages/Backoffice.jsx, src/lib/db.js"
    description: >
      «Serve un modo per eliminare/fermare l'app deployata (ad esempio se
      non arriva il pagamento mensile)» (l'utente, 22/10/2026). La parte
      della regia: lo stato della licenza dell'istanza
      (`settings/bar.licenza.stato`: attiva, sospesa, chiusa) lo scrive la
      Function `impostaStatoIstanza`, cross-progetto, a cui il backoffice
      arriva coi tasti Sospendi (con motivo), Chiudi e Riattiva; e la
      Function giornaliera `sospendiMorosi` sospende chi ha l'abbonamento
      «in sospeso» da piu' di sette giorni, chiude chi ha disdetto e
      riattiva chi e' tornato a pagare (logica pura in lib/sospensione.js).
      `istanze/{slug}` tiene `licenza_stato` e `licenza_motivo` per il
      backoffice. Cosa fa l'app quando e' sospesa sta nel repository
      tana-drink (REQ-FLOTTA-008 di la'): si ferma, lo dice, i dati restano.
      La cancellazione vera del progetto e' un gesto a mano, dopo i 30
      giorni promessi (scripts/elimina-istanza.mjs in tana-drink).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/sospensione.test.js
      - tests/Backoffice.test.jsx

  - id: REQ-FLOTTA-009
    title: "Gli aggiornamenti dell'app arrivano ai locali che si decide: «Aggiorna» su un locale, i rilasci a ondate per tutti"
    area: "functions/index.js (aggiornaIstanza), functions/lib/provisioning.js (dispatchAggiornamento), src/pages/Backoffice.jsx, src/lib/db.js, functions/.env (APP_REF)"
    description: >
      «La versione dovrebbe seguire l'app di base, quindi mi aspetto che
      tutte le versioni delle app deployate dovrebbero essere allineate
      all'app base che per ora rimane tana-drink. Tutte le
      modifiche/bugfix/aggiornamenti sull'app base dovrebbero essere
      deployate anche su tutti i siti cliente o comunque decidere su quali
      clienti deployare gli aggiornamenti» (l'utente, 22/10/2026).
      LA VERSIONE E' QUELLA DI TANA-DRINK: ogni istanza mostra in
      `istanze/{slug}.versione` la versione dell'app che ha, riferita dal
      workflow a ogni pubblicazione. Un rilascio di tana-drink non tocca i
      locali da solo: dal backoffice, «Aggiorna» su una riga porta a quel
      locale la versione in APP_REF (di norma `main`, l'ultimo rilascio;
      finche' la flotta non e' merged, feature/flotta): serve per una
      correzione urgente su un locale solo. A tutti i locali un rilascio
      arriva a ondate (REQ-FLOTTA-012), che hanno preso il posto di
      «Aggiorna tutte le istanze attive» il 27/10/2026. La
      Function `aggiornaIstanza` (solo admin) lancia il workflow
      `aggiorna-istanza.yml` di tana-drink, che compila per quel locale,
      pubblica e riferisce la versione. Un tag passato come `ref` riporta
      un locale a una versione precedente.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/provisioning.test.js
      - tests/Backoffice.test.jsx

  - id: REQ-FLOTTA-010
    title: "I servizi premium si comprano e si cambiano dalla dashboard, e la licenza dell'istanza li accende"
    area: "functions/index.js (cambiaScelta, licenzaSegueIlPiano), functions/lib/licenza.js, functions/lib/abbonamento.js (customer.subscription.updated), src/pages/SceltaPiano.jsx (modifica), src/pages/Dashboard.jsx"
    description: >
      «Dobbiamo attivare il supporto per i servizi premium e l'acquisto dei
      servizi premium» (l'utente, 22/10/2026).
      Con l'abbonamento attivo la dashboard mostra «Cambia piano o moduli»:
      lo stesso selettore della prima scelta, col prezzo del mese che si
      aggiorna, e «Aggiorna il piano» al posto del Checkout. La Function
      `cambiaScelta` aggiorna la subscription di Stripe (righe nuove al
      posto delle vecchie, conguaglio pro rata, metadati con la scelta) e
      il webhook `customer.subscription.updated` riporta piano, moduli e
      terminali sul cliente; per un piano segnato a mano scrive subito.
      LA LICENZA SEGUE: `licenzaSegueIlPiano` scatta quando piano, moduli o
      terminali del cliente cambiano e l'istanza e' attiva, e riscrive
      `settings/bar.licenza` nell'istanza (moduli dell'app da piani.json:
      magazzino → conta; il completo accende tutto). L'app li legge subito
      (lib/licenza.js di tana-drink: incluso e acceso).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/licenza.test.js
      - tests/abbonamento.test.js
      - tests/SceltaPiano.test.jsx
      - tests/Dashboard.test.jsx

  - id: REQ-FLOTTA-011
    title: "Il backoffice governa i deploy: interruttore del deploy automatico, richieste da autorizzare, un locale creato dall'admin"
    area: "src/pages/Backoffice.jsx, src/lib/db.js, src/lib/istanze.js, functions/index.js (creaCliente), firestore.rules (impostazioni/regia, richieste)"
    description: >
      «Nel backoffice nostro ci deve essere la possibilita' di
      attivare/disattivare il deploy automatico e gestire le richieste di
      deploy da parte mia. Ad esempio se e' disattivato il deploy
      automatico, sono io ad autorizzare il deploy di una nuova app. E poi
      sempre lato backoffice devo poter creare anche io una nuova app»
      (l'utente, 22/10/2026).
      L'INTERRUTTORE: `impostazioni/regia.deploy_automatico` (acceso di
      partenza), cambiato dal backoffice. Acceso, «Attiva» del titolare
      mette la richiesta «in coda» e la Function la lancia; spento, la
      richiesta nasce «da approvare» e la dashboard dice «In attesa di
      autorizzazione». Il backoffice mostra le richieste da autorizzare in
      cima, con Autorizza (→ in coda: parte) e Rifiuta (con motivo, che il
      titolare legge).
      UN LOCALE DALL'ADMIN: il modulo «Nuovo locale» (nome, email del
      titolare, piano, moduli, terminali, «attiva subito») chiama la
      Function `creaCliente`: crea l'account del titolare senza password
      (la imposta lui con «Password dimenticata»), il documento del cliente
      con piano a mano e abbonamento manuale attivo, e se chiesto la
      richiesta di attivazione gia' in coda. I consensi restano da
      raccogliere e il documento lo dice.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/istanze.test.js
      - tests/provisioning.test.js
      - tests/Backoffice.test.jsx

  - id: REQ-FLOTTA-012
    title: "I rilasci arrivano ai locali a ondate: prova, interne, pilota, tutti; un aggiornamento fallito ferma il rilascio, non il locale"
    area: "functions/lib/rilasci.js, functions/lib/provisioning.js (eAggiornamento, documentoAggiornamento), functions/index.js (gestisciRilascio, aggiornaIstanza, esitoProvisioning), firestore.rules (rilasci), src/pages/Rilasci.jsx, src/pages/Backoffice.jsx, src/lib/rilasci.js, src/lib/db.js"
    description: >
      «Gli aggiornamenti vanno fatti a ondate. Con molti progetti, un
      rilascio va prima sul test, poi sulla Tana, poi su un primo gruppo,
      poi su tutti. La regia deve sapere quale versione gira in ogni locale
      e cosa fare se un aggiornamento fallisce. — Va bene gestiamolo»
      (l'utente, 27/10/2026).
      UN RILASCIO E' UN TAG vX.Y.Z di tana-drink, mai `main`: fra
      un'ondata e l'altra `main` puo' andare avanti. Il backoffice lo crea
      (riquadro «Rilasci», un rilascio aperto alla volta) e la Function
      `gestisciRilascio` fotografa le ondate in `rilasci/{tag}`: prova
      (gruppo «prova», istanze nostre), interna (interne ed esistenti, come
      la Tana), pilota (gruppo «pilota»), generale (tutte le altre attive;
      le chiuse no). Il gruppo lo sceglie l'admin, riga per riga.
      UN'ONDATA ALLA VOLTA: la avvia l'admin, e solo quando quella prima e'
      finita senza falliti, in corso o in attesa. Un locale esistente non
      si lancia: pubblica dal suo repository e l'ondata aspetta che
      riferisca la versione del tag.
      UN AGGIORNAMENTO FALLITO non segna piu' l'istanza in «errore»: un
      esito su un'istanza gia' attiva (o su un locale esistente, o con
      `operazione: aggiornamento`) e' un aggiornamento, e scrive solo
      `istanze/{slug}.aggiornamento` (stato, ref, versione di prima,
      errore); versione e ref cambiano solo se e' riuscito. Il rilascio si
      ferma con il perche'; dalla riga del locale si riprova o si torna
      alla versione di prima (un tag), poi si riprende con l'ondata
      successiva. L'ultima ondata finita chiude il rilascio.
