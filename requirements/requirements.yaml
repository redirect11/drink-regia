      fermare e far ripartire con un bottone; chi ha chiesto meno
      movimento il bottone non lo vede. (11) «Cosa comprende» nelle
      funzioni è chiuso e si apre a richiesta. (12) Un gesto con più
      moduli dice solo le frasi dei moduli in vendita.
      LA PAGINA SCURA, aggiunta in corsa l'11/11/2026: vista la bozza,
      Daniele ha detto «lo sfondo troppo chiaro cozza un po' con il
      verde lime». La prima pagina passa al fondo scuro, lo stesso nero
