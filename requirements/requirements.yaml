      - tests/hosting.test.js

  - id: REQ-FLOTTA-060
    title: "La prima pagina coi filmati: il barman dietro al titolo e i cinque gesti del locale"
    area: "src/pages/Home.jsx, src/i18n/home.it.js, src/i18n/home.en.js, src/index.css, public/video/, DESIGN.md"
    description: >
      Richieste di Daniele dell'11/11/2026, in chat. «Facciamo una pagina
      moderna come quelle di oggi dove nella parte sopra di front page
