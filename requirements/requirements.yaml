  - id: REQ-FLOTTA-048
    title: "Il progetto è di questa regia: etichetta ambiente e stato Terraform prima di eliminare o aggiornare; lo SHA pubblicato pronto per l'esito"
    area: ".github/workflows/elimina-istanza.yml (Il progetto è di questa regia?), .github/workflows/aggiorna-istanza.yml (job prepara: Il progetto è di questa regia?), .github/workflows/provisiona-istanza.yml (output commit, COMMIT_APP), infra/README.md"
    description: >
      Audit di sicurezza del 09/11/2026, punto 7 e primo punto del 29. Le
      due regie (produzione e test) usano la stessa chiave di provisioning:
      `elimina-istanza.yml` controllava slug e nome dell'ambiente e poi
      faceva `gcloud projects delete` e cancellava lo stato, senza leggere
      a chi appartenesse il progetto. Con `ambiente: test` si eliminava un
      locale di produzione. E in `aggiorna-istanza.yml` l'input `progetto`
      può nominare un progetto qualunque tranne le due regie.
      L'ELIMINAZIONE: subito dopo le credenziali e le dipendenze, prima del
      backup (che leggerebbe dati non nostri) e a maggior ragione prima di
      eliminare, il passo «Il progetto è di questa regia?» chiede due cose,
      tutte e due necessarie: `gcloud projects describe` dell'etichetta
      `ambiente` (quella che il Terraform mette sul progetto,
      infra/istanza/main.tf) uguale all'ambiente del lancio, e lo stato
      Terraform presente in gs://TFSTATE_BUCKET/istanze/<slug>/. Se una
      manca: `::error::` chiaro e `exit 1`, prima di qualunque azione.
      L'AGGIORNAMENTO: lo stesso controllo dell'etichetta nel job `prepara`,
      subito dopo le credenziali (gcloud autenticato con la stessa chiave),
      prima del Terraform e del deploy. Un locale esistente (la Tana, la
      demo: REQ-FLOTTA-018, REQ-FLOTTA-019) non ha l'etichetta: gliela dà
      una volta, a mano, chi lo affida a quella regia (`gcloud projects
      update <progetto> --update-labels ambiente=produzione`); il messaggio
      d'errore lo dice. Finché non ce l'ha, nessuna regia lo tocca: è il
      punto. DA FARE PRIMA DEL PROSSIMO AGGIORNAMENTO di drinkpos-demo e
      di tana-drink dalla regia di produzione: l'etichetta.
      LO SHA PUBBLICATO: `APP_REF=main` compila «quello che c'è su main
      adesso» e l'esito non registrava quale commit. Ora `controlla`
      esporta `commit` (`git rev-parse HEAD` del checkout controllato),
      `compila` compila esattamente quello, e `pubblica` lo ha in
      COMMIT_APP. Il campo `commit` nel JSON del callback NON è ancora
      aggiunto: il passo lo sta cambiando un'altra PR dello stesso giorno
      (run_id, inviato_il); un TODO(REQ-FLOTTA-048) accanto al passo dice
      cosa aggiungere, lo fa chi integra le due PR. Lato Functions
      (`esitoProvisioning`, `istanze/<slug>.commit`) niente è cambiato.
    status: implemented
    generate_issue: true
    issue_a_posteriori: true
