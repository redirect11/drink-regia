      Stripe) o, se il rinnovo non si sa, dopo 30 giorni, e riceve subito un
      avviso nell'app e nella dashboard; chi si attiva dopo le prende
      subito. In un rilascio un locale a scelta riceve una proposta con le
      note del CHANGELOG di tana-drink dalla sua versione al tag, invece
      del deploy; un locale senza aggiornamenti nel piano resta fuori;
      nessuno dei due ferma l'ondata. Il titolare sceglie «Aggiorna» o
      «Salta» dalla dashboard, o dall'app, che chiama la regia
      (sceltaDallApp) col token d'accesso del titolare: la regia riconosce
