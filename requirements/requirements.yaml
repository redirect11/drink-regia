  - id: REQ-FLOTTA-087
    title: "Il Free non ha l'AI: la regia rifiuta le richieste AI, le ricariche e gli omaggi di un locale Free, e la licenza lo dice"
    area: "functions/lib/ai.js (aiConcessa), functions/index.js (richiestaAI, temaDaMockup, creaRicaricaAI, gestisciCassettoAI), functions/piani.json (piani.free.limiti.ai), src/lib/ai.js, src/lib/areaTitolare.js, src/pages/Dashboard.jsx, src/pages/TemiSuMisura.jsx, src/pages/Backoffice.jsx, docs/handover.md §7"
