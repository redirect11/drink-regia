      «sì». Su «Quello che si vede dal banco»: «questa roba qua è orribile
      e va cambiata. Non si capisce proprio che vuole dire», e fra le tre
      strade proposte: «toglila». I filmati li ha generati lui con LTX 2.5
      e li ha caricati in chat.
      COSA SI FA. La prima schermata ha il filmato del barman a tutta
      larghezza, scurito dal lato del testo; titolo, sottotitolo, bottoni
      e scheda dei fatti restano. Sotto, al posto di «Quello che si vede
      dal banco» e dei tre pilastri, i cinque gesti del locale, uno per
      fascia a tutta larghezza col suo filmato e una parola sola: Ordina,
      Prepara, Incassa, Conta, Riordina. Ogni fascia ha una riga su cosa
      fa l'app e i moduli che servono. L'elenco delle funzioni resta
      prima dei prezzi, più corto: il dettaglio «Cosa comprende» si apre
      a richiesta.
      CRITERI DI ACCETTAZIONE. (1) Dietro al titolo c'è un video muto, in
      ciclo, nascosto ai lettori di schermo, col fermo immagine come
      poster. (2) Chi chiede meno movimento, o di risparmiare dati, vede
      i fermi immagine e nessun video. (3) I cinque gesti sono in
