      operation»).
      Resta, una volta sola e solo se manca: l'account di provisioning
      della regia deve poter gestire gli account dei progetti della Tana
      (come per i locali della flotta, dove è proprietario). [da
      verificare] se lo ha già: lo dice il primo giro del workflow.
    status: implemented
    generate_issue: true
    labels: [flotta, regia, ai]
    priority: P2
    test_cases:
      - tests/flotta.test.js

