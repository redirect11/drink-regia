      automatizzato».
      VISTO SUL TEST (beta.17, 12/11/2026): l'aggiornamento di prova-bar
      non ha riapplicato il Terraform («Il progetto è già completo»): lo
      riapplica solo per passare dal Free al completo. Quindi anche i
      locali della flotta già attivi non ricevono l'account dal Terraform,
      ma solo quelli che nascono adesso.
      CRITERI DI ACCETTAZIONE. (1) Nell'aggiornamento di ogni locale col
      profilo completo, della flotta o esistente, prima del deploy, la
      regia crea l'account `ai-locale` nel suo progetto se manca, e gli dà
      gli stessi ruoli del Terraform (Firestore e log del progetto),
      aggiungendo e mai togliendo. Se c'è già, non cambia niente. (2) La
      demo no: non ha l'AI. (3) Se la regia
      non ha il permesso di farlo, il passo lo dice con un avviso e il
      deploy continua: l'AI di quel locale resta spenta, il resto lavora.
      (4) Lo script e il Terraform danno gli stessi ruoli: un test li
