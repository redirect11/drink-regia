  - id: REQ-FLOTTA-098
    title: "I collaboratori di un locale: li aggiunge il titolare, vedono il locale e aprono l'app, l'abbonamento resta del titolare"
    area: "functions/lib/collaboratori.js, functions/lib/passaggio.js (membroNelLocale), functions/index.js (gestisciCollaboratori, vistaCollaboratore, passaggioVersoApp), src/pages/Collaboratori.jsx, src/pages/DashboardCollaboratore.jsx, src/pages/Dashboard.jsx, src/lib/areaTitolare.js, src/lib/db.js (gestisciCollaboratori, vistaCollaboratore, osservaUtente)"
    description: >
