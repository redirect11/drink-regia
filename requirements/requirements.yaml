      Il contratto viene da tana-drink, REQ-AI-006 (ramo feature/chat-ai,
      13/11/2026, «IL CONTRATTO CON LA REGIA» e «GLI STRUMENTI»;
      functions/lib/ai-service.js: CAMPI.chat, interpreta, STRUMENTI_CHAT,
      STRUMENTI_ADMIN). La chat sta in un pannello del gestionale, senza
      memoria fra una conversazione e l'altra (Daniele, 12/11/2026), e
      chiede alla regia con lo stesso gettone delle altre richieste AI.
      LE DECISIONI DI DANIELE DEL 13/11/2026. Il modello è Sonnet: «Per
      tutto»; il modello di ogni tipo, chat compresa, lo sceglie l'admin dal
      backoffice (REQ-FLOTTA-092). I limiti: «rendi questi parametri
      configurabili da backoffice di admin». Niente memoria: la regia non
      conserva le conversazioni (la regia non tiene i dati dei locali), e un
      turno ritoccato lo riconosce dalla firma. Il costo massimo prima di
      prenotare lo dà il conteggio dei token di REQ-FLOTTA-093. Sui dubbi
      della prima stesura (issue #232), lo stesso giorno: «per tutti i 10 i
      punti facciamo come dici». Quindi: il 409 troppo-lunga, il segreto
      AI_CHAT_SECRET, uno strumento per turno all'inizio, limiti_strumenti
      nella risposta della chat, il 503 quando il conteggio non risponde, lo
      sforamento come lo regola la 093, i limiti nel backoffice con un
      tetto per ciascuno. L'implementazione è partita dopo che REQ-FLOTTA-092 e
      REQ-FLOTTA-093 sono arrivate in develop (PR #234).
      LA CACHE (Daniele, 13/11/2026, sul ripiego e sulla stima al prezzo
      più alto): «stiamo con la soglia più alta basta che questo non
      allunghi troppo i tempi di attesa. Considera che una chat che cresce
      e la rimanda tutta il costo delle richieste aumenta». Quindi il
      ripiego resta `fallbacks: 'default'`, la stima resta al prezzo più
      alto del listino, e la chat usa la cache del prompt di Anthropic.
      CRITERI DI ACCETTAZIONE. (1) LA RICHIESTA. richiestaAI accetta dal
      gettone del locale `{ tipo: 'chat', messaggi, strumenti, versione }`,
      dopo il controllo del piano (402 piano, REQ-FLOTTA-087) e prima delle
      richieste a schema; un campo in più (sistema, modello, token,
      strumenti definiti) è un 400. `messaggi` è nel formato di Anthropic,
      comincia e finisce con un turno di chi scrive; i turni di chi scrive
      sono un testo non vuoto o blocchi `text` e `tool_result` di solo
      testo: immagini e documenti sono un 400 (il file di una fattura passa
      dalla richiesta `fattura`); i `tool_result` vengono prima di
      qualunque `text` dello stesso turno, sennò è un 400 (Anthropic lo
      rifiuterebbe). Ogni `tool_result` risponde a un
      `tool_use` del turno del modello subito prima, e ogni `tool_use` ha
      il suo esito; due turni di chi scrive di fila vanno bene (dopo un
      errore si riscrive), due del modello no; uno strumento usato nella
      conversazione dev'essere ancora fra quelli dati. `strumenti` sono solo
      identificativi fra `giacenza`, `vendite`, `cerca_prodotti`,
      `proponi_descrizione`, `proponi_voce_menu`, `leggi_fattura`; altro è
      un 400. Il controllo dei ruoli (`leggi_fattura` solo dell'admin) lo
      fa l'app. (2) LA FIRMA. Ogni turno che la regia dà (`turno`) è `{
      role: 'assistant', content, firma }`: `content` com'è tornato dal
      modello, passato da JSON prima di firmarlo (un campo `undefined`
      sparisce, `null` resta), e `firma` è `<impronta del contesto>.<HMAC>`:
      l'impronta del contesto (22 caratteri, sha256 di istruzioni e
      definizioni degli strumenti, righe comprese) in chiaro, e un
      HMAC-SHA256 sulla forma canonica (chiavi in ordine) di slug,
      versione, impronta del contesto, impronta dei messaggi precedenti
      (`prima`, a catena: un anello per messaggio, ruolo e contenuto) e
      content, col segreto delle Functions
      `AI_CHAT_SECRET` (defineSecret, legato solo a richiestaAI). Un turno
      spostato in un'altra conversazione o in un altro punto della stessa
      è un 400. La forma canonica si ferma a 32 livelli
      (MAX_PROFONDITA): oltre, e per qualunque altro errore nel preparare
      la chat (un oggetto annidato oltre lo stack), un 400, mai un 500. Il
      segreto lo crea il coordinatore sul progetto drink-regia-test prima
      del primo tag beta che porta la chat; in produzione solo col via
      libera di Daniele, prima del deploy, che senza si ferma. La verifica è a tempo
      costante. Un turno del modello senza firma o che non torna (testo
      cambiato, blocco tolto, altro locale, altra versione) è un 400. La
      firma si toglie prima di mandare la conversazione al modello. Senza
      un segreto usabile (vuoto, corto, `non-configurato`) la chat risponde
      503 servizio, senza prenotare. La regia non scrive niente della
      conversazione. (3) LA VERSIONE. `VERSIONE_CHAT` (al massimo 64
      caratteri) cambia quando cambiano le istruzioni o le definizioni degli
      strumenti, e torna in ogni risposta. Una richiesta con un'altra
      versione è un 409 `{ codice: 'versione' }`, controllato prima della
      firma; senza versione, o in una conversazione che non ha ancora
      turni del modello, vale quella di adesso (domanda di tana-drink del
      13/11/2026: un'app che la manda già dal primo turno non apre
      conversazioni nuove all'infinito). Esiti e domanda in due turni di
      chi scrive di fila sono accettati così come sono: unirli vorrebbe
      dire ritoccare un messaggio vecchio. Dalla revisione della PR #237 è `chat-2026-11-13.2`. Lo stesso 409
      versione arriva quando un turno del modello è stato firmato con un
      altro contesto (l'admin ha cambiato le righe, o l'app manda un altro
      elenco di `strumenti`): col ragionamento di Sonnet 5.5, `system` o
      `tools` diversi a metà conversazione fanno perdere i blocchi di
      ragionamento o danno un 400. Gli altri limiti (token, strumenti per
      messaggio) non stanno nelle istruzioni e non cambiano il contesto. E
      arriva quando Anthropic risponde 400 (BadRequestError) al conteggio
      o alla chiamata della chat: la stessa conversazione darebbe sempre
      lo stesso 400; la prenotazione si chiude a zero. (4)
      IL MODELLO E GLI STRUMENTI. La chat usa il modello scelto per il tipo
      `chat` in `impostazioni/regia.ai_modelli` (ai.modelloPer,
      REQ-FLOTTA-092); istruzioni e definizioni degli strumenti (nome,
      descrizione, schema dell'ingresso) sono della regia. Le descrizioni
      degli strumenti di lettura dicono quante righe tornano, dai limiti;
      `leggi_fattura` non chiede il file. (5) I LIMITI stanno in
      `impostazioni/regia.limiti_chat`. Valori iniziali e tetti:
      `max_token_risposta` 4000 (al massimo 16000),
      `max_token_conversazione` 50000 (al massimo 200000),
      `max_strumenti_per_messaggio` 5 (al massimo 20), `righe` `{ giacenza:
      5, vendite: 20, cerca_prodotti: 15 }` (al massimo 100 ciascuna;
      TETTI_LIMITI_CHAT). In lettura (limitiChat), voce per voce, un valore
      che non è un intero positivo o supera il tetto vale il predefinito.
      Si salvano da una Function, gestisciLimitiChat: solo l'admin
      (permission-denied), e validaLimitiChat rifiuta una mappa vuota, una
      voce sconosciuta, un valore non intero, ≤ 0 o oltre il tetto
      (invalid-argument); si scrive solo quello che cambia, con merge. Nel
      backoffice, in «Vendita» accanto ai «Modelli AI» di REQ-FLOTTA-092,
      la sezione «Limiti della chat AI» ha sei campi numerici (Token della
      risposta, Token della conversazione, Strumenti per messaggio, Righe
      di Giacenza, Righe di Vendite, Righe di Cerca prodotti) col tetto come
      `max`; mostra il valore salvato o quello iniziale; uscendo da un
      campo cambiato chiama impostaLimitiChat di src/lib/db.js con quella
      voce sola, che passa dalla Function; un valore oltre il tetto o non
      positivo non si salva e la sezione dice il tetto («al massimo
      16.000»). (6) LA RISPOSTA OLTRE IL TETTO si tronca: 200 col testo
      arrivato, senza strumenti a metà (i `tool_use` di una risposta
      troncata escono dal turno e da `strumenti_richiesti`). I blocchi
      `text` vuoti escono dal turno prima della firma. LO SFORZO: chiamata e
      conteggio portano `output_config: { effort: 'low' }`, quello che
      Anthropic consiglia per una chat: allo sforzo predefinito di Sonnet
      5.5 («high») i token della risposta potevano finire tutti nel
      ragionamento. IL RIPIEGO A METÀ RISPOSTA: con un blocco `{ type:
      'fallback', from: { model }, to: { model } }` nel contenuto, prima
      dell'ultimo `fallback` restano solo i blocchi `text` (escono
      `thinking`, `redacted_thinking`, `tool_use` e ogni altro tipo), il
      `fallback` resta dov'è e dopo resta tutto, come vuole la
      documentazione del ripiego; il `testo` per l'app unisce i pezzi
      senza separatori. (7) LA
      CONVERSAZIONE TROPPO LUNGA. I token d'ingresso si contano prima di
      prenotare, col conteggio di REQ-FLOTTA-093 (`conta`, o
      client.messages.countTokens), sugli stessi parametri della chiamata:
      istruzioni, conversazione, strumenti. Una conversazione oltre 200
      messaggi o 2.000.000 di caratteri riceve lo stesso 409 prima del
      conteggio.
      Oltre `max_token_conversazione` la regia risponde 409 `{ codice:
      'troppo-lunga', errore }` senza prenotare né chiamare il modello, e
      l'app propone una conversazione nuova: tana-drink lo deve
      distinguere dal 409 `versione` (glielo chiede il coordinatore). Se
      il conteggio non risponde (errore, o un numero non valido) la chat
      risponde 503 `{ codice: 'servizio' }` «riprova tra poco», senza
      prenotare né chiamare il modello. (8) GLI STRUMENTI PER MESSAGGIO.
      Uno per turno del modello (`disable_parallel_tool_use`), contati
      dall'ultimo turno di chi scrive che ha un testo e NESSUN
      `tool_result` (un testo accanto agli esiti non riapre il conto): raggiunto
      `max_strumenti_per_messaggio` la chiamata va con `tool_choice: none`,
      e il modello risponde con quello che ha. Il conto regge perché i
      turni del modello sono firmati. (8b) LA CACHE DEL PROMPT. La
      chiamata della chat porta `cache_control: { type: 'ephemeral' }` (5
      minuti) sull'ultimo blocco delle istruzioni, che in cache coprono
      anche gli strumenti (vengono prima), e in cima alla richiesta, dove
      Anthropic lo mette sull'ultimo blocco della conversazione e lo sposta
      in avanti a ogni giro: il giro dopo rilegge la conversazione dalla
      cache. La conversazione non si tocca (resta quella firmata); al
      conteggio i segni non vanno. La stima della chat copre la SCRITTURA
      in cache, 1,25 volte l'ingresso, per ognuno dei due tentativi:
      stimaMassimaMicroeuro(m, { inputContati, scritturaCache: true }); le
      altre richieste non la chiedono e la loro stima non cambia. Il costo
      vero non supera la stima per ogni divisione dell'ingresso fra
      normale, scritto e letto dalla cache, e per ogni coppia di modelli.
      La riga dei consumi, per ogni tipo, tiene anche
      `token_cache_lettura` e `token_cache_scrittura`. (8c) I TEMPI. Ogni
      richiesta AI lascia nei log una riga «[ai] TEMPI» coi millisecondi
      del conteggio e della chiamata, i token contati e quelli letti e
      scritti in cache, mai il contenuto: sul test si misura quanto il
      conteggio allunga l'attesa. (9) IL CREDITO. La chat passa dalla
      stessa prenotazione delle altre richieste (REQ-FLOTTA-088: prenota,
      chiudiPrenotazione, al massimo due insieme, righe «interrotta»), con
      la stima di REQ-FLOTTA-093 (stimaMassimaMicroeuro(m, { inputContati
      }): ingresso contato col margine, TENTATIVI_MASSIMI tentativi) e
      `max_token_risposta` come `max_tokens`: 402 credito, tetto,
      spento, senza-cassetto e 429 occupato prima del modello. Prima del
      conteggio, per OGNI tipo (non solo la chat), una lettura del
      cassetto fuori dalla transazione (`leggiCassetto`,
      fermoPrimaDiContare): AI spenta, nessun cassetto, credito sotto il
      micro-euro o tetto raggiunto rispondono il 402 di sempre senza
      contare, perché il limite di countTokens è unico per tutta
      l'organizzazione; una lettura che fallisce lascia decidere la
      prenotazione. Il modello
      che non risponde è un 503 e la stima torna tutta; un rifiuto (422
      rifiuto) o una risposta vuota (422 vuota) costano. Uno sforamento
      segue la regola della 093: il credito non va mai sotto zero e
      l'importo mancante si segna in `sforato_microeuro`
      (chiudiPrenotazione). La chat non ricopia niente di questa logica:
      passa i suoi parametri, il tetto dell'ingresso e il modo di leggere la
      risposta a interrogaConPrenotazione, così le correzioni della 093
      valgono anche per lei. La riga dei consumi dice
      `tipo: 'chat'` e i numeri, mai il contenuto. Nemmeno i log: un errore
      di Anthropic, al conteggio o alla chiamata e per ogni tipo, si
      scrive col suo tipo e il suo stato (`invalid_request_error 400`),
      mai col messaggio, che può ripetere la conversazione; un errore di
      rete col suo nome. (10) LA RISPOSTA 200 è
      `{ ok, tipo: 'chat', turno, testo, strumenti_richiesti: [{ id, nome,
      input }], versione, limiti_strumenti: { giacenza, vendite,
      cerca_prodotti }, costo_eur, credito_eur }`. `limiti_strumenti` sono
      le righe che l'app applica agli strumenti di lettura: un campo in più
      rispetto al contratto di tana-drink, che l'app deve leggere (glielo
      chiede il coordinatore). (11) Il contratto in docs/handover.md §7,
      «Cassetto AI», dice la chat, la firma, i limiti, il 409 troppo-lunga
      e il 503 del conteggio, lo stesso giorno, e si scrive a tana-drink.
      PUNTI DEBOLI. Uno strumento per turno si tiene all'inizio: una
      domanda che vuole tre letture fa tre giri, ognuno con la
      conversazione intera; con la cache i giri dopo il primo la rileggono
      a un ventesimo del prezzo, ma la prenotazione resta quella del caso
      peggiore (tutto scritto in cache, due tentativi, al prezzo più alto):
      a ogni giro si tiene da parte molto più di quanto si spende, e un
      locale col credito basso può vedersi rifiutare un giro che costerebbe
      poco. Il conteggio aggiunge un viaggio prima di ogni giro, più lungo
      con la conversazione: lo dicono le righe «[ai] TEMPI». Sotto i 512
      token (istruzioni senza strumenti) Sonnet 5.5 non mette niente in
      cache, senza errori. Un turno firmato non scade: vale finché non
      cambia la versione. Finché tana-drink non distingue i due 409, la
      conversazione troppo lunga riparte col messaggio della versione, e
      finché non legge `limiti_strumenti` vale il suo LIMITI_RIGHE fisso.
      Le definizioni degli ingressi degli strumenti seguono il codice di
      tana-drink del 13/11/2026 (PannelloChat.jsx, strumentiChat.js): se
      l'app li cambia, cambia VERSIONE_CHAT.
      Dalla revisione della PR #237: un 400 di Anthropic su FATTURA e TEMA
      resta un 503 «non disponibile», e l'app riprova invano con lo stesso
      documento (solo la chat sa ripartire da capo). Un 409 versione dopo
      un 400 di Anthropic dice «conversazione nuova» anche quando la colpa
      è della regia (una forma della richiesta sbagliata): lo si vede solo
      dai log, dove resta tipo e stato. Ogni cambio delle righe
      dall'admin chiude le conversazioni aperte di tutti i locali. La
      lettura del cassetto prima del conteggio è una lettura in più per
      ogni richiesta. La catena dei messaggi precedenti vuole la
      conversazione in sola aggiunta: se l'app accorcia o ritocca un
      messaggio vecchio di chi scrive, il turno dopo è un 400 (lo
      vorrebbe comunque il ragionamento conservato di Anthropic). Togliere
      un testo vuoto dal turno prima di firmarlo cambia il turno rispetto
      a quello scritto dal modello: [da verificare] che il controllo di
      Anthropic sulla storia lo accetti accanto a un blocco di
      ragionamento. [da verificare] (rilievo 11 della revisione, non
      corretto per decisione del coordinatore): dopo un ripiego il
      conteggio e la stima contano i token del modello chiesto, mentre il
      ripiego risponde con un altro modello e può contarli diversamente.
      FATTO (13/11/2026, ramo feature/ai-chat): tutti i criteri, provati da
      tests/ai-chat.test.js (logica pura, il percorso intero con un modello
      e un cassetto finti, il collegamento in index.js, il contratto) e da
      tests/Backoffice.test.jsx (la sezione dei limiti). NON PROVATO con
      Anthropic vero: che countTokens accetti tools e tool_choice, e che il
      ripiego `fallbacks: 'default'` funzioni con gli strumenti e la cache,
      e che la cache legga davvero (si vede da `token_cache_lettura`).
      REVISIONE DELLA PR #237 (13/11/2026, ramo fix/ai-chat-revisione, issue
      #232): i rilievi 1-10 e 12 corretti, provati in tests/ai-chat.test.js
      nei blocchi «revisione #237, rilievo N» (un `conta` e una chiamata
      finti che lanciano un 400; limiti e strumenti cambiati a metà; il
      contenuto [thinking, text, fallback, text]; 8 strumenti col tetto a
      5 e un testo accanto agli esiti; lo sforzo nei parametri; l'ordine
      dei blocchi e i testi vuoti; 20.000 livelli; un turno spostato;
      l'andata e ritorno in JSON; il cassetto prima del conteggio, anche
      per la descrizione; i log). La forma del blocco `fallback` e la
      regola sui blocchi prima del confine vengono dalla documentazione
      di Anthropic sul ripiego; che count_tokens accetti `output_config`
      dal suo riferimento API. NON PROVATO con Anthropic vero: lo sforzo
      «low» con il ripiego e gli strumenti, e la risposta a un turno
      rimandato dopo un ripiego.
    status: implemented
