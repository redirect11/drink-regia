      edgesOut)»: si usa npx npm@11, il lockfile resta alla versione 3.
      LA COPERTURA: il v8 di vitest 4 conta le funzioni in modo diverso e
      src/lib scendeva a 96,6% di funzioni, sotto la soglia del 97%
