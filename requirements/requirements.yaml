  - id: REQ-DEV-002
    title: "Le Actions della regia: develop va sul test, il tag su main in produzione, con un progetto Firebase di test"
    area: ".github/workflows/test.yml, firebase-hosting.yml, deploy.yml, vitest.config.mjs, src/App.jsx (nastro TEST), scripts/abilita-api.mjs, scripts/abilita-accesso-email.mjs, scripts/segreti-environment.mjs, functions/.env.<progetto>, functions/piani.json"
    description: >
      Lo stesso modello di pubblicazione di tana-drink
      (docs/actions-come-tana-drink.md, l'utente, 22/10/2026: «replicare le
      action, il sito di test con il suo db per le prove e il workflow»).
      Un push su un ramo qualsiasi (tranne release/**) fa lint, test e
      build e basta; una pull request verso develop o main anche la
      coverage, con soglie per area in vitest.config.mjs che si alzano e
      non si abbassano. Dal 30/10/2026 (decisione dell'utente: «develop per
      test e main per produzione», «il rilascio in produzione solo tag sul
      main») un push su develop va sul test (drink-regia-test, environment
      `test`); in produzione (drink-regia, environment `production`) va
      solo un tag su un commit di main; un tag fuori da main non pubblica
      niente, il job «Dove va» si ferma e lo dice; il lancio a mano di
      «Deploy to Firebase» su un ramo va sul test. La regia di test lancia i
      workflow della flotta da develop (functions/.env.drink-regia-test,
      FLOTTA_REF), la produzione da main. Il
      deploy riusabile (deploy.yml) ha l'environment scritto a chiare
      lettere e la guardia: se VITE_FIREBASE_PROJECT_ID non coincide col
      progetto di destinazione si ferma. Il sito fuori dalla produzione
      porta un nastro «TEST» con la versione, e il pie' di pagina dice la
      versione pubblicata (VITE_APP_ENV, VITE_APP_VERSION dal deploy,
      package.json come ripiego). Le Functions leggono la configurazione
      per progetto da functions/.env.<progetto>. Gli script per un progetto
      nuovo (API, Auth email, segreti dell'environment) usano il token del
      Firebase CLI: niente gcloud, niente chiavi nel repository.
      Firebase carica solo la cartella functions/: le Functions non
      leggono file fuori da li', e il listino vive in functions/piani.json,
      letto da li' anche dal sito (il primo deploy sul test, 29/10/2026,
      non avviava nessuna Function: il listino stava nella radice, e una
      copia fatta dal predeploy non arrivava nel pacchetto).
      STATO AL 22/10/2026: codice e test fatti; il progetto
      drink-regia-test, i service account del deploy, l'environment `test`
      e i segreti si fanno col permesso dell'utente (docs/handover.md §5).
    status: implemented
    generate_issue: false
    labels: [metodo, regia]
    test_cases:
      - tests/ci.test.js
      - tests/App.test.jsx
  - id: REQ-DEV-003
    title: "Le issue nascono dal registro e la bacheca le segue, come in tana-drink"
    area: "scripts/generate-issues.mjs, scripts/lib-requisiti.mjs, scripts/bacheca.mjs, .github/workflows/generate-issues.yml"
    description: >
      «Va creato anche il project su GitHub per gestire le issue come per
      tana-drink» (l'utente, 22/10/2026). Script e workflow copiati da
      tana-drink: a ogni push che tocca requirements/requirements.yaml o
      requirements/bugs.yaml le voci con generate_issue: true diventano
      issue «[ID] titolo», idempotenti per identificativo; una voce finita
      porta la scheda su «Implemented» dai rami di lavoro, su «In test» da
      develop (etichetta in-test), e chiude l'issue da main; una voce
      scartata (deprecated, wontfix) chiude come «not planned». La bacheca
      e' il project GitHub «drink-regia» (n. 5 dell'account redirect11),
      creato il 22/10/2026 con le colonne di tana-drink (To triage,
      Backlog, Ready, Implemented, In test, Done) e i campi Priority,
      Severity, Size, collegato al repository. Le schede si muovono da sole
      solo col segreto PROJECT_TOKEN (token personale con scope project,
      lo mette l'utente); senza, le issue si aggiornano lo stesso.
    status: implemented
    generate_issue: false
    labels: [metodo, regia]
    test_cases:
      - tests/issue.test.js

  - id: REQ-FLOTTA-008
    title: "Un'istanza si ferma: Sospendi, Riattiva e Chiudi dal backoffice, e la sospensione automatica di chi non paga"
    area: "functions/index.js (impostaStatoIstanza, sospendiMorosi), functions/lib/sospensione.js, src/pages/Backoffice.jsx, src/lib/db.js"
    description: >
      «Serve un modo per eliminare/fermare l'app deployata (ad esempio se
      non arriva il pagamento mensile)» (l'utente, 22/10/2026). La parte
      della regia: lo stato della licenza dell'istanza
      (`settings/bar.licenza.stato`: attiva, sospesa, chiusa) lo scrive la
      Function `impostaStatoIstanza`, cross-progetto, a cui il backoffice
      arriva coi tasti Sospendi (con motivo), Chiudi e Riattiva; e la
      Function giornaliera `sospendiMorosi` sospende chi ha l'abbonamento
      «in sospeso» da piu' di sette giorni, chiude chi ha disdetto e
      riattiva chi e' tornato a pagare (logica pura in lib/sospensione.js).
      `istanze/{slug}` tiene `licenza_stato` e `licenza_motivo` per il
      backoffice. Cosa fa l'app quando e' sospesa sta nel repository
      tana-drink (REQ-FLOTTA-008 di la'): si ferma, lo dice, i dati restano.
      La cancellazione vera del progetto, dopo i 30 giorni promessi, la fa
      elimina-istanza.yml, e solo dopo il backup verificato (REQ-FLOTTA-014).
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/sospensione.test.js
      - tests/Backoffice.test.jsx

  - id: REQ-FLOTTA-009
    title: "Gli aggiornamenti dell'app arrivano ai locali che si decide: «Aggiorna» su un locale, i rilasci a ondate per tutti"
    area: "functions/index.js (aggiornaIstanza), functions/lib/provisioning.js (dispatchAggiornamento), src/pages/Backoffice.jsx, src/lib/db.js, functions/.env (APP_REF)"
    description: >
      «La versione dovrebbe seguire l'app di base, quindi mi aspetto che
      tutte le versioni delle app deployate dovrebbero essere allineate
      all'app base che per ora rimane tana-drink. Tutte le
      modifiche/bugfix/aggiornamenti sull'app base dovrebbero essere
      deployate anche su tutti i siti cliente o comunque decidere su quali
      clienti deployare gli aggiornamenti» (l'utente, 22/10/2026).
      LA VERSIONE E' QUELLA DI TANA-DRINK: ogni istanza mostra in
      `istanze/{slug}.versione` la versione dell'app che ha, riferita dal
      workflow a ogni pubblicazione. Un rilascio di tana-drink non tocca i
      locali da solo: dal backoffice, «Aggiorna» su una riga porta a quel
      locale la versione in APP_REF (in produzione `main`, l'ultimo
      uscito; sul test `develop`): serve per una
      correzione urgente su un locale solo. A tutti i locali un rilascio
      arriva a ondate (REQ-FLOTTA-012), che hanno preso il posto di
      «Aggiorna tutte le istanze attive» il 27/10/2026. La
      Function `aggiornaIstanza` (solo admin) lancia il workflow
      `aggiorna-istanza.yml` della regia, che compila per quel locale,
      pubblica e riferisce la versione. Un tag passato come `ref` riporta
      un locale a una versione precedente.
      «In produzione solo il tag su main» (l'utente, 30/10/2026): sulla
      regia di produzione i workflow accettano solo un rilascio (main o un
      tag vX.Y.Z) il cui commit sta su main di tana-drink, e si fermano
      prima di creare qualcosa se l'app non sa compilare per un cliente.
      Un ramo (develop) passa solo sulla regia di test.
    status: implemented
    generate_issue: false
    labels: [prodotto, flotta, regia]
    test_cases:
      - tests/provisioning.test.js
      - tests/Backoffice.test.jsx
      - tests/flotta.test.js

  - id: REQ-FLOTTA-010
    title: "I servizi premium si comprano e si cambiano dalla dashboard, e la licenza dell'istanza li accende"
    area: "functions/index.js (cambiaScelta, licenzaSegueIlPiano), functions/lib/licenza.js, functions/lib/abbonamento.js (customer.subscription.updated), src/pages/SceltaPiano.jsx (modifica), src/pages/Dashboard.jsx"
    description: >
      «Dobbiamo attivare il supporto per i servizi premium e l'acquisto dei
      servizi premium» (l'utente, 22/10/2026).
      Con l'abbonamento attivo la dashboard mostra «Cambia piano o moduli»:
      lo stesso selettore della prima scelta, col prezzo del mese che si
      aggiorna, e «Aggiorna il piano» al posto del Checkout. La Function
      `cambiaScelta` aggiorna la subscription di Stripe (righe nuove al
