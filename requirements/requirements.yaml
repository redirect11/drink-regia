  - id: REQ-FLOTTA-088
    title: "Il credito AI si prenota prima della chiamata: richieste parallele non spendono lo stesso credito, al massimo due richieste insieme per locale"
    area: "functions/lib/ai.js (prenota, chiudiPrenotazione, rigaInterrotta, interrogaConPrenotazione, stimaMassimaMicroeuro, rispostaCredito), functions/index.js (interrogaClaude, richiestaAI, temaDaMockup), src/lib/ai.js, docs/handover.md §7"
    description: >
      Audit di sicurezza della regia del 13/11/2026, Daniele: «questi
      andrebbero sistemati». interrogaClaude controllava il credito fuori
      transazione e addebitava dopo la risposta: N richieste in parallelo
      vedevano lo stesso credito e passavano tutte, e un locale solo poteva
      occupare richiestaAI (maxInstances 10 per tutta la flotta).
      CRITERI DI ACCETTAZIONE. (1) Prima della chiamata, in una
      transazione, si verifica e si prenota la stima massima: credito giù,
      speso del mese su, la richiesta segnata fra le prenotazioni del
      cassetto con un id e l'ora. Si rifiuta se il credito disponibile
      (già al netto delle prenotazioni) è ≤ 0 o sotto la stima, o se il
      mese sforerebbe il tetto. (2) La stima usa il prezzo più alto del
      listino: il fallback può rispondere con un modello più caro di quello
      chiesto. (3) Dopo la risposta, in transazione, si corregge con la
      differenza fra costo vero e stima e si toglie la prenotazione; la
      riga di consumo porta il costo vero. Se la chiamata fallisce senza
      costo (503) la stima torna tutta. (4) Al massimo 2 richieste AI
      insieme per locale: oltre, 429 { codice: 'occupato', errore: 'Troppe
      richieste AI insieme: riprova tra poco.' }. (5) Una prenotazione
      rimasta appesa oltre il timeout della Function (con un margine) non
      blocca il locale: non conta fra le contemporanee, e alla richiesta
      successiva si considera CONSUMATA alla stima (Anthropic potrebbe
      averla già fatturata), con una riga di consumo esito 'interrotta' e
      la stima come costo. (6) Anche il tema dal mockup passa dalla
      prenotazione e ha maxInstances e concorrenza basse; richiestaAI ha una
      concorrenza per istanza esplicita. (7) Nel credito chiesto
      dall'installazione (REQ-FLOTTA-085) `attivo` vuol dire che una
      descrizione può partire (la sua stima), non un micro-euro. (8) Il
      contratto in docs/handover.md §7 dice il 429 occupato.
      Dalla revisione del 13/11/2026: (9) quanto promette: il credito non
      scende sotto zero oltre la differenza fra costo vero e stima di al
      massimo MAX_CONTEMPORANEE (2) richieste (la stima dell'ingresso di un
      PDF va per byte, e uno scansionato può costare di più), e dopo una
      richiesta che lo porta sotto zero la successiva si rifiuta. Al cambio
      di mese il mese nuovo può sforare il tetto del costo vero di al
      massimo MAX_CONTEMPORANEE richieste (le richieste prenotate nel mese
      vecchio portano il loro costo nel nuovo; per un PDF può superare la
      stima): una scelta, scritta nel codice.
      (10) Niente addebito senza chiamata: il client del modello si crea
      prima della prenotazione (se non si crea, 503 e niente prenotato);
      una prenotazione che non si scrive è un 503 «riprova»; un costo che
      non si calcola vale la stima; una risposta che non si legge è un 422
      col suo costo. Se la transazione della prenotazione lancia (anche
      dopo aver scritto, con la conferma persa) la prenotazione si
      restituisce subito, a costo zero, prima del 503. Mai un 500 fuori
      contratto: l'orchestrazione sta in
      ai.interrogaConPrenotazione, provata con Firestore e modello finti.
      (11) Se la correzione dopo una risposta del modello non si scrive, il
      locale riceve comunque il risultato e paga una volta sola, la stima:
      la prenotazione resta, scade e si chiude come interrotta; la risposta
      dice la stima come costo. (12) Una voce di prenotazioni senza un'ora
      valida (o con un'ora più di un minuto nel futuro) si tratta come scaduta, nel mese
      corrente, senza lanciare: non blocca l'AI del locale. (13) ai.addebito,
      l'addebito dopo la risposta di prima, non c'è più. (14) Il contratto
      in docs/handover.md §7 dice che a posti pieni Cloud Run risponde 429
      senza corpo, diverso dal 429 occupato: l'app li tratta tutti e due
      come «riprova tra poco». (15) Una prenotazione vale una volta per id:
      se un nuovo tentativo della transazione (Firestore la ripete anche
      quando si perde solo la conferma del commit) trova il suo id già fra
      quelle in corso, prenota risponde ok senza scalare di nuovo la stima
      e senza contarla fra le contemporanee (revisione della PR #227).
    status: implemented
    generate_issue: true
    labels: [regia, ai, sicurezza]
    priority: P1
    test_cases:
      - tests/ai-prenotazione.test.js
      - tests/ai.test.js
      - tests/CreditoAI.test.jsx

