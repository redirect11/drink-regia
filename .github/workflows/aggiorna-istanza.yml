name: Aggiorna istanza

# UN AGGIORNAMENTO DELL'APP ARRIVA A UN LOCALE (REQ-FLOTTA-009, REQ-FLOTTA-012).
# L'app è tana-drink: ogni correzione o funzione nuova nasce lì ed esce con
# un tag; la regia la porta ai locali, un'ondata alla volta, con questo
# workflow. Lo lanciano la regia (backoffice: «Aggiorna», i rilasci a
# ondate, «Torna a») o una persona dalla pagina Actions:
#   1. prende la configurazione web del progetto dell'istanza;
#   2. scarica l'app al `ref` chiesto in app/, rigenera la cartella
#      clienti/<slug>/ (le impostazioni del locale, che vincono sulla build,
#      stanno nel suo database) e compila CLIENTE=<slug>;
#   3. pubblica regole, indici, Functions e hosting;
#   4. riferisce alla regia la versione pubblicata.
# Niente Terraform: il progetto esiste già.
#
# Sta nella regia dal 29/10/2026, come provisiona-istanza.yml: environment
# «flotta» o «flotta-test» secondo `ambiente`, input solo come variabili
# d'ambiente e controllati per primi (audit del 22/10/2026, C1).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Lo slug del locale'
        required: true
        type: string
      nome_locale:
        description: 'Il nome del locale (riserva per venue.json)'
        required: false
        type: string
        default: ''
      ref:
        description: 'La versione dell’app di tana-drink da pubblicare (un tag vX.Y.Z, o main)'
        required: false
        type: string
        default: main
      ambiente:
        description: 'Quale regia: produzione (environment flotta) o test (flotta-test)'
        required: false
        type: choice
        options: [produzione, test]
        default: produzione
      profilo:
        description: 'leggero (il piano Free: solo database e sito, costo zero) o completo (Functions, Storage, segreti)'
        required: false
        type: choice
        options: [completo, leggero]
        default: completo

permissions:
  contents: read

concurrency:
  group: istanza-${{ inputs.slug }}
  cancel-in-progress: false

env:
  SLUG: ${{ inputs.slug }}
  NOME: ${{ inputs.nome_locale || inputs.slug }}
  REF_APP: ${{ inputs.ref }}
  AMBIENTE: ${{ inputs.ambiente }}
  PROFILO: ${{ inputs.profilo }}
  PROGETTO: drinkpos-${{ inputs.slug }}
  # I segreti che le Functions dell'app di tana-drink dichiarano
  # (defineSecret): contratto con tana-drink, docs/handover.md §7.
  SEGRETI_APP: SUMUP_API_KEY

jobs:
  aggiorna:
    name: Aggiorna ${{ inputs.slug }} a ${{ inputs.ref }} (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente == 'test' && 'flotta-test' || 'flotta' }}
    steps:
      - name: Input validi
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::Slug non valido."; exit 1; }
          [[ "$REF_APP" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::ref non valido."; exit 1; }
          [[ "$AMBIENTE" =~ ^(produzione|test)$ ]] || { echo "::error::ambiente non valido."; exit 1; }
          [[ "$PROFILO" =~ ^(completo|leggero)$ ]] || { echo "::error::profilo non valido."; exit 1; }
          if [ ${#NOME} -gt 80 ] || [[ "$NOME" =~ [[:cntrl:]] ]]; then echo "::error::Nome del locale non valido."; exit 1; fi

      # APP DI PRODUZIONE (REQ-FLOTTA-009): un locale riceve solo rilasci —
      # `main` o un tag `vX.Y.Z` — e la build è di produzione. Un ramo di
      # lavoro passa solo con un avviso: serve finché la flotta non è merged.
      - name: È un rilascio?
        run: |
          if [ "$REF_APP" = "main" ] || [[ "$REF_APP" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rilascio: $REF_APP"
          else
            echo "::warning::«$REF_APP» non è un rilascio (main o tag vX.Y.Z): va bene solo per provare."
          fi

      # La regia: lo script dei segreti dell'app.
      - uses: actions/checkout@v4

      # L'app dei locali, alla versione chiesta. tana-drink è pubblico.
      - uses: actions/checkout@v4
        with:
          repository: redirect11/tana-drink
          ref: ${{ inputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            app/package-lock.json
            app/functions/package-lock.json

      - name: Credenziali di provisioning
        env:
          SA_JSON: ${{ secrets.PROVISIONING_SA_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::Manca il segreto PROVISIONING_SA_JSON (infra/README.md)."; exit 1; fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Dipendenze
        run: |
          npm ci --prefix functions
          npm ci --prefix app
          npm ci --prefix app/functions

      # Una versione nuova dell'app può dichiarare un segreto in più: si crea
      # col segnaposto prima del deploy (scripts/segreti-istanza.mjs).
      # Un locale Free che compra passa qui al profilo completo: il suo
      # Storage nasce adesso (REQ-FLOTTA-015). Se c'è già non fa niente.
      - name: Lo Storage del locale
        if: env.PROFILO == 'completo'
        run: node scripts/storage-istanza.mjs --project "$PROGETTO"

      - name: I segreti dell'app
        if: env.PROFILO == 'completo'
        run: node scripts/segreti-istanza.mjs --project "$PROGETTO" --segreti "$SEGRETI_APP"

      - name: La configurazione web dell'istanza
        working-directory: app
        run: |
          npx firebase-tools apps:sdkconfig web --project "$PROGETTO" --json > "$RUNNER_TEMP/sdk.json"
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const c = j.result?.sdkConfig || j.result || j;
            if (!c.projectId) { console.error("Config non trovata."); process.exit(1); }
            const righe = [["VITE_FIREBASE_API_KEY", c.apiKey], ["VITE_FIREBASE_AUTH_DOMAIN", c.authDomain], ["VITE_FIREBASE_PROJECT_ID", c.projectId], ["VITE_FIREBASE_STORAGE_BUCKET", c.storageBucket || ""], ["VITE_FIREBASE_MESSAGING_SENDER_ID", c.messagingSenderId || ""], ["VITE_FIREBASE_APP_ID", c.appId]];
            require("fs").writeFileSync(process.argv[2], righe.map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
          ' "$RUNNER_TEMP/sdk.json" "$GITHUB_WORKSPACE/app/.env"

      - name: La cartella del cliente
        working-directory: app
        run: node scripts/genera-cliente.mjs --slug "$SLUG" --nome "$NOME"

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /
          CLIENTE: ${{ inputs.slug }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Functions .env del progetto
        run: printf 'VENUE_NAME=%s\n' "$NOME" > "app/functions/.env.$PROGETTO"

      - name: Deploy regole, indici, Functions e hosting
        working-directory: app
        # Al primo deploy delle Functions di un progetto nuovo, i permessi
        # degli agenti di Google arrivano qualche minuto dopo («Retry the
        # deployment in a few minutes», prova-bar, 29/10/2026): si riprova
        # due volte, a 90 secondi. Il deploy si può ripetere senza danni.
        run: |
          # Il profilo leggero (il Free, REQ-FLOTTA-015) pubblica solo regole e
          # sito: niente Functions né Storage, che sono quello che costa.
          if [ "$PROFILO" = "leggero" ]; then SOLO=firestore,hosting; else SOLO=firestore,storage,functions,hosting; fi
          for tentativo in 1 2 3; do
            if npx firebase-tools deploy --only "$SOLO" --project "$PROGETTO" --force; then exit 0; fi
            if [ "$tentativo" = 3 ]; then exit 1; fi
            echo "::warning::Deploy non riuscito al tentativo $tentativo: riprovo fra 90 secondi."
            sleep 90
          done

      - name: Versione pubblicata
        run: echo "VERSIONE=v$(node -p "require('./app/package.json').version")" >> "$GITHUB_ENV"

      - name: Esito alla regia
        if: always()
        env:
          CALLBACK_URL: ${{ vars.REGIA_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.PROVISIONING_CALLBACK_SECRET }}
          ESITO_JOB: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$CALLBACK_URL" ]; then echo "Nessuna REGIA_CALLBACK_URL: esito non inviato."; exit 0; fi
          if [ "$ESITO_JOB" = "success" ]; then STATO=attiva; ERR=""; else STATO=errore; ERR="Aggiornamento $ESITO_JOB: GitHub Actions run $RUN_ID"; fi
          node -e '
            const [url, secret, slug, stato, progetto, versione, errore] = process.argv.slice(1);
            fetch(url, { method: "POST", headers: { Authorization: `Bearer ${secret}`, "Content-Type": "application/json" },
              body: JSON.stringify({ slug, stato, progetto, versione: versione || null, errore: errore || null,
                ambiente: "produzione", operazione: "aggiornamento", profilo: process.env.PROFILO || null, ref: process.env.REF_APP || null }) })
              .then((r) => { console.log("regia:", r.status); if (r.status >= 300) process.exit(1); })
          ' "$CALLBACK_URL" "$CALLBACK_SECRET" "$SLUG" "$STATO" "$PROGETTO" "${VERSIONE:-}" "$ERR"

      - name: Pulizia credenziali
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sdk.json" "$GITHUB_WORKSPACE/app/.env"
