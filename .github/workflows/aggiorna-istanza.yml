name: Aggiorna istanza

# UN AGGIORNAMENTO DELL'APP ARRIVA A UN LOCALE (REQ-FLOTTA-009, REQ-FLOTTA-012).
# L'app è tana-drink: ogni correzione o funzione nuova nasce lì ed esce con
# un tag; la regia la porta ai locali, un'ondata alla volta, con questo
# workflow. Lo lanciano la regia (backoffice: «Aggiorna», i rilasci a
# ondate, «Torna a») o una persona dalla pagina Actions:
#   1. prende la configurazione web del progetto dell'istanza;
#   2. scarica l'app al `ref` chiesto in app/, rigenera la cartella
#      clienti/<slug>/ (le impostazioni del locale, che vincono sulla build,
#      stanno nel suo database) e compila CLIENTE=<slug>;
#   3. pubblica regole, indici, Functions e hosting;
#   4. riferisce alla regia la versione pubblicata.
# Il Terraform gira solo per un locale Free che passa al profilo completo:
# il suo progetto riceve le API e gli agenti delle Functions (REQ-FLOTTA-015).
# Per tutti gli altri il progetto esiste già com'è.
#
# Sta nella regia dal 29/10/2026, come provisiona-istanza.yml: environment
# «flotta» o «flotta-test» secondo `ambiente`, input solo come variabili
# d'ambiente e controllati per primi (audit del 22/10/2026, C1).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Lo slug del locale'
        required: true
        type: string
      nome_locale:
        description: 'Il nome del locale (riserva per venue.json)'
        required: false
        type: string
        default: ''
      ref:
        description: 'La versione dell’app di tana-drink da pubblicare (un tag vX.Y.Z, o main)'
        required: false
        type: string
        default: main
      ambiente:
        description: 'Quale regia: produzione (environment flotta) o test (flotta-test)'
        required: false
        type: choice
        options: [produzione, test]
        default: produzione
      profilo:
        description: 'leggero (il piano Free: solo database e sito, costo zero) o completo (Functions, Storage, segreti)'
        required: false
        type: choice
        options: [completo, leggero]
        default: completo
      # Un locale esistente aggiornato dalla regia, come la Tana
      # (REQ-FLOTTA-018): il suo progetto, la sua cartella in clienti/ e
      # le chiavi pubbliche della build. Vuoti per i locali della flotta.
      email:
        description: 'L’email del titolare: diventa l’admin del locale (REQ-FLOTTA-029)'
        required: false
        type: string
        default: ''
      # L'uid del titolare nella regia (clienti/{uid}): l'account nel locale
      # ha lo stesso (M7). Facoltativo: senza, il passo lavora per email.
      uid:
        description: 'Il titolare nella regia (clienti/{uid}): lo stesso uid nel locale'
        required: false
        type: string
        default: ''
      progetto:
        description: 'Il progetto Firebase, se non è drinkpos-<slug> (un locale esistente)'
        required: false
        type: string
        default: ''
      cliente:
        description: 'La cartella in clienti/ di tana-drink, se non è lo slug'
        required: false
        type: string
        default: ''
      build:
        description: 'Le chiavi pubbliche della build, in JSON (VAPID, reCAPTCHA, Analytics)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: istanza-${{ inputs.slug }}
  cancel-in-progress: false

env:
  SLUG: ${{ inputs.slug }}
  NOME: ${{ inputs.nome_locale || inputs.slug }}
  REF_APP: ${{ inputs.ref }}
  AMBIENTE: ${{ inputs.ambiente }}
  # La demo (REQ-FLOTTA-019) è sempre leggera: niente Functions, Storage,
  # segreti né Terraform, qualunque profilo abbia l'istanza.
  PROFILO: ${{ inputs.progetto == 'drinkpos-demo' && 'leggero' || inputs.profilo }}
  DEMO: ${{ inputs.progetto == 'drinkpos-demo' }}
  PROGETTO: ${{ inputs.progetto || format('drinkpos-{0}', inputs.slug) }}
  CLIENTE_APP: ${{ inputs.cliente || inputs.slug }}
  BUILD_PUBBLICA: ${{ inputs.build }}
  EMAIL_TITOLARE: ${{ inputs.email }}
  UID_TITOLARE: ${{ inputs.uid }}
  ESISTENTE: ${{ inputs.progetto != '' }}
  # I segreti che le Functions dell'app di tana-drink dichiarano
  # (defineSecret): contratto con tana-drink, docs/handover.md §7.
  SEGRETI_APP: SUMUP_API_KEY

jobs:
  aggiorna:
    name: Aggiorna ${{ inputs.slug }} a ${{ inputs.ref }} (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente == 'test' && 'flotta-test' || 'flotta' }}
    steps:
      - name: Input validi
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::Slug non valido."; exit 1; }
          [[ "$REF_APP" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::ref non valido."; exit 1; }
          [[ "$AMBIENTE" =~ ^(produzione|test)$ ]] || { echo "::error::ambiente non valido."; exit 1; }
          [[ "$PROFILO" =~ ^(completo|leggero)$ ]] || { echo "::error::profilo non valido."; exit 1; }
          # L'email del titolare (REQ-FLOTTA-029): vuota, o un'email.
          [[ -z "$EMAIL_TITOLARE" || "$EMAIL_TITOLARE" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]{2,}$ ]] || { echo "::error::Email del titolare non valida."; exit 1; }
          [[ "$UID_TITOLARE" =~ ^[A-Za-z0-9]{0,128}$ ]] || { echo "::error::uid non valido."; exit 1; }
          if [ ${#NOME} -gt 80 ] || [[ "$NOME" =~ [[:cntrl:]] ]]; then echo "::error::Nome del locale non valido."; exit 1; fi
          [[ "$PROGETTO" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::progetto non valido."; exit 1; }
          # I progetti della regia non sono mai un locale (functions/lib/esistente.js).
          if [ "$PROGETTO" = "drink-regia" ] || [ "$PROGETTO" = "drink-regia-test" ]; then echo "::error::$PROGETTO è un progetto della regia."; exit 1; fi
          [[ "$CLIENTE_APP" =~ ^[a-z][a-z0-9-]{1,29}$ ]] || { echo "::error::cartella del cliente non valida."; exit 1; }
          # La demo (REQ-FLOTTA-019): la sua build va solo sul suo progetto, e
          # il suo progetto riceve solo la sua build. Un locale vero con la
          # build della demo mostrerebbe dati finti; la demo con una build
          # vera scriverebbe in un database pubblico.
          if [ "$PROGETTO" = "drinkpos-demo" ] && [ "$CLIENTE_APP" != "demo" ]; then echo "::error::drinkpos-demo riceve solo la build della demo (cartella demo)."; exit 1; fi
          if [ "$CLIENTE_APP" = "demo" ] && [ "$PROGETTO" != "drinkpos-demo" ]; then echo "::error::La build della demo va solo su drinkpos-demo."; exit 1; fi
          # Solo le chiavi pubbliche previste, con valori semplici: arrivano
          # nel .env della build, e non devono poterci scrivere altro.
          node -e '
            const t = process.env.BUILD_PUBBLICA || "";
            if (!t) process.exit(0);
            let j; try { j = JSON.parse(t) } catch { console.error("::error::build non è JSON."); process.exit(1) }
            const ok = ["VITE_FIREBASE_MEASUREMENT_ID", "VITE_FIREBASE_VAPID_KEY", "VITE_RECAPTCHA_SITE_KEY"];
            if (!j || typeof j !== "object" || Array.isArray(j)) { console.error("::error::build non è un oggetto."); process.exit(1) }
            for (const [k, v] of Object.entries(j)) if (!ok.includes(k) || !/^[A-Za-z0-9_-]{1,200}$/.test(String(v))) { console.error("::error::chiave della build non valida: " + k); process.exit(1) }
          '

      # APP DI PRODUZIONE (REQ-FLOTTA-009): un locale della regia di
      # produzione riceve solo rilasci — `main` o un tag `vX.Y.Z` — e la
      # build è di produzione. Un ramo di lavoro (`develop`) passa solo
      # sulla regia di test, con un avviso. «In produzione solo il tag su
      # main» (l'utente, 30/10/2026).
      - name: È un rilascio?
        run: |
          if [ "$REF_APP" = "main" ] || [[ "$REF_APP" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rilascio: $REF_APP"
          elif [ "$AMBIENTE" = "test" ]; then
            echo "::warning::«$REF_APP» non è un rilascio (main o tag vX.Y.Z): va bene solo sulla regia di test."
          else
            echo "::error::«$REF_APP» non è un rilascio (main o tag vX.Y.Z): in produzione un locale riceve solo rilasci."
            exit 1
          fi

      # La regia: lo script dei segreti dell'app.
      - uses: actions/checkout@v4

      # L'app dei locali, alla versione chiesta. tana-drink è pubblico.
      # Con tutta la storia: serve a sapere se la versione sta su main.
      - uses: actions/checkout@v4
        with:
          repository: redirect11/tana-drink
          ref: ${{ inputs.ref }}
          path: app
          fetch-depth: 0

      # Un tag vX.Y.Z di tana-drink nasce su develop e pubblica il test
      # della Tana; diventa produzione quando il suo commit arriva su main
      # (tana-drink, docs/gitflow.md). Una regia di produzione pubblica
      # solo quello che è già su main. E l'app deve saper compilare per un
      # cliente, cosa che la 1.9.x non sa: meglio fermarsi qui che dopo
      # aver creato il progetto.
      - name: La versione dell'app va bene per questa regia?
        working-directory: app
        run: |
          if [ ! -f scripts/genera-cliente.mjs ]; then
            echo "::error::«$REF_APP» di tana-drink non sa compilare per un cliente (manca scripts/genera-cliente.mjs): serve la 1.10 o una successiva."
            exit 1
          fi
          if [ "$AMBIENTE" = "produzione" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::«$REF_APP» non è ancora su main di tana-drink: in produzione va solo quello che è uscito in produzione."
              exit 1
            fi
          fi
          # Il ramo che l'app mostra accanto alla versione (vite.config.js di
          # tana-drink lo prende da GIT_BRANCH, come fa il deploy della Tana):
          # col checkout di un tag git non lo sa da sé.
          git fetch --no-tags -q origin +refs/heads/main:refs/remotes/origin/main +refs/heads/develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor HEAD origin/main; then RAMO=main
          elif git merge-base --is-ancestor HEAD origin/develop; then RAMO=develop
          else RAMO="$REF_APP"; fi
          echo "GIT_BRANCH=$RAMO" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            app/package-lock.json
            app/functions/package-lock.json

      - name: Credenziali di provisioning
        env:
          SA_JSON: ${{ secrets.PROVISIONING_SA_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::Manca il segreto PROVISIONING_SA_JSON (infra/README.md)."; exit 1; fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROVISIONING_SA_EMAIL=$(node -e "console.log(JSON.parse(process.argv[1]).client_email)" "$SA_JSON")" >> "$GITHUB_ENV"

      # DA LEGGERO A COMPLETO (REQ-FLOTTA-015). Un locale Free nasce senza le
      # API delle Functions: quando compra, l'apply col profilo completo le
      # accende e crea gli agenti di Google, prima di Storage, segreti e
      # deploy. Si riconosce dallo stato: un progetto della regia senza
      # l'API delle Functions. Un progetto senza stato (un locale esistente,
      # come la Tana) non lo ha creato la regia e non si tocca.
      - uses: hashicorp/setup-terraform@v3
        if: env.PROFILO == 'completo'
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # Un locale esistente non ha stato Terraform e non ne avrà: il suo
      # progetto l'ha fatto chi lo gestiva prima (REQ-FLOTTA-018).
      - name: Il profilo completo nel progetto
        if: env.PROFILO == 'completo' && env.ESISTENTE != 'true'
        working-directory: infra/istanza
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          TF_VAR_slug: ${{ inputs.slug }}
          TF_VAR_ambiente: ${{ inputs.ambiente }}
          TF_VAR_billing_account: ${{ secrets.BILLING_ACCOUNT_ID }}
          TF_VAR_org_id: ${{ vars.ORG_ID }}
          TF_VAR_regia_sa_email: ${{ vars.REGIA_SA_EMAIL }}
          TF_VAR_provisioning_sa_email: ${{ env.PROVISIONING_SA_EMAIL }}
          TF_VAR_profilo: completo
        run: |
          if [ -z "$TFSTATE_BUCKET" ]; then echo "::error::Manca la variabile TFSTATE_BUCKET nell'environment (infra/README.md)."; exit 1; fi
          terraform init -input=false \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="prefix=istanze/$SLUG"
          if ! terraform state show google_project.istanza >/dev/null 2>&1; then
            echo "Nessuno stato Terraform per $SLUG: il progetto non l'ha creato la regia, non si tocca."; exit 0
          fi
          if terraform state list | grep -qF 'google_project_service.api["cloudfunctions.googleapis.com"]'; then
            echo "Il progetto è già completo."; exit 0
          fi
          terraform apply -input=false -auto-approve

      - name: Dipendenze
        run: |
          npm ci --prefix functions
          npm ci --prefix app
          npm ci --prefix app/functions

      # Una versione nuova dell'app può dichiarare un segreto in più: si crea
      # col segnaposto prima del deploy (scripts/segreti-istanza.mjs).
      # Un locale Free che compra passa qui al profilo completo: il suo
      # Storage nasce adesso (REQ-FLOTTA-015). Se c'è già non fa niente.
      - name: Lo Storage del locale
        if: env.PROFILO == 'completo'
        run: node scripts/storage-istanza.mjs --project "$PROGETTO"

      - name: I segreti dell'app
        if: env.PROFILO == 'completo'
        run: node scripts/segreti-istanza.mjs --project "$PROGETTO" --segreti "$SEGRETI_APP"

      # LA WEB APP DEL SITO, non «una» web app: con più app web nel progetto
      # `apps:sdkconfig` senza id si ferma (drinkpos-prova-free, 30/10/2026:
      # una app creata a mano accanto a quella di Terraform). Il sito sa la
      # sua (Terraform la collega con app_id); se non la dice, si va senza id.
      #
      # LA DEMO NON PORTA LA CONFIGURAZIONE VERA (REQ-FLOTTA-019, revisione
      # di sicurezza del 02/11/2026, M2): un progetto finto (gli id «demo-»
      # non sono mai progetti veri) e una chiave finta. Se un giorno l'app
      # riaccendesse la rete per sbaglio, non troverebbe nessun database.
      # Il deploy sa comunque dove andare: --project.
      - name: La configurazione finta della demo
        if: env.DEMO == 'true'
        run: |
          for riga in VITE_FIREBASE_API_KEY=demo VITE_FIREBASE_AUTH_DOMAIN=demo-drinkpos.firebaseapp.com VITE_FIREBASE_PROJECT_ID=demo-drinkpos VITE_FIREBASE_STORAGE_BUCKET= VITE_FIREBASE_MESSAGING_SENDER_ID= VITE_FIREBASE_APP_ID=1:0:web:demo VITE_FIREBASE_MEASUREMENT_ID=; do echo "$riga"; done > "$GITHUB_WORKSPACE/app/.env"

      - name: La configurazione web dell'istanza
        if: env.DEMO != 'true'
        working-directory: app
        run: |
          APP_ID=$(npx firebase-tools hosting:sites:get "$PROGETTO" --project "$PROGETTO" --json | node -e 'try { console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).result?.appId || "") } catch { console.log("") }')
          echo "Web app del sito: ${APP_ID:-non indicata}"
          npx firebase-tools apps:sdkconfig web $APP_ID --project "$PROGETTO" --json > "$RUNNER_TEMP/sdk.json" || { cat "$RUNNER_TEMP/sdk.json"; exit 1; }
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const c = j.result?.sdkConfig || j.result || j;
            if (!c.projectId) { console.error("Config non trovata."); process.exit(1); }
            const righe = [["VITE_FIREBASE_API_KEY", c.apiKey], ["VITE_FIREBASE_AUTH_DOMAIN", c.authDomain], ["VITE_FIREBASE_PROJECT_ID", c.projectId], ["VITE_FIREBASE_STORAGE_BUCKET", c.storageBucket || ""], ["VITE_FIREBASE_MESSAGING_SENDER_ID", c.messagingSenderId || ""], ["VITE_FIREBASE_APP_ID", c.appId], ["VITE_FIREBASE_MEASUREMENT_ID", c.measurementId || ""]];
            // Le chiavi pubbliche che il progetto non dice (REQ-FLOTTA-018),
            // già controllate in «Input validi»: vincono su quelle di sopra.
            const build = process.env.BUILD_PUBBLICA ? JSON.parse(process.env.BUILD_PUBBLICA) : {};
            const tutte = Object.entries({ ...Object.fromEntries(righe), ...build });
            require("fs").writeFileSync(process.argv[2], tutte.map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
          ' "$RUNNER_TEMP/sdk.json" "$GITHUB_WORKSPACE/app/.env"

      # La cartella c'è già per un cliente curato a mano (clienti/tana,
      # clienti/demo): allora non si chiama genera-cliente.mjs, che controlla
      # lo slug prima di guardare se la cartella esiste e con «tana» o
      # «demo», più corti di sei lettere, si fermava (revisione di
      # sicurezza del 02/11/2026, A2: la demo non si ripubblicava più).
      - name: La cartella del cliente
        working-directory: app
        run: |
          if [ -f "clienti/$CLIENTE_APP/venue.json" ]; then echo "clienti/$CLIENTE_APP c'è già: non la tocco."; exit 0; fi
          node scripts/genera-cliente.mjs --slug "$CLIENTE_APP" --nome "$NOME"

      # LA DEMO SI RICONOSCE DAL SEGNO, NON DAL NOME (B5): è `"demo": true`
      # nel venue.json a fare la build della demo. Una seconda cartella con
      # quel segno passerebbe i controlli sul nome in «Input validi».
      - name: La demo solo dove va
        working-directory: app
        run: |
          SEGNO=$(node -p "require('./clienti/' + process.env.CLIENTE_APP + '/venue.json').demo === true")
          if [ "$SEGNO" = "true" ] && [ "$DEMO" != "true" ]; then echo "::error::clienti/$CLIENTE_APP è una demo: va solo su drinkpos-demo."; exit 1; fi
          if [ "$DEMO" = "true" ] && [ "$SEGNO" != "true" ]; then echo "::error::drinkpos-demo riceve solo una cartella con \"demo\": true."; exit 1; fi

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /
          CLIENTE: ${{ inputs.cliente || inputs.slug }}
          VITE_APP_ENV: production
          # L'app sa di essere leggera anche prima di leggere la licenza
          # (tana-drink, REQ-LIC-004): niente Functions, Storage, SumUp.
          VITE_PROFILO: ${{ env.PROFILO }}
          # A quale regia si presenta l'app al primo avvio (REQ-FLOTTA-026).
          # La demo a nessuna (M1): senza, l'app non chiama la regia, e i
          # visitatori non mandano a nessuno il loro indirizzo.
          # (Al rovescio: in un'espressione di GitHub «cond && '' || x» dà sempre x.)
          VITE_REGIA_PROGETTO: ${{ inputs.progetto != 'drinkpos-demo' && (inputs.ambiente == 'test' && 'drink-regia-test' || 'drink-regia') || '' }}
        run: npm run build

      # IL PACCHETTO GIUSTO (B5). Quello di un locale non deve contenere la
      # demo (lo script è di tana-drink, che lo usa nella sua CI sulla
      # Tana); quello della demo deve esserlo davvero, e non portare il
      # progetto vero.
      - name: Il pacchetto giusto
        working-directory: app
        run: |
          if [ "$DEMO" = "true" ]; then
            grep -rqF 'drink:demo-sessione' dist || { echo "::error::La build per drinkpos-demo non è la demo."; exit 1; }
            # Vite scrive le variabili come VITE_FIREBASE_PROJECT_ID:"…": il
            # nome del progetto fra virgolette c'è solo con la config vera.
            if grep -rqF '"drinkpos-demo"' dist; then echo "::error::La build della demo porta la configurazione vera di drinkpos-demo."; exit 1; fi
          elif [ -f scripts/controlla-build-senza-demo.mjs ]; then
            node scripts/controlla-build-senza-demo.mjs dist
          fi

      # Se tana-drink ha già il .env di quel progetto (la Tana: nome del
      # locale e app id di SumUp) vale quello: riscriverlo col solo nome
      # fermerebbe SumUp.
      - name: Functions .env del progetto
        run: |
          if [ -f "app/functions/.env.$PROGETTO" ]; then echo "app/functions/.env.$PROGETTO c'è già: non lo tocco."; exit 0; fi
          printf 'VENUE_NAME=%s\n' "$NOME" > "app/functions/.env.$PROGETTO"

      # LA DEMO (REQ-FLOTTA-019): il database chiuso a tutti, al posto delle
      # regole dell'app. Nella build della demo i dati sono di prova e quello
      # che fa chi prova resta nel suo browser
      # (docs/modalita-demo.md di tana-drink): se l'app sbagliasse, il server
      # direbbe comunque di no.
      #
      # E le sue intestazioni (B1): la CSP con connect-src 'self' fa dire di
      # no al browser stesso a qualunque richiesta verso altri indirizzi.
      - name: Le regole della demo
        if: env.DEMO == 'true'
        run: |
          cp infra/demo/firestore.rules app/firestore.rules
          cp infra/demo/storage.rules app/storage.rules
          node -e '
            const fs = require("fs");
            const f = "app/firebase.json";
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            const { headers } = JSON.parse(fs.readFileSync("infra/demo/intestazioni.json", "utf8"));
            j.hosting.headers = [...(j.hosting.headers || []), { source: "**", headers }];
            fs.writeFileSync(f, JSON.stringify(j, null, 2));
          '

      # Lo Storage della demo, chiuso (M4): il bucket dei tempi dell'app vera
      # ha ancora le sue regole. Il profilo leggero non pubblica Storage,
      # quindi qui a parte. Un progetto senza bucket lo dice e si va avanti.
      - name: Lo Storage della demo chiuso
        if: env.DEMO == 'true'
        working-directory: app
        run: |
          if npx firebase-tools deploy --only storage --project "$PROGETTO" --force 2>&1 | tee "$RUNNER_TEMP/storage.log"; then exit 0; fi
          if grep -qiE "storage has not been set up|get started" "$RUNNER_TEMP/storage.log"; then echo "::warning::drinkpos-demo non ha Storage: niente da chiudere."; exit 0; fi
          exit 1

      - name: Deploy regole, indici, Functions e hosting
        working-directory: app
        # Al primo deploy delle Functions di un progetto nuovo, i permessi
        # degli agenti di Google arrivano qualche minuto dopo («Retry the
        # deployment in a few minutes», prova-bar, 29/10/2026): si riprova
        # due volte, a 90 secondi. Il deploy si può ripetere senza danni.
        run: |
          # Il profilo leggero (il Free, REQ-FLOTTA-015) pubblica solo regole e
          # sito: niente Functions né Storage, che sono quello che costa.
          if [ "$PROFILO" = "leggero" ]; then SOLO=firestore,hosting; else SOLO=firestore,storage,functions,hosting; fi
          for tentativo in 1 2 3; do
            if npx firebase-tools deploy --only "$SOLO" --project "$PROGETTO" --force; then exit 0; fi
            if [ "$tentativo" = 3 ]; then exit 1; fi
            echo "::warning::Deploy non riuscito al tentativo $tentativo: riprovo fra 90 secondi."
            sleep 90
          done

      # IL TITOLARE, ADMIN DEL SUO LOCALE (REQ-FLOTTA-029, l'utente il
      # 02/11/2026: «quando viene deployato qualcosa, bisogna sempre
      # aggiungere come utente admin chi ha richiesto la sottoscrizione»).
      # L'account c'è, è admin, e finché non ha una password gli arriva
      # l'email per impostarla. Si può ripetere senza danni. Con lo stesso
      # uid della regia (M7): un locale nato prima ha il suo segnaposto
      # ricreato con l'uid giusto, se nessuno l'ha mai usato.
      - name: Il titolare, admin del suo locale
        if: env.EMAIL_TITOLARE != '' && env.ESISTENTE != 'true'
        run: node scripts/titolare-istanza.mjs --project "$PROGETTO" --uid "$UID_TITOLARE" --email "$EMAIL_TITOLARE" --env app/.env --sito "https://$PROGETTO.web.app"

      - name: Versione pubblicata
        run: echo "VERSIONE=v$(node -p "require('./app/package.json').version")" >> "$GITHUB_ENV"

      - name: Esito alla regia
        if: always()
        env:
          CALLBACK_URL: ${{ vars.REGIA_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.PROVISIONING_CALLBACK_SECRET }}
          ESITO_JOB: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$CALLBACK_URL" ]; then echo "Nessuna REGIA_CALLBACK_URL: esito non inviato."; exit 0; fi
          if [ "$ESITO_JOB" = "success" ]; then STATO=attiva; ERR=""; else STATO=errore; ERR="Aggiornamento $ESITO_JOB: GitHub Actions run $RUN_ID"; fi
          node -e '
            const [url, secret, slug, stato, progetto, versione, errore] = process.argv.slice(1);
            fetch(url, { method: "POST", headers: { Authorization: `Bearer ${secret}`, "Content-Type": "application/json" },
              body: JSON.stringify({ slug, stato, progetto, versione: versione || null, errore: errore || null,
                ambiente: "produzione", operazione: "aggiornamento", profilo: process.env.PROFILO || null, ref: process.env.REF_APP || null,
                run_id: Number(process.env.RUN_ID), inviato_il: new Date().toISOString() }) })
              .then((r) => { console.log("regia:", r.status); if (r.status >= 300) process.exit(1); })
          ' "$CALLBACK_URL" "$CALLBACK_SECRET" "$SLUG" "$STATO" "$PROGETTO" "${VERSIONE:-}" "$ERR"

      - name: Pulizia credenziali
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sdk.json" "$GITHUB_WORKSPACE/app/.env"
