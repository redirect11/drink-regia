name: Deploy to Firebase

# DOVE VA (decisione dell'utente del 30/10/2026):
#   push su `develop`             → TEST (drink-regia-test), subito
#   tag su un commit di `main`    → PRODUZIONE (drink-regia)
#   tag fuori da `main`           → nessun deploy: si ferma e lo dice
#   lancio a mano su un ramo      → TEST, per provare un ramo di lavoro
# In produzione si va solo col tag su main: né un push né un lancio a mano
# ci arrivano, nemmeno su main. Il test segue develop, cioè quello che
# andrà nel prossimo rilascio. I segreti stanno nelle GitHub Environments
# «production» e «test», con gli stessi nomi.
on:
  push:
    branches:
      - develop
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  destinazione:
    name: Dove va
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.scelta.outputs.ambiente }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scelta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # `main` non arriva col checkout di un tag: va chiesto a parte.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "ambiente=production" >> "$GITHUB_OUTPUT"
              echo "Il tag ${GITHUB_REF_NAME} è su main → PRODUZIONE."
            else
              echo "::error::Il tag ${GITHUB_REF_NAME} non è su main: in produzione va solo un tag su main, e il test segue develop. Nessun deploy."
              exit 1
            fi
          else
            echo "ambiente=test" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} è un ramo → TEST."
          fi

  prova:
    name: Test
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'test'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: test
      progetto: drink-regia-test
      versione: ${{ github.ref_name }}
    secrets: inherit

  produzione:
    name: Produzione
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'production'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: production
      progetto: drink-regia
      versione: ${{ github.ref_name }}
    secrets: inherit
