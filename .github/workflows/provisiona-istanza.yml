name: Provisiona istanza

# L'ATTIVAZIONE DI UN'ISTANZA (REQ-FLOTTA-006, docs/flotta-nella-regia.md).
# La lancia la regia (Function avviaProvisioning) con lo slug del locale, o
# una persona dalla pagina Actions. Fa, nell'ordine:
#   1. terraform apply in infra/istanza → il progetto drinkpos-<slug> con
#      Firestore, Hosting, web app, Auth (o lo completa, se l'utente lo ha
#      creato a mano perché non c'è un'Organizzazione Google Cloud);
#   2. la licenza (licenza/attuale) e il nome del locale nel database,
#      prima dell'app: con l'app nuova un locale senza licenza si ferma;
#   3. l'app di tana-drink al `ref` chiesto, in app/: la cartella
#      clienti/<slug>/ e la build CLIENTE=<slug>;
#   4. il deploy di regole, indici, Functions e hosting sul progetto nuovo;
#   5. l'esito alla regia (sempre, anche se qualcosa è andato storto).
#
# Sta nella regia dal 29/10/2026: prima stava in tana-drink, che oggi dà
# solo l'app. Ogni regia ha il suo environment, scelto da `ambiente`:
# «flotta» (produzione) e «flotta-test» (la regia di test). Segreti:
# PROVISIONING_SA_JSON, BILLING_ACCOUNT_ID, PROVISIONING_CALLBACK_SECRET.
# Variabili: TFSTATE_BUCKET, REGIA_CALLBACK_URL, REGIA_URL, REGIA_SA_EMAIL,
# ORG_ID (facoltativa). Vedi infra/README.md.
#
# Gli input arrivano da fuori: entrano nei passi solo come variabili
# d'ambiente, mai scritti dentro un comando, e si controllano per primi
# (audit del 22/10/2026, C1).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Lo slug del locale (6-30 caratteri: minuscole, cifre, trattini)'
        required: true
        type: string
      nome_locale:
        description: 'Il nome del locale, per venue.json e le impostazioni'
        required: true
        type: string
      piano:
        description: 'base | completo'
        required: false
        type: string
        default: base
      moduli:
        description: 'Moduli in più, separati da virgola (magazzino,staff,…)'
        required: false
        type: string
        default: ''
      uid:
        description: 'Il titolare nella regia (clienti/{uid})'
        required: false
        type: string
        default: ''
      ref:
        description: 'La versione dell’app di tana-drink da pubblicare (main o vX.Y.Z)'
        required: false
        type: string
        default: main
      ambiente:
        description: 'Quale regia: produzione (environment flotta) o test (flotta-test)'
        required: false
        type: choice
        options: [produzione, test]
        default: produzione
      profilo:
        description: 'leggero (il piano Free: solo database e sito, costo zero) o completo (Functions, Storage, segreti)'
        required: false
        type: choice
        options: [completo, leggero]
        default: completo

permissions:
  contents: read

# Attivazione e aggiornamento dello stesso locale non si sovrappongono.
concurrency:
  group: istanza-${{ inputs.slug }}
  cancel-in-progress: false

env:
  SLUG: ${{ inputs.slug }}
  NOME: ${{ inputs.nome_locale }}
  PIANO: ${{ inputs.piano }}
  MODULI: ${{ inputs.moduli }}
  UID_TITOLARE: ${{ inputs.uid }}
  REF_APP: ${{ inputs.ref }}
  AMBIENTE: ${{ inputs.ambiente }}
  PROFILO: ${{ inputs.profilo }}
  PROGETTO: drinkpos-${{ inputs.slug }}
  # I segreti che le Functions dell'app di tana-drink dichiarano
  # (defineSecret): contratto con tana-drink, docs/handover.md §7.
  SEGRETI_APP: SUMUP_API_KEY

jobs:
  provisiona:
    name: Attiva ${{ inputs.slug }} (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente == 'test' && 'flotta-test' || 'flotta' }}
    steps:
      - name: Input validi
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::Slug non valido."; exit 1; }
          [[ "$PIANO" =~ ^(free|base|completo)$ ]] || { echo "::error::Piano non valido."; exit 1; }
          [[ "$MODULI" =~ ^[a-z_,]*$ ]] || { echo "::error::Moduli non validi."; exit 1; }
          [[ "$UID_TITOLARE" =~ ^[A-Za-z0-9]*$ ]] || { echo "::error::uid non valido."; exit 1; }
          [[ "$REF_APP" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::ref non valido."; exit 1; }
          [[ "$AMBIENTE" =~ ^(produzione|test)$ ]] || { echo "::error::ambiente non valido."; exit 1; }
          [[ "$PROFILO" =~ ^(completo|leggero)$ ]] || { echo "::error::profilo non valido."; exit 1; }
          if [ -z "$NOME" ] || [ ${#NOME} -gt 80 ] || [[ "$NOME" =~ [[:cntrl:]] ]]; then echo "::error::Nome del locale non valido."; exit 1; fi

      # APP DI PRODUZIONE (REQ-FLOTTA-009): un locale della regia di
      # produzione riceve solo rilasci — `main` o un tag `vX.Y.Z` — e la
      # build è di produzione. Un ramo di lavoro (`develop`) passa solo
      # sulla regia di test, con un avviso. «In produzione solo il tag su
      # main» (l'utente, 30/10/2026).
      - name: È un rilascio?
        run: |
          if [ "$REF_APP" = "main" ] || [[ "$REF_APP" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rilascio: $REF_APP"
          elif [ "$AMBIENTE" = "test" ]; then
            echo "::warning::«$REF_APP» non è un rilascio (main o tag vX.Y.Z): va bene solo sulla regia di test."
          else
            echo "::error::«$REF_APP» non è un rilascio (main o tag vX.Y.Z): in produzione un locale riceve solo rilasci."
            exit 1
          fi

      - name: La configurazione dell'environment
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          REGIA_SA_EMAIL: ${{ vars.REGIA_SA_EMAIL }}
          REGIA_URL: ${{ vars.REGIA_URL }}
          REGIA_CALLBACK_URL: ${{ vars.REGIA_CALLBACK_URL }}
        run: |
          for v in TFSTATE_BUCKET REGIA_SA_EMAIL REGIA_URL REGIA_CALLBACK_URL; do
            if [ -z "${!v}" ]; then echo "::error::Manca la variabile $v nell'environment (infra/README.md)."; exit 1; fi
          done

      # La regia: il Terraform, lo script della licenza e la sua mappa.
      - uses: actions/checkout@v4

      # L'app dei locali, alla versione chiesta. tana-drink è pubblico.
      # Con tutta la storia: serve a sapere se la versione sta su main.
      - uses: actions/checkout@v4
        with:
          repository: redirect11/tana-drink
          ref: ${{ inputs.ref }}
          path: app
          fetch-depth: 0

      # Un tag vX.Y.Z di tana-drink nasce su develop e pubblica il test
      # della Tana; diventa produzione quando il suo commit arriva su main
      # (tana-drink, docs/gitflow.md). Una regia di produzione pubblica
      # solo quello che è già su main. E l'app deve saper compilare per un
      # cliente, cosa che la 1.9.x non sa: meglio fermarsi qui che dopo
      # aver creato il progetto.
      - name: La versione dell'app va bene per questa regia?
        working-directory: app
        run: |
          if [ ! -f scripts/genera-cliente.mjs ]; then
            echo "::error::«$REF_APP» di tana-drink non sa compilare per un cliente (manca scripts/genera-cliente.mjs): serve la 1.10 o una successiva."
            exit 1
          fi
          if [ "$AMBIENTE" = "produzione" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::«$REF_APP» non è ancora su main di tana-drink: in produzione va solo quello che è uscito in produzione."
              exit 1
            fi
          fi
          # Il ramo che l'app mostra accanto alla versione (vite.config.js di
          # tana-drink lo prende da GIT_BRANCH, come fa il deploy della Tana):
          # col checkout di un tag git non lo sa da sé.
          git fetch --no-tags -q origin +refs/heads/main:refs/remotes/origin/main +refs/heads/develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor HEAD origin/main; then RAMO=main
          elif git merge-base --is-ancestor HEAD origin/develop; then RAMO=develop
          else RAMO="$REF_APP"; fi
          echo "GIT_BRANCH=$RAMO" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            app/package-lock.json
            app/functions/package-lock.json

      - name: Credenziali di provisioning
        env:
          SA_JSON: ${{ secrets.PROVISIONING_SA_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::Manca il segreto PROVISIONING_SA_JSON (infra/README.md)."; exit 1; fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROVISIONING_SA_EMAIL=$(node -e "console.log(JSON.parse(process.argv[1]).client_email)" "$SA_JSON")" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/istanza
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="prefix=istanze/$SLUG"

      # SENZA ORGANIZZAZIONE il service account non può creare progetti: il
      # progetto lo ha creato l'utente (firebase projects:create) e qui si
      # importa, una volta, nello stato. Con ORG_ID lo crea Terraform.
      # Anche il database: chi crea il progetto a mano può aver aperto
      # Firestore dalla console, e Terraform si fermerebbe con «Database
      # already exists» (drinkpos-prova-free, 30/10/2026). Se non c'è,
      # l'import non trova niente e lo crea l'apply.
      - name: Importa il progetto se esiste già
        working-directory: infra/istanza
        env:
          ORG_ID: ${{ vars.ORG_ID }}
          TF_VAR_slug: ${{ inputs.slug }}
          TF_VAR_ambiente: ${{ inputs.ambiente }}
          TF_VAR_billing_account: ${{ secrets.BILLING_ACCOUNT_ID }}
          TF_VAR_org_id: ${{ vars.ORG_ID }}
          TF_VAR_regia_sa_email: ${{ vars.REGIA_SA_EMAIL }}
          TF_VAR_provisioning_sa_email: ${{ env.PROVISIONING_SA_EMAIL }}
          TF_VAR_profilo: ${{ inputs.profilo }}
        run: |
          if ! terraform state show google_project.istanza >/dev/null 2>&1; then
            if [ -z "$ORG_ID" ]; then
              terraform import -input=false google_project.istanza "$PROGETTO" \
                || { echo "::error::Senza ORG_ID il progetto $PROGETTO va creato prima a mano (infra/README.md)."; exit 1; }
            else
              exit 0
            fi
          fi
          if ! terraform state show google_firestore_database.db >/dev/null 2>&1; then
            if terraform import -input=false google_firestore_database.db "projects/$PROGETTO/databases/(default)" >/dev/null 2>&1; then
              echo "Firestore c'era già: importato nello stato."
            fi
          fi

      - name: Terraform apply
        working-directory: infra/istanza
        env:
          TF_VAR_slug: ${{ inputs.slug }}
          TF_VAR_ambiente: ${{ inputs.ambiente }}
          TF_VAR_billing_account: ${{ secrets.BILLING_ACCOUNT_ID }}
          TF_VAR_org_id: ${{ vars.ORG_ID }}
          TF_VAR_regia_sa_email: ${{ vars.REGIA_SA_EMAIL }}
          TF_VAR_provisioning_sa_email: ${{ env.PROVISIONING_SA_EMAIL }}
          # Il leggero (il Free) nasce senza le API e gli agenti delle
          # Functions, ma con la fatturazione: l'accesso con email la chiede.
          TF_VAR_profilo: ${{ inputs.profilo }}
        run: terraform apply -input=false -auto-approve

      - name: Il .env della build dal progetto nuovo
        working-directory: infra/istanza
        run: |
          terraform output -json config_web | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
            require("fs").writeFileSync(process.argv[1], Object.entries(c).map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
          ' "$GITHUB_WORKSPACE/app/.env"
          echo "URL_ISTANZA=$(terraform output -raw url)" >> "$GITHUB_ENV"

      - name: Dipendenze
        run: |
          npm ci --prefix functions
          npm ci --prefix app
          npm ci --prefix app/functions

      # La licenza prima dell'app (tana-drink, 01/11/2026): il database c'è
      # dal Terraform, e l'app che arriva dopo la trova già.
      - name: Licenza e nome del locale nell'istanza
        env:
          REGIA_URL: ${{ vars.REGIA_URL }}
        run: |
          node scripts/licenza-istanza.mjs --project "$PROGETTO" --slug "$SLUG" \
            --nome "$NOME" --piano "$PIANO" --moduli "$MODULI" --regia "$REGIA_URL"

      # Il bucket di Storage dell'app: lo può creare solo l'API di Firebase,
      # non il Terraform (scripts/storage-istanza.mjs). Senza, il deploy di
      # storage.rules si ferma.
      - name: Lo Storage del locale
        if: env.PROFILO == 'completo'
        run: node scripts/storage-istanza.mjs --project "$PROGETTO"

      # I segreti che le Functions dell'app dichiarano: senza, Firebase non
      # le pubblica. Si creano col segnaposto, mai sovrascritti
      # (scripts/segreti-istanza.mjs).
      - name: I segreti dell'app
        if: env.PROFILO == 'completo'
        run: node scripts/segreti-istanza.mjs --project "$PROGETTO" --segreti "$SEGRETI_APP"

      - name: La cartella del cliente
        working-directory: app
        run: node scripts/genera-cliente.mjs --slug "$SLUG" --nome "$NOME"

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /
          CLIENTE: ${{ inputs.slug }}
          VITE_APP_ENV: production
          # L'app sa di essere leggera anche prima di leggere la licenza
          # (tana-drink, REQ-LIC-004): niente Functions, Storage, SumUp.
          VITE_PROFILO: ${{ env.PROFILO }}
          # A quale regia si presenta l'app al primo avvio (REQ-FLOTTA-026).
          VITE_REGIA_PROGETTO: ${{ inputs.ambiente == 'test' && 'drink-regia-test' || 'drink-regia' }}
        run: npm run build

      - name: Functions .env del progetto
        run: printf 'VENUE_NAME=%s\n' "$NOME" > "app/functions/.env.$PROGETTO"

      - name: Deploy regole, indici, Functions e hosting
        working-directory: app
        # Al primo deploy delle Functions di un progetto nuovo, i permessi
        # degli agenti di Google arrivano qualche minuto dopo («Retry the
        # deployment in a few minutes», prova-bar, 29/10/2026): si riprova
        # due volte, a 90 secondi. Il deploy si può ripetere senza danni.
        run: |
          # Il profilo leggero (il Free, REQ-FLOTTA-015) pubblica solo regole e
          # sito: niente Functions né Storage, che sono quello che costa.
          if [ "$PROFILO" = "leggero" ]; then SOLO=firestore,hosting; else SOLO=firestore,storage,functions,hosting; fi
          for tentativo in 1 2 3; do
            if npx firebase-tools deploy --only "$SOLO" --project "$PROGETTO" --force; then exit 0; fi
            if [ "$tentativo" = 3 ]; then exit 1; fi
            echo "::warning::Deploy non riuscito al tentativo $tentativo: riprovo fra 90 secondi."
            sleep 90
          done

      - name: Versione pubblicata
        run: echo "VERSIONE=v$(node -p "require('./app/package.json').version")" >> "$GITHUB_ENV"

      # L'ESITO ALLA REGIA, sempre: anche un fallimento si deve vedere nella
      # dashboard del titolare, non solo qui.
      - name: Esito alla regia
        if: always()
        env:
          CALLBACK_URL: ${{ vars.REGIA_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.PROVISIONING_CALLBACK_SECRET }}
          ESITO_JOB: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$CALLBACK_URL" ]; then echo "Nessuna REGIA_CALLBACK_URL: esito non inviato."; exit 0; fi
          if [ "$ESITO_JOB" = "success" ]; then STATO=attiva; ERR=""; else STATO=errore; ERR="Attivazione $ESITO_JOB: GitHub Actions run $RUN_ID"; fi
          node -e '
            const [url, secret, slug, stato, u, progetto, versione, errore] = process.argv.slice(1);
            fetch(url, { method: "POST", headers: { Authorization: `Bearer ${secret}`, "Content-Type": "application/json" },
              body: JSON.stringify({ slug, stato, url: u || null, progetto, versione: versione || null, errore: errore || null,
                ambiente: "produzione", operazione: "attivazione", profilo: process.env.PROFILO || null, ref: process.env.REF_APP || null }) })
              .then((r) => { console.log("regia:", r.status); if (r.status >= 300) process.exit(1); })
          ' "$CALLBACK_URL" "$CALLBACK_SECRET" "$SLUG" "$STATO" "${URL_ISTANZA:-}" "$PROGETTO" "${VERSIONE:-}" "$ERR"

      - name: Pulizia credenziali
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$GITHUB_WORKSPACE/app/.env"
