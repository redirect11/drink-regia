name: Test end-to-end
# I TEST PLAYWRIGHT SUL SITO DI TEST (REQ-DEV-004, REQ-DEV-009). Li chiama
# «Deploy to Firebase» dopo ogni deploy sul test, e si lanciano a mano.
# Girano contro drink-regia-test.web.app con le persone seminate da
# scripts/semina-test.mjs; la loro password sta nel segreto E2E_PASSWORD
# dell'environment «test» (la stessa di .env.e2e, la mette l'utente).
#
# Due modi:
# - senza collaudo: le prove in sola lettura (home, accesso, dashboard,
#   backoffice). Non scrivono niente;
# - con collaudo (un tag che pubblica sul test): in più la registrazione
#   vera di un titolare, poi eliminato dall'admin, e sul locale di prova la
#   licenza sospesa e riattivata e «Aggiorna subito» fino alla fine
#   (e2e/collaudo-*.spec.js). Scrive sulla regia di test e lancia la flotta:
#   per questo solo sui rilasci, e mai in produzione, che eredita il
#   collaudo del test (job «Collaudo riuscito sul test» di firebase-hosting.yml).
on:
  workflow_call:
    inputs:
      collaudo:
        description: 'Anche le prove che scrivono (registrazione, licenza, aggiornamento del locale di prova)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      collaudo:
        description: 'Anche le prove che scrivono (registrazione, licenza, aggiornamento del locale di prova)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    # Il nome del job è fisso: un'espressione con `inputs` nel nome del job
    # GitHub non la accetta e il job non nasce nemmeno (primo tag, 09/11/2026,
    # run 42670530702, senza un messaggio). Cosa si è provato lo dicono i
    # passi: «Collaudo sul test» è quello che la garanzia della produzione
    # cerca, fra i passi del job.
    name: Playwright sul sito di test
    runs-on: ubuntu-latest
    environment: test
    env:
      E2E_URL: https://drink-regia-test.web.app
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Le prove che non scrivono: sempre.
      - name: Prove in sola lettura
        run: npx playwright test --grep-invert collaudo
      # Le prove che scrivono: solo quando lo si chiede (un tag sul test).
      - name: Collaudo sul test
        if: inputs.collaudo
        env:
          E2E_COLLAUDO: 'true'
        run: npx playwright test e2e/collaudo-registrazione.spec.js e2e/collaudo-licenza.spec.js
      - name: Rapporto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapporto-e2e
          path: e2e/rapporto/
          retention-days: 14
